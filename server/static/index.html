<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review desk</title>
<style>
:root{--bg:#f4f2ed;--panel:#fbfaf7;--ink:#1e1d1a;--muted:#77736b;--line:#d9d5cc;--soft:#ebe8e0;--rust:#b95832;--red:#a53d32;--amber:#a57421;--green:#347044;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font:13px/1.4 system-ui,sans-serif}
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;background:var(--panel);justify-content:space-between}
.brand,.topStats{display:flex;align-items:center;gap:12px}
.brandMark{font:700 10px/24px var(--mono);width:26px;height:26px;border-radius:7px;text-align:center;background:var(--ink);color:var(--panel);letter-spacing:-.05em}
.brand strong{font-size:13px}
.repo{font:11px var(--mono);color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
.topStats{font-size:11px;color:var(--muted)}.topStats b{font:600 12px var(--mono);color:var(--ink)}
.sync{display:flex;align-items:center;gap:6px;cursor:pointer;border:0;background:none;color:var(--muted);font:11px inherit}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 12%,transparent)}
.summary{display:grid;grid-template-columns:minmax(300px,1fr) repeat(4,minmax(110px,160px));border-bottom:1px solid var(--line);background:var(--panel)}
.summaryLead{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.summaryLead strong{font-size:17px;letter-spacing:-.02em}.summaryLead small{color:var(--muted)}
.eyebrow,h2{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.metric{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.metric b{font:600 22px/1 var(--mono)}.metric span{font-size:10.5px;color:var(--muted);margin-top:4px}
.metric.hot b{color:var(--red)}.metric.amber b{color:var(--amber)}.metric.green b{color:var(--green)}
.queue{background:var(--panel);border-bottom:1px solid var(--line)}
.queueTools{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs{height:100%;display:flex;gap:2px}
.tabs button{height:100%;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:500 11.5px inherit;padding:0 10px;cursor:pointer}
.tabs button.active{color:var(--ink);border-color:var(--rust)}
.tabs b{font:500 10px var(--mono);padding:1px 5px;border-radius:8px;background:var(--soft);margin-left:4px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:4px 8px;color:var(--muted)}
.search input{width:210px;border:0;outline:0;background:transparent;font:11px inherit;color:var(--ink)}
.tableWrap{overflow:auto;max-height:44vh;position:relative}
table{width:100%;min-width:1150px;border-collapse:collapse}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px 10px;white-space:nowrap}
th{position:sticky;top:0;z-index:2;background:var(--panel);font:600 9.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
tbody tr{cursor:pointer;outline:none}
tbody tr:hover td,tbody tr:focus td{background:#f7f5f0}
tbody tr.selected td{background:#eeeae1}
tbody tr.selected td:first-child{box-shadow:inset 3px 0 var(--rust)}
.markCol{width:34px}.mark{text-align:center;font:700 12px var(--mono)}
tr.attention .mark{color:var(--red)}tr.decision .mark{color:var(--amber)}tr.ready .mark{color:var(--green)}tr.waiting .mark{color:var(--muted)}
.prTitle{display:flex;align-items:center;gap:8px;max-width:330px}
.prTitle b{font:600 11px var(--mono);color:var(--muted)}
.prTitle span{overflow:hidden;text-overflow:ellipsis;font-weight:560}
.prTitle small{margin-left:auto;color:var(--muted);font:10px var(--mono)}
.avatar{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#d9dfe0;color:#425657;font:600 8px var(--mono);margin-right:6px}
.status{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:1px 7px;font-size:10px;color:var(--muted)}
.status.attention{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line));background:color-mix(in srgb,var(--red) 6%,transparent)}
.status.decision{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,var(--line))}
.status.ready{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,var(--line))}
.check{font-size:8px}.check.CLEAN{color:var(--green)}.check.DIRTY,.check.UNSTABLE{color:var(--red)}.check.BLOCKED{color:var(--amber)}
.num{text-align:right}.mono{font:10.5px var(--mono)}
.next{max-width:230px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tag{font:600 9px var(--mono);border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--muted)}
.tag.DEFECT{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.tag.REQUEST{color:var(--amber)}.tag.QUESTION{color:#3d5a80}.tag.DOCS{color:var(--green)}
.empty{padding:28px;display:flex;flex-direction:column;align-items:center;color:var(--muted);gap:3px}.empty b{color:var(--ink)}
.detail{padding:14px 18px 28px;flex:1;min-height:240px}
.detailHead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.detailHead>div:first-child{display:grid;grid-template-columns:26px 1fr;column-gap:8px}
.largeMark{grid-row:1/3;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:700 11px var(--mono)}
.largeMark.attention{color:var(--red);border-color:var(--red)}.largeMark.decision{color:var(--amber);border-color:var(--amber)}.largeMark.ready{color:var(--green);border-color:var(--green)}
.detailKicker{font:10px var(--mono);color:var(--muted)}
h1{font-size:18px;line-height:1.2;margin:2px 0 0;letter-spacing:-.02em}
.detailActions a{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 10px;color:var(--ink);font:11px inherit;text-decoration:none}
.detailGrid{display:grid;grid-template-columns:1.3fr .9fr .9fr;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;min-height:150px}
.detailGrid>*{padding:13px 15px;min-width:0}.detailGrid>*+*{border-left:1px solid var(--line)}
h2{margin:0 0 7px}.detailGrid p{margin:0 0 12px}
.detailGrid dl{margin:0;border-top:1px solid var(--line)}
.detailGrid dl div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:11px}
.detailGrid dt{color:var(--muted)}.detailGrid dd{margin:0;font-weight:560;text-align:right}
.nextCard{background:color-mix(in srgb,var(--amber) 4%,var(--panel))}
.nextCard p{font-weight:600;font-size:14px}.nextCard small{color:var(--muted)}
.signal{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:11px}
.signal span{color:var(--muted)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:7px 10px;border-radius:6px;font:11px/1.4 system-ui;width:max-content;max-width:300px;white-space:normal;z-index:60;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.25);pointer-events:none}
.tipUnder[data-tip]:hover::after{bottom:auto;top:calc(100% + 7px)}
.tipRight[data-tip]:hover::after{left:auto;right:0;transform:none}
.testBox{margin:10px 18px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.testBox div{font:11.5px var(--mono);padding:3px 0}
.testBox .ok{color:var(--green)}.testBox .ko{color:var(--red)}.testBox .pending{color:var(--muted)}
.err{margin:10px 18px;padding:8px 12px;border:1px solid var(--red);border-radius:6px;color:var(--red);background:color-mix(in srgb,var(--red) 5%,var(--panel));display:none}
.btn{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 10px;color:var(--ink);font:11px inherit;cursor:pointer;white-space:nowrap}
@media(max-width:980px){[data-cmd]{display:none}}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.copied{border-color:var(--green);color:var(--green)}
.actionText{font:10.5px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:8px 0;color:var(--muted)}
.draft{border-left:3px solid var(--rust);padding:9px 11px;background:var(--bg);border-radius:0 6px 6px 0;margin-bottom:8px}
.draft span{font:600 9px var(--mono);color:var(--rust)}.draft p{margin:4px 0 0;white-space:pre-wrap}
.chaseWrap{padding:16px 18px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.chaseCard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px}
.chaseCard pre{font:11px var(--mono);white-space:pre-wrap;word-break:break-word;margin:6px 0 10px;color:var(--ink)}
.chaseNote{grid-column:1/-1;font-size:11px;color:var(--muted)}
.skillStamp{font:10px var(--mono);color:var(--muted)}
.feed{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--line);background:color-mix(in srgb,var(--amber) 3%,var(--panel));padding:6px 18px;display:flex;flex-direction:column;gap:2px;max-height:96px;overflow:auto;box-shadow:0 -2px 10px rgba(0,0,0,.07)}
.shell{padding-bottom:110px}
.feed div{font:11px var(--mono);color:var(--ink)}
.feed div b{color:var(--muted);font-weight:500;margin-right:8px}
.gridWrap{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.gridBlock h2{margin-bottom:6px}
.gridBlock table{min-width:0;width:100%}
.gridBlock .empty1{font-size:11px;color:var(--muted)}
@media(max-width:900px){.summary{grid-template-columns:1fr repeat(2,130px)}.metric:nth-last-child(-n+2){display:none}.detailGrid{grid-template-columns:1fr}.detailGrid>*+*{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><span class="brandMark">GW</span><strong>review desk</strong><span class="repo" id="repoLabel">…</span></div>
    <div class="topStats"><span><b id="cPrs">0</b> PR aperte</span><span><b id="cIssues">0</b> issue aperte</span><button class="sync" id="refresh"><i></i><span id="syncLabel">aggiornato —</span></button><button class="btn tipUnder tipRight" id="btnTest" data-tip="Modalità test: verifica la comunicazione desk → server → chat collegata → desk (provider, file di stato, watcher, ping roundtrip).">🧪 test</button><button class="btn tipUnder tipRight" id="btnStop" data-tip="Ferma il server del desk e avvisa la chat collegata. Si riparte dalla chat con /review-desk.">⏻ stop</button></div>
  </header>

  <section class="summary">
    <div class="summaryLead"><span class="eyebrow">coda review</span><strong id="leadTitle">carico…</strong><small id="leadSub">leggo il provider</small></div>
    <div class="metric hot tipUnder" data-tip="PR dove la prossima azione è tua: review da fare, risposte, riallineamenti"><b id="mAttention">0</b><span>mosse tue</span></div>
    <div class="metric amber tipUnder" data-tip="Scelte che può fare solo l'autore/tu: draft da chiudere, decisioni di design"><b id="mDecision">0</b><span>decisioni tue</span></div>
    <div class="metric tipUnder" data-tip="PR ferme in attesa di qualcun altro: le trovi raggruppate nel tab Solleciti"><b id="mWaiting">0</b><span>in attesa di altri</span></div>
    <div class="metric green tipUnder" data-tip="Approvate, CLEAN, zero richieste pendenti: pronte al merge"><b id="mReady">0</b><span>mergiabili ora</span></div>
  </section>

  <div class="err" id="errBox"></div>
  <div class="err" id="watcherBox" style="border-color:var(--red)"></div>
  <div class="testBox" id="testBox" style="display:none"></div>
  <div class="feed" id="feedBox" style="display:none"></div>

  <section class="queue">
    <div class="queueTools">
      <div class="tabs" id="tabs"></div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn tipUnder tipRight" id="btnAction" style="display:none"></button>
        <label class="search"><span>⌕</span><input id="q" placeholder="Filtra numero, titolo, autore…"></label>
      </div>
    </div>
    <div class="tableWrap" id="tableWrap"><table>
      <thead id="thead"></thead><tbody id="tbody"></tbody>
    </table><div class="empty" id="empty" style="display:none"><b>Niente in questa vista</b><span>Prova un altro filtro o un altro tab.</span></div></div>
    <div class="chaseWrap" id="chaseWrap" style="display:none"></div>
    <div class="gridWrap" id="gridWrap" style="display:none"></div>
  </section>

  <section class="detail" id="detail" style="display:none">
    <div class="detailHead">
      <div><span class="largeMark" id="dMark">·</span><span class="detailKicker" id="dKicker"></span><h1 id="dTitle"></h1></div>
      <div class="detailActions"><a id="dLink" target="_blank" rel="noreferrer">Apri nel browser ↗</a></div>
    </div>
    <div class="detailGrid" id="dGrid"></div>
  </section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MARK={ready:"✓",attention:"!",waiting:"○",decision:"◆"};
const STATE_LABEL={ready:"mergiabile",attention:"mossa tua",waiting:"in attesa",decision:"decisione tua"};
let meta={},prs=[],issues=[],chase={},grid=null,situa=null,session=null,loaded=false,view="grid",query="",selected=null,watcherAlive=false,lastPong=null;
const triageRunning={pr:false,issue:false};

const VIEWS=()=>[
  {id:"grid",label:"Triage",tip:"L'output delle skill di triage, in due blocchi: la griglia PR di pr-triage e la situa issue di issue-triage. Vuoto finché non le lanci.",count:(grid?grid.blocks.reduce((a,b)=>a+b.rows.length,0):0)+(situa?situa.rows.length:0)},
  {id:"queue",label:"Coda",tip:"Le PR che aspettano una mossa tua o una tua decisione (lettura live dei campi, con ⟳)",count:loaded?prs.filter(r=>r.state!=="waiting").length:"—"},
  {id:"ready",label:"Mergiabili",tip:"Approvate e CLEAN: pronte al merge",count:loaded?prs.filter(r=>r.state==="ready").length:"—"},
  {id:"waiting",label:"In attesa",tip:"Ferme su qualcun altro: reviewer o autore",count:loaded?prs.filter(r=>r.state==="waiting").length:"—"},
  {id:"chase",label:"Solleciti",tip:"Un messaggio pronto da incollare per ogni persona da sollecitare (verificati se esportati da pr-triage)",count:Object.keys(chase).length||"—"},
  {id:"all",label:"Tutte",tip:"Tutte le PR aperte in cui sei coinvolto",count:loaded?prs.length:"—"},
  {id:"issues",label:"Issues",tip:"Le issue aperte del repo, classificate per tipo",count:loaded?issues.length:"—"},
];

async function copyText(btn,text){
  try{await navigator.clipboard.writeText(text);}catch(e){
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
  }
  const old=btn.textContent;btn.textContent="copiato ✓";btn.classList.add("copied");
  setTimeout(()=>{btn.textContent=old;btn.classList.remove("copied");},1400);
}
function ageDays(d){return Math.max(0,Math.round((Date.now()-new Date(d))/864e5));}

function renderTabs(){
  const onIssues=view==="issues";
  const act=$("btnAction");
  if(view==="grid"||view==="chase"){act.style.display="none";}
  else{
    act.style.display="";
    act.textContent=onIssues?"▶ issue-run in chat":"▶ pr-run in chat";
    act.dataset.tip=onIssues
      ?"La skill issue-run lavora il batch in chat: un'analisi a contesto pulito per issue, la scelta di cosa lavorare (in chat), poi branch e PR per le scelte. Ogni passo arriva qui nel feed."
      :"La skill pr-run svuota la coda in chat: merge delle tue PR approvate, risposte alle review banali, riallineo dei branch, e il resto una PR alla volta. Ogni passo arriva qui nel feed.";
    act.disabled=!watcherAlive;
  }
  $("tabs").innerHTML=VIEWS().map(v=>`<button class="${view===v.id?"active":""} tipUnder" data-v="${v.id}" data-tip="${v.tip||""}">${v.label} <b>${v.count}</b></button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;selected=null;render();});
}

function visiblePrs(){
  const q=query.toLowerCase();
  return prs.filter(r=>{
    const ok=view==="all"||(view==="queue"&&r.state!=="waiting")||(view==="ready"&&r.state==="ready")||(view==="waiting"&&r.state==="waiting");
    return ok&&(!q||[r.n,r.title,r.author,r.todo].join(" ").toLowerCase().includes(q));
  });
}
function visibleIssues(){
  const q=query.toLowerCase();
  return issues.filter(r=>!q||[r.n,r.title,r.author,(r.labels||[]).join(" ")].join(" ").toLowerCase().includes(q));
}

const analyses={};

function analysisBlockHtml(r){
  const a=analyses[r.n];
  if(a?.status==="queued")
    return `<div class="actionText">📨 in lavorazione nella chat collegata — segui il feed in basso; l'esito compare qui ad analisi chiusa.</div>`;
  if(a?.status==="error")
    return `<div class="actionText">Errore: ${esc(a.error)}</div><button class="btn" id="dAnalyze">Riprova</button>`;
  return `<button class="btn primary" id="dAnalyze" data-tip="La skill pr-analyze legge tutto il diff, verifica i claim della descrizione e i thread, e produce il blocco cosa/storia/proposta con l'eventuale bozza di risposta. Read-only: non posta nulla.">▶ pr-analyze in chat</button>
    <small style="display:block;margin-top:4px">L'analisi gira nella chat collegata, con il suo contesto pieno; il desk mostra solo l'esito e le notifiche.</small>`;
}
function wireAnalysis(r){
  const an=$("dAnalyze");if(an)an.onclick=()=>startAnalysis(r.n);
}
async function startAnalysis(n){
  const prev=prs.find(x=>x.n===n)?.skill?.next||null;
  try{
    const resp=await fetch(`/api/pr/${n}/analyze`,{method:"POST"});
    const {queued,error}=await resp.json();
    if(error)throw new Error(error);
    analyses[n]={status:"queued"};render();
    pollQueueUntil(n,row=>(row.skill?.next||null)!==prev,()=>{delete analyses[n];});
  }catch(e){analyses[n]={status:"error",error:e.message};render();}
}
function pollQueueUntil(n,test,onDone){
  const t=setInterval(async()=>{
    try{
      const q=await fetch("/api/queue").then(r=>r.json());
      prs=q.rows;loaded=true;session=q.session;
      const row=prs.find(x=>x.n===n);
      if(row&&test(row)){clearInterval(t);onDone(row);}
      render();
    }catch(e){}
  },8000);
}

let lastStateStamp="";
async function pollState(){
  try{
    const st=await fetch("/api/state").then(r=>r.json());
    grid=st.grid;situa=st.situa;session=st.session;lastPong=st.pong||null;
    const w=st.watcher||{};
    watcherAlive=!!w.alive;
    const wb=$("watcherBox");
    if(w.chat&&!w.alive){
      wb.style.display="block";
      wb.innerHTML="<b>Chat non in ascolto.</b> La sessione collegata non sta guardando l'inbox: i bottoni sono disattivati. Nella chat che ha lanciato il desk rilancia <code>/review-desk</code> (o chiedi di riavviare il watcher).";
    }else{wb.style.display="none";}
    if(Object.keys(st.chase||{}).length||!loaded)chase=st.chase||chase;
    const box=$("feedBox"),feed=st.feed||[];
    if(feed.length){
      box.style.display="";
      box.innerHTML=feed.slice(-8).reverse().map(f=>`<div><b>${esc(f.at)}</b>${f.pr?`<b>#${f.pr}</b> `:""}${esc(f.msg)}</div>`).join("");
    }
    const stamp=JSON.stringify([grid&&grid.generated,situa&&situa.generated,feed.length,lastPong,watcherAlive]);
    if(stamp!==lastStateStamp){
      lastStateStamp=stamp;
      if(grid)triageRunning.pr=false;
      if(situa)triageRunning.issue=false;
      render();
    }
  }catch(e){}
}
setInterval(pollState,5000);

async function loadQueue(refresh){
  $("syncLabel").textContent="leggo il provider…";$("errBox").style.display="none";
  try{
    const suffix=refresh?"?refresh=1":"";
    const [q,i]=await Promise.all([
      fetch("/api/queue"+suffix).then(r=>r.json()),
      fetch("/api/issues"+suffix).then(r=>r.json()),
    ]);
    if(q.error||i.error)throw new Error(q.error||i.error);
    prs=q.rows;issues=i.rows;session=q.session;loaded=true;
    if(!Object.keys(chase).length)chase=q.chase||{};
    $("syncLabel").textContent=`aggiornato ${q.generated}`;
    render();
  }catch(e){
    $("errBox").textContent="Errore provider: "+e.message;$("errBox").style.display="block";
    $("syncLabel").textContent="lettura fallita";
  }
}

async function startTriage(){
  const flow=view==="issues"?"issue-triage":"pr-triage";
  const resp=await fetch("/api/triage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({flow})});
  const d=await resp.json();
  if(d.error){$("errBox").style.display="block";$("errBox").textContent=d.error;return;}
  triageRunning[flow==="issue-triage"?"issue":"pr"]=true;
  view="grid";render();
}
async function startRun(){
  const flow=view==="issues"?"issue-run":"pr-run";
  const resp=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({flow})});
  const d=await resp.json();
  $("errBox").style.display="block";
  $("errBox").textContent=d.error||flow+" avviato nella chat collegata: segui il feed in basso.";
}
async function startIssueAnalysis(n){
  const resp=await fetch(`/api/issue/${n}/analyze`,{method:"POST"});
  const d=await resp.json();
  $("errBox").style.display=d.error?"block":"none";
  if(d.error)$("errBox").textContent=d.error;
  else{analyses["i"+n]={status:"queued"};render();}
}

function gridRowsTable(rows){
  if(!rows.length)return `<div class="empty1">niente in questo blocco</div>`;
  return `<table><tbody>${rows.map(r=>`<tr data-n="${r.n}"><td class="mono">#${r.n}</td><td class="mono">${esc(r.date||"")}</td><td>${esc(r.author||"")}</td><td class="next" style="max-width:none">${esc(r.what||"")}</td><td><b>${esc(r.todo||"")}</b></td><td class="mono">${esc(r.autorun||"")}</td></tr>`).join("")}</tbody></table>`;
}
function renderGrid(){
  const wrap=$("gridWrap"),on=view==="grid";
  wrap.style.display=on?"flex":"none";
  if(!on)return;
  let html=`<div class="gridBlock"><h2 style="font-size:12px">Pull request ${grid?`<span class="skillStamp">— ${esc(session||"")} · ${esc(grid.generated||"")}</span>`:""}</h2>`;
  if(grid){
    html+=grid.blocks.map(b=>`<div class="gridBlock"><h2>${esc(b.title)} (${b.rows.length})</h2>${gridRowsTable(b.rows)}</div>`).join("");
    const names=Object.keys(chase);
    if(names.length)html+=`<div class="gridBlock"><h2>Da sollecitare (${names.length})</h2><div class="chaseWrap" style="padding:0">${names.map(w=>`<div class="chaseCard"><h2>@${esc(w)}</h2><pre>${esc(chase[w])}</pre><button class="btn" data-copy="${esc(chase[w])}">Copia messaggio</button></div>`).join("")}</div></div>`;
  }else if(triageRunning.pr){
    html+=`<div class="actionText">⏳ pr-triage in corso nella chat collegata — segui il feed in basso; la griglia comparirà qui.</div>`;
  }else{
    html+=`<div class="empty1" style="margin:8px 0">Nessun triage PR in questa sessione.</div>
      <button class="btn primary" id="gTriagePr" ${watcherAlive?"":"disabled"} data-tip="Esegue pr-triage nella chat collegata: coda letta con i gate veri (CODEOWNERS, protezioni, turni), verdetti e solleciti verificati. L'output è questa griglia.">▶ Esegui pr-triage in chat</button>`;
  }
  html+=`</div><div class="gridBlock" style="border-top:1px solid var(--line);padding-top:12px"><h2 style="font-size:12px">Issue ${situa?`<span class="skillStamp">— ${esc(situa.generated||"")}</span>`:""}</h2>`;
  if(situa){
    html+=`<table><tbody>${situa.rows.map(r=>`<tr data-i="${r.n}"><td class="mono">#${r.n}</td><td class="mono">${esc(r.date||"")}</td><td>${esc(r.author||"")}</td><td><span class="tag ${esc(r.type||"")}">${esc(r.type||"")}</span></td><td class="next" style="max-width:none">${esc(r.title||"")}</td><td>${esc(r.assignee||"—")}</td><td class="next" style="max-width:none">${esc(r.note||"")}</td></tr>`).join("")}</tbody></table>`;
  }else if(triageRunning.issue){
    html+=`<div class="actionText">⏳ issue-triage in corso nella chat collegata — segui il feed in basso; la situa comparirà qui.</div>`;
  }else{
    html+=`<div class="empty1" style="margin:8px 0">Nessun triage issue in questa sessione.</div>
      <button class="btn primary" id="gTriageIssue" ${watcherAlive?"":"disabled"} data-tip="Esegue issue-triage nella chat collegata: le 10 issue recenti non ancora analizzate, rank per impatto, tipo, cross-check di branch e PR esistenti. L'output è questa situa.">▶ Esegui issue-triage in chat</button>`;
  }
  html+=`</div>`;
  wrap.innerHTML=html;
  wrap.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(b,b.dataset.copy));
  const tp=$("gTriagePr");if(tp)tp.onclick=()=>{view="queue";view="grid";fetch("/api/triage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({flow:"pr-triage"})}).then(r=>r.json()).then(d=>{if(d.error){$("errBox").style.display="block";$("errBox").textContent=d.error;}else{triageRunning.pr=true;render();}});};
  const ti=$("gTriageIssue");if(ti)ti.onclick=()=>{fetch("/api/triage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({flow:"issue-triage"})}).then(r=>r.json()).then(d=>{if(d.error){$("errBox").style.display="block";$("errBox").textContent=d.error;}else{triageRunning.issue=true;render();}});};
  wrap.querySelectorAll("tr[data-n]").forEach(tr=>{tr.style.cursor="pointer";tr.onclick=async()=>{
    if(!loaded)await loadQueue(false);
    selected="p"+tr.dataset.n;view="queue";render();
  };});
}

function renderChase(){
  const wrap=$("chaseWrap"),onChase=view==="chase";
  $("tableWrap").style.display=(onChase||view==="grid")?"none":"";
  wrap.style.display=onChase?"grid":"none";
  if(!onChase)return;
  const names=Object.keys(chase);
  wrap.innerHTML=(names.length?`<div class="chaseNote">${grid
    ?`Blocchi verificati da pr-triage${session?` — ${esc(session)}`:""}. Pronti da incollare.`
    :"Blocchi grezzi, raggruppati dai soli campi del provider. Quelli verificati arrivano da ▶ pr-triage."}</div>`:"")
    +names.map(w=>`<div class="chaseCard"><h2>@${esc(w)}</h2><pre>${esc(chase[w])}</pre><button class="btn" data-copy="${esc(chase[w])}">Copia messaggio</button></div>`).join("")
    ||`<div class="chaseNote">${loaded?"Nessuno da sollecitare.":"Ancora niente qui: lancia ▶ pr-triage per i solleciti verificati, o ⟳ per il raggruppamento grezzo dai campi."}</div>`;
  wrap.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(b,b.dataset.copy));
}

function renderTable(){
  const tb=$("tbody"),th=$("thead");
  renderChase();renderGrid();
  if(view==="chase"||view==="grid"){$("empty").style.display="none";tb.innerHTML="";th.innerHTML="";return;}
  if(!loaded){
    th.innerHTML="";tb.innerHTML="";
    $("empty").style.display="flex";
    $("empty").innerHTML=`<b>Coda non caricata</b><span>Il desk parte vuoto: premi ⟳ in alto per leggere PR e issue live dal provider.</span>`;
    return;
  }
  $("empty").innerHTML=`<b>Niente in questa vista</b><span>Prova un altro filtro o un altro tab.</span>`;
  if(view==="issues"){
    th.innerHTML=`<tr><th class="markCol"></th><th>issue</th><th title="DEFECT bug reale · REQUEST nuova funzione · QUESTION domanda · DOCS documentazione — letto da label e titolo">tipo</th><th>autore</th><th>label</th><th>assegnatari</th><th class="num">commenti</th><th class="num">età</th></tr>`;
    const rows=visibleIssues();
    tb.innerHTML=rows.map(r=>`<tr data-n="${r.n}" data-kind="issue" class="${r.assignees.length?"waiting":"attention"} ${selected===`i${r.n}`?"selected":""}">
      <td class="mark"><span>${r.assignees.length?"○":"!"}</span></td>
      <td class="prTitle"><b>#${r.n}</b><span>${esc(r.title)}</span></td>
      <td><span class="tag ${r.type}">${r.type}</span></td>
      <td><span class="avatar">${esc((r.author||"??").slice(0,2).toUpperCase())}</span>${esc(r.author)}</td>
      <td class="next">${(r.labels||[]).map(l=>`<span class="tag">${esc(l)}</span>`).join(" ")||"—"}</td>
      <td>${r.assignees.join(", ")||"—"}</td>
      <td class="num">${r.comments||"—"}</td>
      <td class="num mono">${ageDays(r.created)}d</td></tr>`).join("");
    $("empty").style.display=rows.length?"none":"flex";
  }else{
    const AUTORUN_TIP="Cosa può fare pr-run da solo: A1 = merge automatico (tua PR approvata e CLEAN), A2 = edit banale chiesto dal reviewer, A3 = riallineo del branch. asks = te lo porta in chat, yours = decisione solo tua, - = tocca ad altri";
    th.innerHTML=`<tr><th class="markCol"></th><th>pull request</th><th>autore</th><th>review</th><th>stato merge</th><th class="num" title="Thread di review non risolti">aperti</th><th>base</th><th title="La prossima azione, dal vocabolario di pr-triage">prossima mossa</th><th title="${AUTORUN_TIP}">autorun</th></tr>`;
    const rows=visiblePrs();
    tb.innerHTML=rows.map(r=>`<tr data-n="${r.n}" data-kind="pr" class="${r.state} ${selected===`p${r.n}`?"selected":""}" tabindex="0">
      <td class="mark"><span title="${STATE_LABEL[r.state]}">${MARK[r.state]}</span></td>
      <td class="prTitle"><b>#${r.n}</b><span>${esc(r.title)}</span><small>${ageDays(r.created)}d</small></td>
      <td><span class="avatar">${esc((r.author||"??").slice(0,2).toUpperCase())}</span>${esc(r.author)}</td>
      <td><span class="status ${r.state}">${esc(r.decision||(r.draft?"draft":"no review"))}</span></td>
      <td><span class="check ${r.merge}">●</span> ${esc(r.merge)}</td>
      <td class="num">${r.unresolved||"—"}</td>
      <td class="mono">${esc(r.base)}</td>
      <td class="next">${esc(r.todo)}</td>
      <td class="mono" title="${AUTORUN_TIP}">${esc(r.autorun)}</td></tr>`).join("");
    $("empty").style.display=rows.length?"none":"flex";
  }
  tb.querySelectorAll("tr").forEach(tr=>tr.onclick=()=>{selected=(tr.dataset.kind==="pr"?"p":"i")+tr.dataset.n;render();});
}

function renderDetail(){
  const box=$("detail");
  if(!selected){box.style.display="none";return;}
  const kind=selected[0],n=+selected.slice(1);
  const r=(kind==="p"?prs:issues).find(x=>x.n===n);
  if(!r){box.style.display="none";return;}
  box.style.display="";
  $("dLink").href=r.url;
  if(kind==="p"){
    $("dMark").textContent=MARK[r.state];$("dMark").className="largeMark "+r.state;
    $("dKicker").textContent=`PR #${r.n} · ${r.author} · aperta ${r.created} · base ${r.base}`;
    $("dTitle").textContent=r.title;
    const reviews=(r.reviews||[]).map(v=>`<div class="signal"><b>${esc(v.who)}</b><span>${esc(v.state)} · ${esc(v.on)}</span></div>`).join("")||`<div class="signal"><span>ancora nessuna review</span></div>`;
    const closes=(r.closes||[]).map(c=>`<div class="signal"><b>issue #${c.issue}</b><span>${c.assignees.join(", ")||"senza assegnatario"}</span></div>`).join("");
    $("dGrid").innerHTML=`
      <article><h2>Quadro</h2>
        <dl><div><dt>Decisione review</dt><dd>${esc(r.decision||"—")}</dd></div>
        <div><dt>Review richieste a</dt><dd>${r.req.join(", ")||"nessuno"}</dd></div>
        <div><dt>Stato merge</dt><dd>${esc(r.merge)}</dd></div>
        <div><dt>Thread</dt><dd>${r.unresolved}/${r.threads} aperti</dd></div>
        <div><dt>Ultimo a parlare</dt><dd>${r.last?esc(`${r.last.who} · ${r.last.ch} · ${r.last.t.slice(0,10)}`):"—"}</dd></div></dl></article>
      <article class="nextCard"><h2>Prossima mossa</h2><p>${esc(r.todo)}</p>
        <div id="dAnalysis">${analysisBlockHtml(r)}</div>
        <div style="margin-top:8px"><small>autorun: ${esc(r.autorun)} — dai campi del provider.
        ${r.action?`<a href="#" id="dCopyLast" style="color:var(--muted)">copia ${r.action.kind==="command"?"comando":"prompt"} (ultima spiaggia)</a>`:""}</small></div></article>
      <aside><h2>Review</h2>${reviews}${closes?`<h2 style="margin-top:10px">Chiude</h2>${closes}`:""}</aside>
      ${r.skill?`<article style="grid-column:1/-1;border-top:1px solid var(--line)">
        <h2>Analisi della skill <span class="skillStamp">${esc(session||"")}</span></h2>
        ${r.skill.analysis?`<p>${esc(r.skill.analysis)}</p>`:""}
        ${r.skill.next?`<p><b>Proposta:</b> ${esc(r.skill.next)}</p>`:""}
        ${r.skill.draft?`<div class="draft"><span>BOZZA REVIEW</span><p>${esc(r.skill.draft)}</p></div>
        <button class="btn" id="dDraft">Copia bozza</button>`:""}
      </article>`:""}`;
    wireAnalysis(r);
    const cl=$("dCopyLast");if(cl)cl.onclick=e=>{e.preventDefault();copyText(cl,r.action.text);};
    const dr=$("dDraft");if(dr)dr.onclick=()=>copyText(dr,r.skill.draft);
  }else{
    $("dMark").textContent=r.assignees.length?"○":"!";$("dMark").className="largeMark "+(r.assignees.length?"waiting":"attention");
    $("dKicker").textContent=`issue #${r.n} · ${r.author} · aperta ${r.created}`;
    $("dTitle").textContent=r.title;
    $("dGrid").innerHTML=`
      <article><h2>Classificazione</h2>
        <dl><div><dt>Tipo</dt><dd>${esc(r.type)}</dd></div>
        <div><dt>Label</dt><dd>${r.labels.join(", ")||"nessuna"}</dd></div>
        <div><dt>Assegnatari</dt><dd>${r.assignees.join(", ")||"nessuno"}</dd></div>
        <div><dt>Commenti</dt><dd>${r.comments}</dd></div></dl></article>
      <article class="nextCard"><h2>Prossima mossa</h2><p>${r.assignees.length?`assegnata a ${esc(r.assignees.join(", "))}`:"senza assegnatario — candidata per issue-run"}</p>
        ${analyses["i"+r.n]?.status==="queued"?`<div class="actionText">📨 chip in preparazione nella chat primaria — clicca la chip lì per aprire la sessione dedicata.</div>`:`<button class="btn primary" id="dIssueAnalyze" data-tip="Prepara una SESSIONE DEDICATA per questa issue: nella chat primaria compare una chip, un tuo click apre la sessione che analizza fresca e — se è una modifica coerente singola — fixa in un worktree e apre la PR. Se è tosta, disegna le fasi (e propone un phased workflow solo se quel plugin è installato).">▶ lavora in sessione dedicata</button>`}
        <div style="margin-top:8px"><small>tipo letto da label e titolo; la sessione dedicata parte da una chip nella chat primaria e riporta qui l'esito.</small></div></article>
      <aside><h2>Età</h2><div class="signal"><b>${ageDays(r.created)} giorni</b><span>dal ${esc(r.created)}</span></div></aside>
      ${r.skill?`<article style="grid-column:1/-1;border-top:1px solid var(--line)">
        <h2>Analisi della skill <span class="skillStamp">${esc(session||"")}</span></h2>
        <p>${esc(r.skill.finding||"")}</p>
        <p class="mono">${esc([r.skill.type,r.skill.phase,r.skill.size].filter(Boolean).join(" · "))}</p>
      </article>`:""}`;
    const ia=$("dIssueAnalyze");if(ia)ia.onclick=()=>startIssueAnalysis(r.n);
  }
}

function renderSummary(){
  if(!loaded){
    ["mAttention","mDecision","mWaiting","mReady","cPrs","cIssues"].forEach(id=>$(id).textContent="—");
    $("leadTitle").textContent="desk vuoto";
    $("leadSub").textContent=`▶ pr-triage / ▶ issue-triage per il triage in chat · ⟳ per la coda live · provider ${meta.provider||"—"}`;
    return;
  }
  const c={ready:0,attention:0,waiting:0,decision:0};
  prs.forEach(r=>c[r.state]++);
  $("mAttention").textContent=c.attention;$("mDecision").textContent=c.decision;
  $("mWaiting").textContent=c.waiting;$("mReady").textContent=c.ready;
  const mine=c.attention+c.decision+c.ready;
  $("leadTitle").textContent=mine?`${mine} pull request aspettano una mossa tua`:"nessuna PR aspetta una mossa tua";
  $("leadSub").textContent=`${prs.length} PR aperte in cui sei coinvolto · ${issues.length} issue aperte · provider ${meta.provider||"—"}`;
  $("cPrs").textContent=prs.length;$("cIssues").textContent=issues.length;
}

function render(){renderTabs();renderTable();renderDetail();renderSummary();}

$("q").oninput=e=>{query=e.target.value;render();};
$("refresh").onclick=()=>loadQueue(true);
$("btnAction").onclick=startRun;
$("btnTest").onclick=runTestMode;
async function runTestMode(){
  const box=$("testBox");box.style.display="block";
  const t0=Date.now();
  const line=(id,label)=>{box.insertAdjacentHTML("beforeend",`<div id="${id}" data-label="${label}"><span class="pending">…</span> ${label}</div>`);};
  const setLine=(id,ok,extra)=>{const el=$(id);el.innerHTML=`<span class="${ok?"ok":"ko"}">${ok?"✓":"✗"}</span> ${esc(el.dataset.label)}${extra?` <span class="${ok?"pending":"ko"}">— ${esc(extra)}</span>`:""}`;};
  box.innerHTML=`<div><b>Modalità test</b> — comunicazione desk → server → chat → desk</div>`;
  line("tServer","server del desk raggiungibile");
  line("tProvider","provider (gh) autenticato");
  line("tState","file di stato scrivibile");
  line("tWatcher","watcher della chat in ascolto");
  line("tPing","ping roundtrip: desk → inbox → chat → stato → desk");
  try{
    const st=await fetch("/api/selftest").then(r=>r.json());
    setLine("tServer",true);
    setLine("tProvider",st.provider.ok,st.provider.ok?("login "+st.provider.login):st.provider.error);
    setLine("tState",st.state_file.ok,st.state_file.ok?"":st.state_file.error);
    setLine("tWatcher",st.watcher.ok,st.watcher.chat?(st.watcher.age==null?"mai visto":("ultimo poll "+Math.round(st.watcher.age)+"s fa")):"desk non in modalità chat");
    if(!st.watcher.ok){setLine("tPing",false,"saltato: nessuna chat in ascolto");return;}
    const token="t"+t0;
    await fetch("/api/ping",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});
    const started=Date.now();
    const timer=setInterval(async()=>{
      const stt=await fetch("/api/state").then(r=>r.json());
      if(stt.pong===token){clearInterval(timer);setLine("tPing",true,((Date.now()-started)/1000).toFixed(1)+"s");}
      else if(Date.now()-started>90000){clearInterval(timer);setLine("tPing",false,"nessuna risposta in 90s");}
    },2000);
  }catch(e){setLine("tServer",false,e.message);}
}
let stopArmed=null;
$("btnStop").onclick=async()=>{
  const b=$("btnStop");
  if(!stopArmed){
    b.textContent="confermi lo stop?";b.style.color="var(--red)";b.style.borderColor="var(--red)";
    stopArmed=setTimeout(()=>{stopArmed=null;b.textContent="⏻ stop";b.style.color="";b.style.borderColor="";},4000);
    return;
  }
  clearTimeout(stopArmed);stopArmed=null;
  b.textContent="fermo…";b.disabled=true;
  try{await fetch("/api/shutdown",{method:"POST"});}catch(e){}
  document.body.innerHTML='<div style="padding:40px;font:14px system-ui;color:var(--ink)"><b>Server fermato.</b><br>La chat collegata è stata avvisata. Per ripartire: <code>/review-desk</code> in chat.</div>';
};

fetch("/api/meta").then(r=>r.json()).then(m=>{meta=m;$("repoLabel").textContent=`${m.repo} · ${m.me}`;render();});
$("syncLabel").textContent="coda non caricata — ⟳ per leggerla";
pollState();
render();
</script>
