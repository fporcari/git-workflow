<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git desk</title>
<style>
:root{color-scheme:light;
  --bg:#faf9f5;--panel:#f2f0e8;--raised:#ffffff;--hover:#ebe8df;--line:#e2dfd5;--line2:#d0ccc0;
  --text:#1f1e1d;--muted:#55534d;--faint:#6b6962;--accent:#b5573a;--accentBg:#b5573a;
  --ok:#2d7a4c;--okBg:rgba(45,122,76,.10);--no:#b4432b;--noBg:rgba(180,67,43,.09);
  --q:#8a6410;--qBg:rgba(176,128,20,.12);--pr:#9b3fb0;--iss:#2d7a4c;--issBg:rgba(45,122,76,.10);
  --add:rgba(45,122,76,.11);--del:rgba(180,67,43,.10);--shadow:0 8px 24px rgba(60,50,30,.14);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#262624;--panel:#1f1e1d;--raised:#30302e;--hover:#353532;--line:#3a3936;--line2:#4a4945;
  --text:#f3f1ea;--muted:#b4b1a7;--faint:#9a978e;--accent:#d97757;--accentBg:#b5573a;
  --ok:#7cc497;--okBg:rgba(124,196,151,.13);--no:#ec8a72;--noBg:rgba(236,138,114,.13);
  --q:#e9c46a;--qBg:rgba(233,196,106,.13);--pr:#d79be2;--iss:#7cc497;--issBg:rgba(124,196,151,.12);
  --add:rgba(124,196,151,.14);--del:rgba(236,138,114,.14);--shadow:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#262624;--panel:#1f1e1d;--raised:#30302e;--hover:#353532;--line:#3a3936;--line2:#4a4945;
  --text:#f3f1ea;--muted:#b4b1a7;--faint:#9a978e;--accent:#d97757;--accentBg:#b5573a;
  --ok:#7cc497;--okBg:rgba(124,196,151,.13);--no:#ec8a72;--noBg:rgba(236,138,114,.13);
  --q:#e9c46a;--qBg:rgba(233,196,106,.13);--pr:#d79be2;--iss:#7cc497;--issBg:rgba(124,196,151,.12);
  --add:rgba(124,196,151,.14);--del:rgba(236,138,114,.14);--shadow:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font:13px/1.45 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{height:100vh;display:flex;flex-direction:column;min-height:0}
.faint{color:var(--faint)}.muted{color:var(--muted)}.small{font-size:12px}.spacer{flex:1}.mono{font-family:var(--mono)}
.c-ok{color:var(--ok)}.c-no{color:var(--no)}.c-q{color:var(--q)}.c-pr{color:var(--pr)}.c-iss{color:var(--iss)}.c-acc{color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:currentColor;flex:none}

.top{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:22px;height:22px;border-radius:6px;background:var(--text);color:var(--panel);display:flex;align-items:center;justify-content:center;font:600 10px var(--mono);flex:none}
.repo{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;min-width:0}
.seg button{all:unset;cursor:pointer;padding:3px 10px;border-radius:6px;color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.seg button b{font:500 11px var(--mono);color:var(--faint)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.icon{width:28px;height:28px;border:0;background:transparent;color:var(--faint);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.icon:hover{background:var(--hover);color:var(--text)}

.stepper{list-style:none;margin:0;padding:6px 14px;display:flex;gap:6px;border-bottom:1px solid var(--line);flex:none;background:var(--panel)}
.stepper li{width:220px;min-width:0}
.stepper button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:7px;color:var(--muted);font-size:12px;white-space:nowrap}
.stepper button:hover{background:var(--hover)}
.stepper button:focus-visible{outline:2px solid var(--accent)}
.stepper .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:10.5px var(--mono);flex:none}
.stepper b{font:500 11px var(--mono);margin-left:auto}
.stepper .cur button{background:var(--raised);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.stepper .cur .n{background:var(--text);color:var(--panel);border-color:var(--text)}
.stepper .done .n{background:var(--okBg);color:var(--ok);border-color:transparent}
.stepper .done button{color:var(--faint)}
.stepper .busy .n{border-color:var(--accent);color:var(--accent)}
.s-ok b{color:var(--ok)}.s-no b{color:var(--no)}.s-q b{color:var(--q)}.s-i b{color:var(--iss)}.s-w b{color:var(--faint)}

.content{flex:1;overflow:auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:10px;min-height:0;max-width:1100px;width:100%;align-self:center}
.lead{margin:0;font-size:13px;color:var(--muted)}
.lead strong{color:var(--text);font-weight:600}
.lbl{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--faint);text-transform:uppercase}
.lbl.q{color:var(--q)}.lbl.no{color:var(--no)}
.tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);flex:none}
.th,.row{display:grid;grid-template-columns:18px 56px minmax(0,1fr) 110px 48px 70px 30px;gap:12px;align-items:center;padding:0 10px 0 12px}
.th{height:30px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--faint);border-bottom:1px solid var(--line)}
.row{min-height:46px;padding-top:6px;padding-bottom:6px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.sel{box-shadow:inset 3px 0 0 var(--accent)}
.row.gone{opacity:.55}
.row input{margin:0;accent-color:var(--accent);cursor:pointer}
.num{font:12px var(--mono);color:var(--faint)}
.t{display:flex;gap:7px;align-items:center;min-width:0}
.t .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11.5px;padding:1px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;justify-self:start}
.chip.ok{background:var(--okBg);color:var(--ok)}.chip.no{background:var(--noBg);color:var(--no)}
.chip.q{background:var(--qBg);color:var(--q)}.chip.run{color:var(--accent)}.chip.idle{color:var(--faint)}
.ty{font:500 10px var(--mono);letter-spacing:.04em;padding:0 5px;border-radius:4px;background:var(--issBg);color:var(--iss);flex:none}
.tag{font:500 10px var(--mono);letter-spacing:.04em;padding:0 5px;border-radius:4px;background:var(--qBg);color:var(--q);flex:none}
.gh{all:unset;cursor:pointer;width:28px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.gh:hover{background:var(--raised);color:var(--text)}
.gh:focus-visible{outline:2px solid var(--accent)}
.draft{padding:2px 12px 12px 98px;display:flex;flex-direction:column;gap:5px;background:var(--raised);border-bottom:1px solid var(--line)}
.draft textarea,.lean textarea{width:100%;resize:vertical;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--text);font-size:12.5px;line-height:1.5;padding:8px 10px;min-height:64px}
.dh{font-size:11.5px;color:var(--faint)}
.fold{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center;padding:0 2px}
.how{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);border:1px dashed var(--line2);border-radius:8px;padding:8px 10px}
.act{display:flex;align-items:center;gap:10px;padding:10px 0 12px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);z-index:2}
.pr .act{position:static;background:none}
.keys{font-size:11px;color:var(--faint);font-family:var(--mono)}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);color:var(--text);font-size:12.5px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accentBg);border-color:var(--accentBg);color:#fff;font-weight:500}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accentBg)}
.btn.sm{height:28px;font-size:12px;padding:0 10px}
.kbd{font:10.5px var(--mono);min-width:16px;height:16px;padding:0 4px;border-radius:4px;border:1px solid currentColor;opacity:.75;display:inline-flex;align-items:center;justify-content:center}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:18px;color:var(--muted);font-size:12.5px}

.progline{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.prog i{display:block;height:100%}

.doubt{display:flex;flex-direction:column;gap:12px;max-width:820px}
.cnt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.pips{display:flex;gap:4px}.pips i{width:18px;height:4px;border-radius:2px;background:var(--line2);display:block}.pips i.on{background:var(--q)}
.ph{display:grid;grid-template-columns:56px minmax(0,1fr) 28px;gap:4px 8px;align-items:start}
.ptitle{font-weight:600;font-size:14px;line-height:1.35}
.meta{grid-column:2;font-size:12px;color:var(--faint)}
.zoomlink{all:unset;grid-column:2;justify-self:start;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--accent);padding:3px 8px 3px 6px;margin-left:-6px;border-radius:6px}
.zoomlink:hover{background:var(--hover)}
.sec{display:flex;flex-direction:column;gap:5px}
.sec p{margin:0;font-size:13px;line-height:1.5}
.diff{font:11.5px var(--mono);border:1px solid var(--line);border-radius:8px;overflow:auto;background:var(--bg)}
.dl{display:flex;white-space:pre;line-height:1.65;padding:0 10px}
.dl.add{background:var(--add)}.dl.del{background:var(--del)}.dl.hk{background:var(--raised);color:var(--faint)}
.lean{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg)}
.next{font-size:12px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.next span.p{border:1px solid var(--line);border-radius:999px;padding:0 8px;font:11px var(--mono)}

.rc{border-bottom:1px solid var(--line);background:var(--bg)}
.rc:last-child{border-bottom:0}
.rc.open{background:var(--raised);box-shadow:inset 3px 0 0 var(--q)}
.rc-h{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:8px;align-items:center;padding:4px 6px 4px 12px}
.rsel{all:unset;box-sizing:border-box;display:grid;grid-template-columns:56px minmax(0,1fr) auto 14px;gap:8px;align-items:center;padding:6px 0;cursor:pointer;min-width:0}
.rsel:focus-visible{outline:2px solid var(--accent)}
.chev{color:var(--faint);display:flex}.rc.open .chev{transform:rotate(90deg)}
.body{padding:2px 12px 12px 76px;display:flex;flex-direction:column;gap:9px}
.say{display:flex;flex-direction:column;gap:3px}
.quote{margin:0;font-size:13px;line-height:1.5;border-left:2px solid var(--line2);padding-left:9px}
.mine{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}

.sum,.ppl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.sl{display:grid;grid-template-columns:22px 170px minmax(0,1fr);gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.sl:first-child,.pr:first-child{border-top:0}
.sl .ns{font:11.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:grid;grid-template-columns:30px 110px minmax(0,1fr) 150px;gap:8px;align-items:center;padding:7px 8px 7px 10px;border-top:1px solid var(--line)}
.pr.me{background:var(--raised)}
.av{width:24px;height:24px;border-radius:50%;background:var(--raised);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--muted)}
.pr.me .av{background:var(--accentBg);border-color:var(--accentBg);color:#fff}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what b{font:500 12px var(--mono);color:var(--text)}
.pr .act{padding:0;justify-content:flex-end}
.def{font-size:12px;color:var(--muted);margin:-4px 0 0}

.sb{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--faint);min-width:0}
.sb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .mono{font-size:11px}
.sbb{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--muted)}
.sbb:focus-visible{outline:2px solid var(--accent)}
.drawer{position:fixed;left:0;right:0;bottom:26px;max-height:40vh;overflow:auto;background:var(--panel);border-top:1px solid var(--line2);box-shadow:var(--shadow);padding:10px 16px;font-size:12px;z-index:20}
.drawer ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.drawer li{display:flex;gap:10px}
.drawer li .mono{color:var(--faint)}

.zoom{position:fixed;inset:0;z-index:30;background:rgba(20,18,15,.35);display:flex;justify-content:flex-end}
.zp{width:min(920px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.zh{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--line)}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;color:var(--muted);font-size:12.5px}
.back:hover{background:var(--hover);color:var(--text)}
.zt{padding:14px 18px 12px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 10px;border-bottom:1px solid var(--line);flex:none}
.zt .ptitle{font-size:16px}
.zb{flex:1;min-height:0;overflow:auto;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.side{border-left:1px solid var(--line);padding-left:18px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.tl li{position:relative;font-size:12.5px;line-height:1.45}
.tl li::before{content:"";position:absolute;left:-18.5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--line2)}
.tl li.now::before{background:var(--q)}
.tl .d{display:block;font:11px var(--mono);color:var(--faint)}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:5px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--faint);margin:0}.kv dd{margin:0}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{all:unset;cursor:pointer;font:11.5px var(--mono);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.zf{flex:none;border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:8px}
.toast{position:fixed;top:52px;right:16px;z-index:40;background:var(--raised);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow);max-width:420px}

@media (max-width:760px){
  .top{gap:6px;padding:0 8px}.repo,.pill,.logo{display:none}
  .seg{flex:1;overflow-x:auto;scrollbar-width:none}.seg button{padding:3px 7px}
  .stepper{padding:6px 8px;gap:4px}.stepper li{width:auto}
  .stepper li:not(.cur) .lab{display:none}.stepper li.cur{flex:1}
  .content{padding:10px 12px 0}
  .th{display:none}
  .row{grid-template-columns:16px 46px minmax(0,1fr) 26px}
  .row .cell{display:none}
  .draft{padding-left:12px}
  .zb{grid-template-columns:minmax(0,1fr)}.side{border-left:0;padding-left:0}
  .sl{grid-template-columns:22px minmax(0,1fr)}.sl .ns{grid-column:2}
  .pr{grid-template-columns:30px minmax(0,1fr)}.pr .what,.pr .act{grid-column:2}
}
</style>
</head>
<body>
<main class="shell" id="shell">
  <header class="top">
    <span class="logo" aria-hidden="true">GW</span>
    <span class="repo" id="repo">git desk</span>
    <nav class="seg" id="seg" aria-label="Sezione"></nav>
    <span class="spacer"></span>
    <span class="pill" id="chat"></span>
    <button class="icon" id="refresh" title="Rileggi GitHub" aria-label="Rileggi GitHub"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></button>
    <button class="icon" id="theme" title="Tema chiaro o scuro" aria-label="Tema chiaro o scuro"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    <button class="icon" id="power" title="Spegni il desk" aria-label="Spegni il desk"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5v5"/><path d="M4.6 4.6a5 5 0 1 0 6.8 0"/></svg></button>
  </header>
  <ol class="stepper" id="steps" aria-label="Passi"></ol>
  <section class="content" id="content" aria-live="polite"></section>
  <footer class="sb" id="sb"></footer>
  <div class="drawer" id="drawer" hidden></div>
  <div class="zoom" id="zoom" hidden></div>
  <div class="toast" id="toast" hidden></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GH='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.7"/><circle cx="4.5" cy="12.5" r="1.7"/><circle cx="11.5" cy="5.5" r="1.7"/><path d="M4.5 5.2v5.6M11.5 7.2c0 2.6-2.4 3.2-6 3.9"/></svg>';
const CHECK='<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>';
const CHEV='<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>';
const FAST=4000,SLOW=30000;

const SECTIONS=[
  {id:"review",label:"Da rivedere",tag:"DA RIVEDERE",steps:[
    {id:"approve",label:"Approvabili",done:"Approvate",cls:"s-ok"},
    {id:"changes",label:"Da respingere",done:"Respinte",cls:"s-no"},
    {id:"doubt",label:"Dubbie",done:"Dubbie",cls:"s-q"},
    {id:"done",label:"Fatto"}]},
  {id:"mine",label:"Mie",tag:"MIE",steps:[
    {id:"merge",label:"Da mergiare",cls:"s-ok"},
    {id:"fix",label:"Le sistema Claude",cls:"s-i"},
    {id:"decide",label:"Da decidere",cls:"s-q"},
    {id:"waiting",label:"In attesa",cls:"s-w"}]},
  {id:"issue",label:"Issue",tag:"ISSUE",steps:[
    {id:"close",label:"Da chiudere",cls:"s-ok"},
    {id:"claude",label:"Le fa Claude",cls:"s-i"},
    {id:"decide",label:"Da decidere",cls:"s-q"},
    {id:"done",label:"Fatto"}]},
  {id:"whose",label:"A chi tocca",tag:"A CHI TOCCA",steps:[]}];

let meta={},wiz=null,st={},writeToken="",loaded=false;
let section="review",stepOf={},off=new Set(),sel={},drafts={},doubtAt=0,openRow={};
let zoomed=null,zoomCache={},drawerOpen=false,paintedAt=0;
let wizEtag=null,stateEtag=null,providerRefresh=null,toastTimer=0;

const key=c=>(c.repo||"")+"#"+c.n;
const sectionDef=id=>SECTIONS.find(s=>s.id===id);
const sec=id=>wiz&&wiz[id];
const stepRows=(s,step)=>{const x=sec(s);if(!x)return[];const f=(x.steps||[]).find(p=>p.id===step);return f?f.rows:[];};
const age=d=>d==null?"":d+"g";
const STANCE_CHIP={approve:["ok","approvabile"],changes:["no","da respingere"],doubt:["q","dubbia"]};

function currentStep(){
  const s=section;if(s==="whose")return null;
  if(stepOf[s])return stepOf[s];
  const x=sec(s);return (x&&x.first)||SECTIONS.find(d=>d.id===s).steps[0].id;
}
function setSection(id){section=id;zoomed=null;render();}
function setStep(id){stepOf[section]=id;doubtAt=0;render();}

/* ---- data ---- */
async function getJSON(url,etag){
  const headers=etag?{"If-None-Match":etag}:{};
  if(document.hidden)headers["X-Git-Workflow-Background"]="1";
  const resp=await fetch(url,{headers});
  if(resp.status===304)return [null,etag];
  if(!resp.ok)throw new Error((await resp.json()).error||resp.status);
  return [await resp.json(),resp.headers&&resp.headers.get?resp.headers.get("ETag"):null];
}
async function post(path,body){
  const resp=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Git-Workflow-Token":writeToken},body:JSON.stringify(body||{})});
  const data=await resp.json().catch(()=>({}));
  if(!resp.ok)throw new Error(data.error||("HTTP "+resp.status));
  return data;
}
function applyDesk(d){
  meta=d.meta||{};writeToken=meta.write_token||writeToken;
  wiz=d.wizard||wiz;st=d.state||st;loaded=true;paintedAt=Date.now();
  providerRefresh=(st.provider_refresh&&st.provider_refresh.token)||providerRefresh;
  if(document.title!==undefined)document.title="Git desk · "+(meta.repo||"");
}
function applyWizard(w){if(w)wiz=w;}
function applyState(s){
  if(!s)return false;
  st=s;const token=(s.provider_refresh&&s.provider_refresh.token)||null;
  const moved=token&&token!==providerRefresh;providerRefresh=token||providerRefresh;
  return moved;
}
async function loadDesk(refetch){
  const d=refetch?await post("/api/fetch",{}):(await getJSON("/api/desk"))[0];
  if(d)applyDesk(d);render();
}
async function poll(withWizard){
  try{
    const [s,se]=await getJSON("/api/state",stateEtag);stateEtag=se;
    if(applyState(s)){await loadDesk(true);return;}
    if(withWizard||s){const [w,we]=await getJSON("/api/wizard",wizEtag);wizEtag=we;applyWizard(w);}
    renderSoft();
  }catch(e){renderStatus("non raggiungo il desk: "+e.message);}
}
function preparing(){const p=(wiz&&wiz.prepare)||{};return ["pr","issue"].some(k=>p[k]&&p[k].status==="running");}

/* ---- render ---- */
function renderHeader(){
  $("repo").textContent=meta.repo||"git desk";
  $("seg").innerHTML=SECTIONS.map(s=>{
    const x=sec(s.id);const n=x&&typeof x.count==="number"?`<b>${x.count}</b>`:"";
    return `<button data-act="section" data-id="${s.id}" class="${s.id===section?"on":""}" aria-current="${s.id===section}">${esc(s.label)} ${n}</button>`;
  }).join("");
  const chat=st.chat||{};
  $("chat").innerHTML=chat.attached?'<span class="dot c-ok"></span>chat collegata':'<span class="dot faint"></span>chat non collegata';
}
function stepCount(s,step){
  if(step==="done")return null;
  return stepRows(s,step).length;
}
function renderSteps(){
  const def=sectionDef(section);
  if(!def.steps.length){$("steps").innerHTML="";$("steps").hidden=true;return;}
  $("steps").hidden=false;
  const cur=currentStep();const order=def.steps.map(s=>s.id);
  $("steps").innerHTML=def.steps.map((s,i)=>{
    const n=stepCount(section,s.id);const rows=s.id==="done"?[]:stepRows(section,s.id);
    const past=rows.length>0&&rows.every(c=>c.sent||c.sending);
    const cls=[s.id===cur?"cur":"",past?"done":"",s.cls||""].join(" ");
    const mark=past?CHECK:i+1;
    return `<li class="${cls}"><button data-act="step" data-id="${s.id}" aria-current="${s.id===cur?"step":"false"}"><span class="n">${mark}</span><span class="lab">${esc(past&&s.done?s.done:s.label)}</span>${n==null?"":`<b>${n}</b>`}</button></li>`;
  }).join("");
}
function checked(s,step){return stepRows(s,step).filter(c=>!off.has(s+":"+step+":"+key(c))&&!c.sending&&!c.sent);}
function rowCheckbox(s,step,c){
  const id=s+":"+step+":"+key(c);const dis=c.sending||c.sent;
  return `<input type="checkbox" data-act="toggle" data-id="${esc(id)}" aria-label="Includi #${c.n}" ${!off.has(id)&&!dis?"checked":""} ${dis?"disabled":""}>`;
}
function ghButton(c){return `<button class="gh" data-act="gh" data-url="${esc(c.url||"")}" aria-label="Apri #${c.n} su GitHub" title="Apri su GitHub">${GH}</button>`;}
function chipFor(c){
  if(c.sent)return `<span class="chip ok">inviata</span>`;
  if(c.sending)return `<span class="chip run">in invio…</span>`;
  if(c.loop)return `<span class="chip run">${c.loop==="needs-input"?"aspetta te":"in background"}</span>`;
  const checks=c.checks||{};
  if(checks.state)return `<span class="cell ${checks.state==="SUCCESS"?"c-ok":"c-no"}">${checks.state==="SUCCESS"?"verdi":esc(checks.state.toLowerCase())}</span>`;
  return `<span class="cell">—</span>`;
}
function table(s,step,rows,opts){
  opts=opts||{};
  const head=`<div class="th" role="row"><span></span><span>PR</span><span>TITOLO E PERCHÉ</span><span>AUTORE</span><span>ETÀ</span><span>${opts.col||"TEST"}</span><span></span></div>`;
  const picked=sel[s+":"+step];
  const selected=picked!==undefined?picked:(opts.below&&!opts.nocheck&&rows.length?key(rows[0]):null);
  return `<div class="tbl" role="table">${head}${rows.map(c=>{
    const k=key(c);const tags=(c.labels||[]).includes("needs-verification")?'<span class="tag">needs-verification</span>':"";
    const line=`<div class="row ${selected===k?"sel":""} ${c.sent?"gone":""}" role="row" data-act="pick" data-id="${esc(k)}">${opts.nocheck?"<span></span>":rowCheckbox(s,step,c)}<span class="num">${esc(c.label||"#"+c.n)}</span><span><span class="t">${c.type?`<span class="ty">${esc(c.type)}</span>`:""}${tags}<span class="tt">${esc(c.title)}</span></span><span class="why">${esc(c.why||c.todo||"")}</span></span><span class="cell">${esc(c.author||"")}</span><span class="cell">${age(c.age)}</span>${opts.cell?opts.cell(c):chipFor(c)}${ghButton(c)}</div>`;
    return line+(opts.below?opts.below(c,selected===k):"");
  }).join("")}</div>`;
}
function draftOf(c,fallback){const k=key(c);return k in drafts?drafts[k]:(fallback!=null?fallback:(c.draft||c.body||""));}
function act(label,cta,disabled,note,extra){
  return `<div class="act">${cta?`<button class="btn primary" data-act="cta" ${disabled?"disabled":""}>${cta}<span class="kbd">⏎</span></button>`:""}${extra||""}<span class="spacer"></span><span class="faint small">${note||""}</span></div>${label?`<div class="keys">${label}</div>`:""}`;
}
const chatNote=()=>(st.chat||{}).attached?null:"serve la chat collegata: le azioni pubbliche partono da lì";

function bodyPrepare(){
  const r=sec("review")||{};const p=((wiz||{}).prepare||{}).pr||{};
  const ready=[].concat(...(r.steps||[]).filter(x=>x.id!=="done").map(x=>x.rows.map(c=>Object.assign({},c,{step:x.id}))));
  const pending=r.pending||[];const total=ready.length+pending.length;
  const pct=n=>total?Math.round(n*100/total)+"%":"0";
  const by=id=>ready.filter(c=>c.step===id).length;
  const list=ready.concat(pending).sort((a,b)=>b.n-a.n).map(c=>{
    const chip=c.step?`<span class="chip ${STANCE_CHIP[c.step][0]}">${STANCE_CHIP[c.step][1]}</span>`:`<span class="chip ${c.chip&&c.chip!=="in coda"?"run":"idle"}">${esc(c.chip||"in coda")}</span>`;
    return `<div class="row" data-act="pick" data-id="${esc(key(c))}"><span></span><span class="num">${esc(c.label||"#"+c.n)}</span><span class="t"><span class="tt">${esc(c.title)}</span></span><span class="cell">${esc(c.author||"")}</span><span class="cell">${age(c.age)}</span>${chip}${ghButton(c)}</div>`;
  }).join("");
  return `<p class="lead"><strong>${ready.length?"Puoi già cominciare.":"Preparo la review."}</strong> ${esc(p.phrase||"")}${ready.length?" · le pronte sono nei passi qui sopra, le altre ci arrivano mentre lavori.":""}</p>
  <div class="progline"><div class="prog" aria-label="${ready.length} di ${total}"><i style="width:${pct(by("approve"))};background:var(--ok)"></i><i style="width:${pct(by("changes"))};background:var(--no)"></i><i style="width:${pct(by("doubt"))};background:var(--q)"></i></div><span>${ready.length} di ${total}</span></div>
  <div class="tbl">${list||'<div class="empty">Nessuna PR aspetta la tua review.</div>'}</div>
  ${act(null,null,true,"costano solo le PR nuove o cambiate; le altre riprendono l'analisi già fatta")}`;
}

function bodyReview(step){
  const r=sec("review")||{};
  if(step==="prepare")return bodyPrepare();
  const rows=stepRows("review",step);const note=chatNote();
  if(step==="approve"){
    const n=checked("review","approve").length,all=n===rows.filter(c=>!c.sent&&!c.sending).length;
    const fold=r.waiting_author?`<div class="fold">${CHEV}${r.waiting_author} PR aspettano l'autore dopo una tua richiesta: non tocca a te</div>`:"";
    if(!rows.length)return emptyStep("Nessuna PR approvabile, per ora.",r);
    return `<p class="lead"><strong>Claude le approverebbe.</strong> Piccole, mirate, con il test. Sono già spuntate: togli la spunta a quelle che vuoi leggere tu.</p>${table("review","approve",rows)}${fold}
    ${act("j k muovi · x spunta · spazio vedi tutto · o GitHub · ⏎ approva",n?(all?`Approva tutte e ${n}`:`Approva le ${n} spuntate`):"Nessuna spuntata",!n||!!note,note||"il merge resta a chi ha aperto la PR",'<button class="btn" data-act="skipstep">Salta il passo</button>')}`;
  }
  if(step==="changes"){
    if(!rows.length)return emptyStep("Nessuna PR da respingere.",r);
    const n=checked("review","changes").length;
    const below=(c,open)=>open?`<div class="draft"><span class="lbl no">Motivazione</span><textarea id="draft-${esc(key(c))}" data-draft="${esc(key(c))}" aria-label="Motivazione per #${c.n}">${esc(draftOf(c))}</textarea><span class="dh">${esc(c.why||"")}</span></div>`:"";
    return `<p class="lead"><strong>Claude le respingerebbe.</strong> Sono già spuntate. Seleziona una riga per leggere sotto la motivazione e correggerla.</p>${table("review","changes",rows,{below})}
    ${act("j k muovi · ⏎ motivazione · x spunta · spazio vedi tutto · o GitHub",n===1?"Invia la richiesta":`Invia le ${n} richieste`,!n||!!note,note||"partono come review «Request changes»",'<button class="btn" data-act="skipstep">Salta il passo</button>')}`;
  }
  if(step==="doubt")return bodyDoubt(rows,r);
  return bodyDone("review");
}
function emptyStep(text,r){
  const pending=(r&&r.pending||[]).length;
  return `<div class="empty">${esc(text)}${pending?` ${pending} ancora in preparazione.`:""}</div>${act(null,null,true,"",'<button class="btn" data-act="skipstep">Passo successivo</button>')}`;
}
function hunkHtml(h){
  if(!h)return "";
  if(h.error||h.missing)return `<p class="faint small">${esc(h.path)} · ${h.error?esc(h.error):"il pezzo indicato non c'è più nel diff"}</p>`;
  const lines=(h.lines||[]).map(l=>`<div class="dl ${l[0]==="+"?"add":l[0]==="-"?"del":""}">${esc(l)}</div>`).join("");
  return `<div class="diff" aria-label="Estratto del diff"><div class="dl hk">${esc(h.header)}</div>${lines}${h.cut?'<div class="dl hk">…</div>':""}</div>`;
}
function bodyDoubt(rows,r){
  if(!rows.length)return emptyStep("Nessuna PR dubbia.",r);
  doubtAt=Math.max(0,Math.min(doubtAt,rows.length-1));
  const c=rows[doubtAt];const k=key(c);const z=zoomCache[k];
  if(!z&&c.hunk)fetchZoom(c);
  const lean=c.lean==="changes"?"chiedere modifiche":c.lean==="approve"?"approvare":"—";
  const nexts=rows.slice(doubtAt+1,doubtAt+4).map(x=>`<span class="p">${esc(x.label||"#"+x.n)}</span>`).join("");
  return `<div class="doubt">
  <div class="cnt"><span class="pips">${rows.map((_,i)=>`<i class="${i===doubtAt?"on":""}"></i>`).join("")}</span><span>dubbia ${doubtAt+1} di ${rows.length}</span><span class="spacer"></span><button class="icon" data-act="prevdoubt" aria-label="Dubbia precedente">‹</button><button class="icon" data-act="nextdoubt" aria-label="Dubbia successiva">›</button></div>
  <div class="ph"><span class="num">${esc(c.label||"#"+c.n)}</span><span class="ptitle">${esc(c.title)}</span>${ghButton(c)}<span class="meta">${esc(c.author||"")} · ${age(c.age)}${c.sent?" · inviata":c.sending?" · in invio…":""}</span><button class="zoomlink" data-act="zoom" data-id="${esc(k)}">Vedi tutta la situazione <span class="kbd">spazio</span></button></div>
  <div class="sec"><span class="lbl q">Il dubbio</span><p>${esc(c.doubt||c.why||"")}</p></div>
  ${c.hunk?`<div class="sec"><span class="lbl">Dove · ${esc(c.hunk.path)}</span>${!z||z.loading?'<p class="faint small">leggo il pezzo di diff…</p>':z.hunk?hunkHtml(z.hunk):'<p class="faint small">'+esc(c.hunk.header)+' · il diff di questa PR non è leggibile qui</p>'}</div>`:""}
  <div class="lean"><span class="lbl">Claude propende per · ${esc(lean)}</span>${c.lean==="changes"?`<textarea id="draft-${esc(k)}" data-draft="${esc(k)}" aria-label="Testo della richiesta">${esc(draftOf(c))}</textarea>`:""}</div>
  ${nexts?`<div class="next"><span>Poi:</span>${nexts}</div>`:""}
  </div>
  <div class="act"><button class="btn ${c.lean==="approve"?"primary":""}" data-act="doubt-a" ${chatNote()||c.sent||c.sending?"disabled":""}><span class="kbd">A</span>Approva</button><button class="btn ${c.lean==="changes"?"primary":""}" data-act="doubt-r" ${chatNote()||c.sent||c.sending?"disabled":""}><span class="kbd">R</span>Chiedi modifiche</button><button class="btn" data-act="doubt-s"><span class="kbd">S</span>Salta a domani</button><span class="spacer"></span><span class="faint small">${esc(chatNote()||"o scrivi a Claude, nella chat")}</span></div>`;
}
function summaryLine(cls,icon,label,ns){return ns&&ns.length?`<div class="sl"><span class="${cls}">${icon}</span><span><strong>${ns.length}</strong> ${label}</span><span class="ns">${ns.map(n=>"#"+n).join(" ")}</span></div>`:"";}
function bodyDone(s){
  const x=sec(s)||{};const step=(x.steps||[]).find(p=>p.id==="done")||{};const sum=step.summary||{};
  const lines=s==="review"?summaryLine("c-ok","✓","approvate",sum.approve)+summaryLine("c-no","✕","richieste di modifica",sum.changes)+summaryLine("c-q","›","saltate a domani",sum.skip)
    :summaryLine("c-ok","✓","chiuse",sum.close);
  return `<span class="lbl">Oggi</span><div class="sum">${lines||'<div class="sl"><span></span><span class="faint">niente ancora</span></div>'}</div>
  <span class="lbl">A chi tocca adesso</span><p class="def">Per ogni persona, le PR e le issue in cui la prossima mossa è sua.</p>${peopleHtml()}
  ${act(null,s==="review"?"Passa alle issue":"Passa a chi tocca",false,"")}`;
}
function peopleHtml(){
  const ppl=(wiz&&wiz.whose)||[];
  return `<div class="ppl">${ppl.map((p,i)=>{
    if(p.me)return `<div class="pr me"><span class="av">${esc((p.who||"?").slice(0,1).toUpperCase())}</span><span class="nm">tu</span><span class="what"><b>${p.review}</b> da rivedere · <b>${p.mine}</b> mie da muovere · <b>${p.issues_mine}</b> issue tue, <b>${p.for_claude}</b> le può fare Claude</span><span class="act"><button class="btn sm" data-act="section" data-id="issue">Passa alle issue</button></span></div>`;
    if(p.who==null)return `<div class="pr"><span class="av">·</span><span class="nm muted">nessuno</span><span class="what"><b>${p.unassigned}</b> issue senza un responsabile</span><span class="act"><button class="btn sm" data-act="section" data-id="issue">Smistale</button></span></div>`;
    const parts=[["merge","da mergiare"],["fix","da correggere"],["review","review ferme"],["wait","in attesa"],["issues","issue senza PR"]].filter(([k])=>p[k]&&p[k].length).map(([k,l])=>`<b>${p[k].length}</b> ${l}`).join(" · ");
    return `<div class="pr"><span class="av">${esc((p.who||"?").slice(0,2).toUpperCase())}</span><span class="nm">${esc(p.who)}</span><span class="what">${parts}</span><span class="act">${p.chase?`<button class="btn sm" data-act="copy" data-i="${i}">Copia sollecito</button>`:""}</span></div>`;
  }).join("")}</div>`;
}

function bodyMine(step){
  const rows=stepRows("mine",step);
  if(step==="merge"){
    if(!rows.length)return emptyStep("Nessuna tua PR pronta da mergiare.");
    const n=checked("mine","merge").length;
    return `<p class="lead"><strong>Pronte da mergiare.</strong> Approvate, CLEAN, niente in sospeso: il clic lancia pr-loop su queste, che le mergia secondo le regole di casa.</p>${table("mine","merge",rows,{col:"STATO"})}
    ${act("j k muovi · x spunta · o GitHub · ⏎ mergia",n?`Mergia le ${n}`:"Nessuna spuntata",!n,"squash solo se il branch ha fixup o merge")}`;
  }
  if(step==="fix"){
    if(!rows.length)return emptyStep("Niente che Claude possa sistemare da solo.");
    const n=checked("mine","fix").length;
    return `<p class="lead"><strong>Le sistema Claude.</strong> Richieste chiare o riallineamenti: un worktree per PR, in background. Ti interrompe solo a lavoro fatto.</p>${table("mine","fix",rows,{col:"STATO"})}
    ${act("j k muovi · x spunta · o GitHub · ⏎ avvia",n?`Falle sistemare (${n})`:"Nessuna spuntata",!n,"pr-loop in background, quattro alla volta")}`;
  }
  if(step==="decide"){
    if(!rows.length)return emptyStep("Nessuna scelta che tocchi a te.");
    const open=openRow.mine||key(rows[0]);
    return `<p class="lead"><strong>Qui la palla è tua.</strong> Il revisore chiede qualcosa che Claude non deve decidere da solo. Seleziona una PR per leggere la richiesta e la proposta.</p>
    <div class="tbl">${rows.map(c=>{const k=key(c);const isOpen=k===open;
      const body=!isOpen?"":c.options?`<div class="body"><div class="say"><span class="lbl q">Il revisore chiede</span><p class="quote">${esc(c.ask)}</p></div><div class="say"><span class="lbl">Claude</span><p class="mine">${esc(c.why||"")}</p></div><div class="opts">${c.options.map((o,i)=>`<button class="btn sm ${i===0?"primary":""}" data-act="option" data-id="${esc(k)}" data-i="${i}"><span class="kbd">${i+1}</span>${esc(o)}</button>`).join("")}</div></div>`
        :`<div class="body"><div class="say"><span class="lbl q">Cosa manca</span><p class="mine">${esc(c.todo)}</p></div>${c.why?`<div class="say"><span class="lbl">Claude</span><p class="mine">${esc(c.why)}</p></div>`:""}<div class="opts"><button class="btn sm primary" data-act="loopone" data-id="${esc(k)}" data-flow="pr-loop">Lavorala in chat</button></div></div>`;
      return `<div class="rc ${isOpen?"open":""}"><div class="rc-h"><button class="rsel" data-act="openrow" data-id="${esc(k)}" aria-expanded="${isOpen}"><span class="num">${esc(c.label||"#"+c.n)}</span><span class="t"><span class="tt">${esc(c.title)}</span></span><span class="cell">${age(c.age)}</span><span class="chev">${CHEV}</span></button>${ghButton(c)}</div>${body}</div>`;}).join("")}</div>
    ${act("j k muovi · ⏎ apre · 1 2 3 sceglie · o GitHub",null,true,"non puoi approvare le tue: qui si mergia, si sistema, si risponde")}`;
  }
  const mine=sec("mine")||{};const chase=mine.chase||{};
  const who={};rows.forEach(c=>{(who[c.who||"?"]=who[c.who||"?"]||[]).push(c);});
  return `<p class="lead"><strong>In attesa.</strong> La palla è di qualcun altro: qui sotto, per persona, il sollecito pronto da copiare.</p>
  ${Object.entries(who).map(([w,cs])=>`<div class="tbl"><div class="th" style="grid-template-columns:minmax(0,1fr) auto"><span>@${esc(w)} · ${cs.length} PR</span>${chase[w]?`<button class="btn sm" data-act="copytext" data-text="${esc(chase[w])}">Copia sollecito</button>`:"<span></span>"}</div>${cs.map(c=>`<div class="row"><span></span><span class="num">${esc(c.label||"#"+c.n)}</span><span><span class="t"><span class="tt">${esc(c.title)}</span></span><span class="why">${esc(c.todo)}</span></span><span class="cell">${esc(c.who||"")}</span><span class="cell">${age(c.age)}</span><span></span>${ghButton(c)}</div>`).join("")}</div>`).join("")||'<div class="empty">Nessuna PR in attesa.</div>'}`;
}

function bodyIssue(step){
  const x=sec("issue")||{};const rows=stepRows("issue",step);const note=chatNote();
  if(step==="prepare"){
    return `<p class="lead"><strong>Leggo le issue.</strong> ${esc((((wiz||{}).prepare||{}).issue||{}).phrase||"")}</p>${table("issue","pending",x.pending||[],{nocheck:true,cell:()=>'<span class="chip idle">in coda</span>'})}`;
  }
  if(step==="close"){
    if(!rows.length)return emptyStep("Nessuna issue già risolta da chiudere.",x);
    const n=checked("issue","close").length;
    const below=(c,open)=>open?`<div class="draft"><span class="lbl">Commento di chiusura</span><textarea id="draft-${esc(key(c))}" data-draft="${esc(key(c))}" aria-label="Commento per #${c.n}">${esc(draftOf(c))}</textarea></div>`:"";
    return `<p class="lead"><strong>Già risolte da una PR mergiata.</strong> Manca solo chi le chiuda: ognuna con il commento che nomina la PR.</p>${table("issue","close",rows,{below,col:"PR",cell:c=>`<span class="cell mono">#${esc(c.fixed_by)}</span>`})}
    ${act("j k muovi · x spunta · o GitHub · ⏎ chiudi",n===1?"Chiudi la issue":`Chiudi le ${n} issue`,!n||!!note,note||"con il commento qui sotto")}`;
  }
  if(step==="claude"){
    if(!rows.length)return emptyStep("Nessuna issue facile e libera.",x);
    const n=checked("issue","claude").length;
    const fold=x.taken_easy?`<div class="fold">${CHEV}${x.taken_easy} facili sono già di qualcun altro: non le tocca</div>`:"";
    return `<p class="lead"><strong>Facili, in una fase sola, di nessuno.</strong> Già spuntate: togli quelle che vuoi fare tu o lasciare dove sono.</p>${table("issue","claude",rows,{col:"STATO"})}${fold}
    <div class="how"><span><strong class="muted">Cosa succede:</strong> un worktree per issue, la correzione con il suo test, una PR con «Fixes #n», assegnata e con il revisore.</span></div>
    ${act("j k muovi · x spunta · o GitHub · ⏎ conferma",n===1?"Fai aprire la PR a Claude":`Fai aprire le ${n} PR a Claude`,!n,"ti interrompe solo a PR aperte")}`;
  }
  if(step==="decide"){
    if(!rows.length)return emptyStep("Nessuna issue da decidere.",x);
    return `<p class="lead"><strong>Domande o lavori lunghi.</strong> Qui decidi tu se, chi e come.</p>${table("issue","decide",rows,{col:"MISURA",cell:c=>`<span class="cell">${esc((c.size||"").toLowerCase())}</span>`,below:(c,open)=>open?`<div class="draft"><span class="lbl q">${c.decision?"Da decidere":"Proposta"}</span><p class="mine">${esc(c.decision||c.propose||"")}</p><div class="opts"><button class="btn sm" data-act="loopone" data-id="${esc(key(c))}" data-flow="issue-loop">Lavorala in chat</button></div></div>`:"",nocheck:true})}
    ${act("j k muovi · ⏎ apre · o GitHub",null,true,"")}`;
  }
  return bodyDone("issue");
}

function render(){
  if(!loaded&&!wiz){$("content").innerHTML='<div class="empty">Leggo il desk…</div>';return;}
  renderHeader();renderSteps();renderBody();renderStatus();renderDrawer();renderZoom();wire();
}
function renderSoft(){
  const a=document.activeElement;
  if(a&&a.tagName==="TEXTAREA"){renderHeader();renderSteps();renderStatus();renderDrawer();wire();return;}
  render();
}
function renderBody(){
  const step=currentStep();let html;
  if(section==="review")html=bodyReview(step);
  else if(section==="mine")html=bodyMine(step);
  else if(section==="issue")html=bodyIssue(step);
  else html=`<span class="lbl">A chi tocca</span><p class="def">Per ogni persona, le PR e le issue in cui la prossima mossa è sua, con il sollecito pronto da copiare.</p>${peopleHtml()}`;
  $("content").innerHTML=html;
}
function renderStatus(message){
  const def=sectionDef(section);const step=currentStep();
  const idx=def.steps.findIndex(s=>s.id===step);
  const pos=def.steps.length?` ${idx<0?"·":idx+1+"/"+def.steps.length}`:"";
  const p=(wiz&&wiz.prepare)||{};const kind=section==="issue"?"issue":"pr";
  const feed=(st.feed||[]);const last=feed.length?feed[feed.length-1]:null;
  const middle=message||((p[kind]&&p[kind].status==="running")?p[kind].phrase:(last?`${last.at} · ${last.msg}`:(p[kind]&&p[kind].phrase)||""));
  const ago=paintedAt?Math.max(0,Math.round((Date.now()-paintedAt)/1000)):null;
  $("sb").innerHTML=`<span class="mono ${section==="issue"?"c-iss":"c-pr"}">● ${esc(def.tag)}${pos}</span><span>${esc(middle)}</span><span class="spacer"></span><span>${ago==null?"":ago<60?"GitHub letto ora":"GitHub letto "+Math.round(ago/60)+" min fa"}</span><button class="sbb" data-act="drawer" aria-expanded="${drawerOpen}">Attività <span aria-hidden="true">${drawerOpen?"▾":"▴"}</span></button>`;
}
function renderDrawer(){
  const d=$("drawer");d.hidden=!drawerOpen;if(!drawerOpen)return;
  const jobs=((st.agent||{}).jobs)||[];
  const feed=(st.feed||[]).slice(-40).reverse();
  d.innerHTML=`${jobs.length?`<span class="lbl">Al lavoro</span><ol>${jobs.map(j=>`<li><span class="mono">${esc(j.kind)}${j.request&&j.request.n?" #"+j.request.n:""}</span><span>${esc((j.progress||{}).detail||j.status)}</span></li>`).join("")}</ol>`:""}<span class="lbl">Attività</span><ol>${feed.map(f=>`<li><span class="mono">${esc(f.at)}</span><span>${esc(f.msg)}</span></li>`).join("")||"<li class=\"faint\">niente ancora</li>"}</ol>`;
}

/* ---- zoom ---- */
async function fetchZoom(c){
  const k=key(c);if(zoomCache[k]&&zoomCache[k].loading)return;
  zoomCache[k]={loading:true};
  try{
    const [z]=await getJSON(`/api/pr/${c.n}/zoom`+(c.repo?`?repo=${encodeURIComponent(c.repo)}`:""));
    zoomCache[k]=z;
  }catch(e){zoomCache[k]={error:e.message,hunk:c.hunk?Object.assign({},c.hunk,{error:e.message,lines:[]}):null};}
  renderSoft();
}
function zoomList(){
  const step=currentStep();
  if(section==="review"&&step==="prepare"){const r=sec("review")||{};return [].concat(...(r.steps||[]).map(x=>x.rows),r.pending||[]);}
  return stepRows(section,step);
}
function openZoom(k){
  const c=zoomList().find(x=>key(x)===k);if(!c)return;
  zoomed=k;if(!zoomCache[k]||zoomCache[k].error)fetchZoom(c);render();
}
function closeZoom(){zoomed=null;render();}
function renderZoom(){
  const el=$("zoom");if(!zoomed){el.hidden=true;el.innerHTML="";return;}
  const list=zoomList();const i=list.findIndex(c=>key(c)===zoomed);
  if(i<0){zoomed=null;el.hidden=true;return;}
  const c=list[i];const z=zoomCache[zoomed]||{};const state=z.state||{};
  const step=sectionDef(section).steps.find(s=>s.id===currentStep());
  const checks=(z.verified||[]).map(v=>`<li class="c-ok"><span>✓</span><span style="color:var(--text)">${esc(v)}</span></li>`).join("")+(z.not_verified||[]).map(v=>`<li class="c-q"><span>?</span><span style="color:var(--text)">Non verificato: ${esc(v)}</span></li>`).join("");
  const review=section==="review"&&["approve","changes","doubt"].includes(currentStep());
  el.hidden=false;
  el.innerHTML=`<div class="zp" role="dialog" aria-label="Situazione della PR ${c.n}">
  <div class="zh"><button class="back" data-act="unzoom">‹ ${esc(step?step.label:"Indietro")}</button><span class="pips">${list.slice(0,12).map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</span><span class="faint small">${i+1} di ${list.length}</span><span class="spacer"></span><span class="keys">Esc torna alla lista · j k PR vicina</span></div>
  <div class="zt"><span class="num">${esc(c.label||"#"+c.n)}</span><span class="ptitle">${esc(c.title)}</span><button class="btn sm" data-act="gh" data-url="${esc(c.url||"")}">${GH} Apri su GitHub</button><span class="meta">${esc(c.author||"")} · aperta ${c.age==null?"":c.age+" giorni fa"}</span></div>
  <div class="zb">${z.loading?'<p class="faint">Leggo la situazione…</p>':`<div class="col">
    <div class="sec"><span class="lbl">In breve</span><p>${esc(z.problem||c.why||"Nessuna analisi ancora.")}</p></div>
    ${(c.doubt||(z.card||{}).doubt)?`<div class="sec"><span class="lbl q">Perché è dubbia</span><p>${esc(c.doubt||(z.card||{}).doubt)}</p></div>`:""}
    ${z.hunk?`<div class="sec"><span class="lbl">Dove · ${esc(z.hunk.path)}</span>${hunkHtml(z.hunk)}</div>`:""}
    ${checks?`<div class="sec"><span class="lbl">Cosa ha verificato Claude</span><ul class="checks">${checks}</ul></div>`:""}
    ${z.stale?'<p class="faint small">L\'analisi è di prima dell\'ultimo cambiamento: si rifà alla prossima preparazione.</p>':""}
  </div><div class="col side">
    <div class="sec"><span class="lbl">La storia</span><ol class="tl">${(z.timeline||[]).map(t=>`<li class="${t.now?"now":""}"><span class="d">${esc(t.on)}</span>${esc(t.text)}</li>`).join("")}</ol></div>
    <div class="sec"><span class="lbl">Stato</span><dl class="kv"><dt>Test</dt><dd class="${state.tests==="SUCCESS"?"c-ok":""}">${esc(state.tests==="SUCCESS"?"verdi":state.tests||"non letti")}</dd><dt>Merge</dt><dd>${esc(state.merge||"—")}</dd><dt>Conflitti</dt><dd>${esc(state.conflicts||"—")}</dd><dt>Revisori</dt><dd>${esc((state.reviewers||[]).join(", ")||"nessuno")}</dd></dl></div>
    ${(z.closes||[]).length?`<div class="sec"><span class="lbl">Collegate</span><div class="links">${z.closes.map(n=>`<button data-act="gh" data-url="${esc(String(c.url||"").replace(/\/pull\/\d+$/,"/issues/"+n))}">#${n}</button>`).join("")}</div></div>`:""}
  </div>`}</div>
  <div class="zf">${review?`<button class="btn ${c.lean==="approve"||c.stance==="approve"?"primary":""}" data-act="doubt-a" ${chatNote()?"disabled":""}><span class="kbd">A</span>Approva</button><button class="btn ${c.lean==="changes"||c.stance==="changes"?"primary":""}" data-act="doubt-r" ${chatNote()?"disabled":""}><span class="kbd">R</span>Chiedi modifiche</button><button class="btn" data-act="doubt-s"><span class="kbd">S</span>Salta a domani</button>`:""}<span class="spacer"></span><span class="faint small">${review?"gli stessi tasti della lista: decidi anche da qui":""}</span></div></div>`;
}
function zoomStep(delta){
  const list=zoomList();const i=list.findIndex(c=>key(c)===zoomed);
  const next=list[i+delta];if(next)openZoom(key(next));
}

/* ---- actions ---- */
function toast(text){const t=$("toast");t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},6000);}
async function run(label,fn){
  try{const out=await fn();toast(label);await refreshAfter();return out;}
  catch(e){toast("Non partito: "+e.message);}
}
async function refreshAfter(){
  try{const [w,we]=await getJSON("/api/wizard");wizEtag=we;applyWizard(w);const [s,se]=await getJSON("/api/state");stateEtag=se;applyState(s);}catch(e){}
  render();
}
const items=(rows,extra)=>rows.map(c=>Object.assign({n:c.n},c.repo?{repo:c.repo}:{},extra?extra(c):{}));
function primary(){
  const step=currentStep();
  if(section==="review"&&step==="approve"){const rows=checked("review","approve");if(rows.length)return run(`▶ approva ${rows.map(c=>"#"+c.n).join(" ")}`,()=>post("/api/review",{event:"approve",items:items(rows,c=>({head:c.head}))}));}
  if(section==="review"&&step==="changes"){const rows=checked("review","changes");if(rows.length)return run(`▶ chiedi modifiche ${rows.map(c=>"#"+c.n).join(" ")}`,()=>post("/api/review",{event:"changes",items:items(rows,c=>({head:c.head,body:draftOf(c)}))}));}
  if(section==="review"&&step==="doubt"){const rows=stepRows("review","doubt");const c=rows[doubtAt];if(c)return decideDoubt(c.lean==="approve"?"a":"r");}
  if(section==="mine"&&step==="merge"){const rows=checked("mine","merge");if(rows.length)return run("▶ pr-loop "+rows.map(c=>"#"+c.n).join(" "),()=>post("/api/run",{flow:"pr-loop",items:items(rows),batch:1}));}
  if(section==="mine"&&step==="fix"){const rows=checked("mine","fix");if(rows.length)return run("▶ pr-loop in background",()=>post("/api/run",{flow:"pr-loop",items:items(rows),batch:rows.length}));}
  if(section==="issue"&&step==="close"){const rows=checked("issue","close");if(rows.length)return run(`▶ chiudi ${rows.map(c=>"#"+c.n).join(" ")}`,()=>post("/api/close",{items:items(rows,c=>({body:draftOf(c)}))}));}
  if(section==="issue"&&step==="claude"){const rows=checked("issue","claude");if(rows.length)return run("▶ issue-loop in background",()=>post("/api/run",{flow:"issue-loop",items:items(rows),batch:rows.length}));}
  if(step==="done")return setSection(section==="review"?"issue":"whose");
}
function currentDoubt(){
  if(zoomed){const c=zoomList().find(x=>key(x)===zoomed);if(c)return c;}
  return stepRows("review","doubt")[doubtAt];
}
function decideDoubt(which){
  const c=currentDoubt();if(!c)return;
  if(which==="s")return run(`salto #${c.n} a domani`,()=>post("/api/review",{event:"skip",items:items([c])}));
  if(which==="a")return run(`▶ approva #${c.n}`,()=>post("/api/review",{event:"approve",items:items([c],x=>({head:x.head}))}));
  const body=draftOf(c);
  if(!body.trim()){toast("Scrivi prima la motivazione");return;}
  return run(`▶ chiedi modifiche #${c.n}`,()=>post("/api/review",{event:"changes",items:items([c],x=>({head:x.head,body}))}));
}
function chooseOption(k,i){
  const c=stepRows("mine","decide").find(x=>key(x)===k);if(!c||!c.options)return;
  const text=c.options[i];
  return run(`▶ pr-loop order #${c.n}: ${text}`,()=>post(`/api/pr/${c.n}/order`,Object.assign({propose:text,instruction:text},c.repo?{repo:c.repo}:{})));
}
function loopOne(k,flow){
  const s=flow==="issue-loop"?"issue":"mine";
  const c=[].concat(...((sec(s)||{}).steps||[]).map(x=>x.rows)).find(x=>key(x)===k);if(!c)return;
  return run(`▶ ${flow} #${c.n}`,()=>post("/api/run",{flow,items:items([c]),batch:1}));
}
function openGitHub(url){if(url)window.open(url,"github");}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast("Copiato");}catch(e){toast("Copia non riuscita");}}
function toggleTheme(){
  const root=document.documentElement;if(!root)return;
  const now=root.dataset.theme||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=now==="dark"?"light":"dark";root.dataset.theme=next;
  try{localStorage.setItem("git-desk-theme",next);}catch(e){}
}
function moveSel(delta){
  const step=currentStep();
  if(section==="review"&&step==="doubt"){const n=stepRows("review","doubt").length;doubtAt=Math.max(0,Math.min(n-1,doubtAt+delta));render();return;}
  const rows=zoomList();if(!rows.length)return;
  const k=section+":"+step;const i=rows.findIndex(c=>key(c)===sel[k]);
  const next=rows[Math.max(0,Math.min(rows.length-1,i<0?0:i+delta))];
  sel[k]=key(next);if(section==="mine"&&step==="decide")openRow.mine=key(next);render();
}
function selectedCard(){
  if(section==="review"&&currentStep()==="doubt")return stepRows("review","doubt")[doubtAt];
  const k=sel[section+":"+currentStep()];return zoomList().find(c=>key(c)===k)||zoomList()[0];
}
function onKey(e){
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="TEXTAREA"||tag==="INPUT"){if(e.key==="Escape"&&e.target.blur)e.target.blur();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==="Escape"){if(zoomed)closeZoom();else if(drawerOpen){drawerOpen=false;render();}return;}
  if(zoomed&&(k==="j"||k==="k")){zoomStep(k==="j"?1:-1);e.preventDefault&&e.preventDefault();return;}
  if(k==="j"||k==="ArrowDown"){moveSel(1);return;}
  if(k==="k"||k==="ArrowUp"){moveSel(-1);return;}
  const c=selectedCard();
  if(k===" "&&c&&section!=="whose"){e.preventDefault&&e.preventDefault();zoomed?closeZoom():openZoom(key(c));return;}
  if(k==="o"&&c){openGitHub(c.url);return;}
  if(k==="x"&&c){const id=section+":"+currentStep()+":"+key(c);off.has(id)?off.delete(id):off.add(id);render();return;}
  if(k==="Enter"){primary();return;}
  if(section==="review"&&(currentStep()==="doubt"||zoomed)&&["a","r","s"].includes(k)){decideDoubt(k);return;}
  if(section==="mine"&&currentStep()==="decide"&&["1","2","3"].includes(k)&&c){chooseOption(key(c),Number(k)-1);}
}
function wire(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    const a=el.dataset.act;
    el.onclick=ev=>{
      if(a!=="toggle"&&a!=="pick"&&ev&&ev.stopPropagation)ev.stopPropagation();
      if(a==="section")return setSection(el.dataset.id);
      if(a==="step")return setStep(el.dataset.id);
      if(a==="toggle"){if(ev&&ev.stopPropagation)ev.stopPropagation();const id=el.dataset.id;el.checked?off.delete(id):off.add(id);return render();}
      if(a==="pick"){if(ev&&ev.target&&ev.target!==el&&ev.target.dataset&&ev.target.dataset.act)return;const k=section+":"+currentStep();sel[k]=sel[k]===el.dataset.id&&currentStep()!=="prepare"?null:el.dataset.id;return render();}
      if(a==="gh")return openGitHub(el.dataset.url);
      if(a==="cta")return primary();
      if(a==="skipstep"){const steps=sectionDef(section).steps;const i=steps.findIndex(s=>s.id===currentStep());return setStep(steps[Math.min(steps.length-1,i+1)].id);}
      if(a==="prevdoubt"){doubtAt=Math.max(0,doubtAt-1);return render();}
      if(a==="nextdoubt"){doubtAt=doubtAt+1;return render();}
      if(a==="doubt-a")return decideDoubt("a");
      if(a==="doubt-r")return decideDoubt("r");
      if(a==="doubt-s")return decideDoubt("s");
      if(a==="zoom")return openZoom(el.dataset.id);
      if(a==="unzoom")return closeZoom();
      if(a==="openrow"){openRow.mine=openRow.mine===el.dataset.id?"-":el.dataset.id;return render();}
      if(a==="option")return chooseOption(el.dataset.id,Number(el.dataset.i));
      if(a==="loopone")return loopOne(el.dataset.id,el.dataset.flow);
      if(a==="copy"){const p=((wiz||{}).whose||[])[Number(el.dataset.i)];return p&&copyText(p.chase);}
      if(a==="copytext")return copyText(el.dataset.text);
      if(a==="drawer"){drawerOpen=!drawerOpen;return render();}
    };
  });
  document.querySelectorAll("[data-draft]").forEach(el=>{
    el.addEventListener("input",()=>{drafts[el.dataset.draft]=el.value;});
  });
}
async function shutdown(){
  try{await post("/api/shutdown",{});}catch(e){}
  $("content").innerHTML='<div class="empty">Desk spento. Per riaprirlo chiedi il desk alla chat.</div>';
}
$("refresh").onclick=()=>loadDesk(true).catch(e=>toast("Rilettura non riuscita: "+e.message));
$("theme").onclick=toggleTheme;
$("power").onclick=shutdown;
document.addEventListener("keydown",onKey);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll(true);});
try{const t=localStorage.getItem("git-desk-theme");if(t&&document.documentElement)document.documentElement.dataset.theme=t;}catch(e){}
(async function boot(){
  try{await loadDesk(false);}catch(e){$("content").innerHTML=`<div class="empty">Non raggiungo il desk: ${esc(e.message)}</div>`;}
  let last=Date.now();
  setInterval(()=>{
    if(document.visibilityState==="hidden")return;
    const now=Date.now();const full=preparing()||now-last>=SLOW-1;
    if(full)last=now;
    poll(full);
  },FAST);
})();
</script>
</body>
</html>
