    return `<div class="chaseCard"><h2>${esc(b.title)} (${b.rows.length})</h2>
      ${b.rows.slice(0,14).map(r=>`<div class="signal" data-n="${r.n}" data-k="${esc(rk(r))}" style="cursor:pointer">
        <b class="mono">${multi&&r.repo?esc(repoLabel(r.repo))+" ":""}#${r.n}</b><span>${esc((r.what||"").slice(0,54))}</span>
        <span class="mono">${esc(r.autorun||"")}</span></div>`).join("")}
      ${b.rows.length>14?`<p style="color:var(--muted);margin:6px 0 0">…e altre ${b.rows.length-14}</p>`:""}
      </div>`;}).join("");
  wrap.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>goTo("pr",el.dataset.k));
}

/* One card per person, and nothing else: a message to paste, not a task.
   Whoever is on this tab has already decided what to do — chase — and only
   needs the text. */
function renderChase(){
  const names=Object.keys(chase),owed=Object.keys(replies),wrap=$("chaseWrap");
  if(!names.length&&!owed.length){
    wrap.innerHTML=`<div class="chaseNote">${!loaded
      ?"Ancora niente: la coda non è caricata."
      :!triageComplete
      ?"Il chase resta nascosto finché tutte le PR hanno un triage corrente."
      :"Nessuno da sollecitare: nessuna PR è ferma su qualcun altro."}</div>`;
    return;
  }
  const stamp=`Dall'ultimo ${esc(DESK==="issue"?"issue-triage":"pr-triage")}${session?` — ${esc(session)}`:""}.`;
  wrap.innerHTML=`<div class="chaseNote">${stamp} ${names.length?"Un messaggio per persona, pronto da incollare.":"Nessuno da sollecitare."}${owed.length?" Sotto, chi aspetta una tua risposta: basta un commento.":""}</div>`
    + names.map(w=>{
        const text=chase[w];
        const lines=text.split("\n").length-1;      // the header line is not a PR
        const oldest=(text.match(/dal (\d{4}-\d{2}-\d{2})/)||[])[1];
        return `<div class="chaseCard">
          <h2>@${esc(w)} <span class="chaseCount">${lines} PR${oldest?` · dal ${esc(oldest)}`:""}</span></h2>
          <pre>${esc(text)}</pre>
          <button class="btn" data-copy="${esc(text)}">Copia messaggio</button></div>`;
      }).join("")
    + owed.map(w=>`<div class="chaseCard reply">
        <h2>@${esc(w)} <span class="chaseCount">aspetta una tua risposta · ${replies[w].length} PR</span></h2>
        ${replies[w].map(r=>`<div class="signal" data-n="${r.n}" data-k="${esc(rk(r))}" style="cursor:pointer">
          <b class="mono">${esc(r.label||"#"+r.n)}</b><span>${esc((r.title||"").slice(0,70))}</span>
          <span class="mono">${esc(r.created||"")}</span></div>`).join("")}</div>`).join("");
  wrap.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(b,b.dataset.copy));
  wrap.querySelectorAll(".reply [data-k]").forEach(el=>el.onclick=()=>goTo("pr",el.dataset.k));
}

/* ---------- threads: every issue with the PR that closes it ---------- */
const GROUP_LABEL=g=>g.id==="me"?"Tocca a te":g.id==="untriaged"?"PR senza verdetto"
  :g.id==="nobody"?"Di nessuno":`In attesa di ${g.id}`;
const GROUP_HINT=g=>g.id==="untriaged"?"↻ pr-triage dà loro un verdetto":g.id==="nobody"?"senza assignee né mossa di qualcuno":"";
const refKey=ref=>ref;
const refName=ref=>{const i=ref.lastIndexOf("#"),repo=ref.slice(0,i);
  return (multi||repo!==scope.name?(labels[repo]||repo)+" ":"")+ref.slice(i);};
function threadRepos(t){return [t.issue&&t.issue.repo].concat(t.prs.map(p=>p.repo)).filter(Boolean);}
function threadShown(t){
  if(threadRepos(t).every(r=>hiddenRepos.has(r)))return false;
  if(personFilter&&t.group!==personFilter)return false;
  const q=query.trim().toLowerCase();
  if(!q)return true;
  return [t.key,t.issue&&t.issue.title,...t.prs.map(p=>p.title||""),...t.prs.map(p=>p.author||"")]
    .filter(Boolean).join(" ").toLowerCase().includes(q);
}
function threadCard(t){
  const issue=t.issue,mark={me:"!",untriaged:"?",nobody:"◇"}[t.group]||"○";
  const cls={me:"attention",untriaged:"untriaged",nobody:"waiting"}[t.group]||"waiting";
  const who=issue?(issue.assignees||[]).join(", ")||"nessuno":"";
  const out=[];
  if(issue)out.push(`<button class="thrNode" data-goto="issue" data-k="${esc(issue.repo+"#"+issue.n)}">
      <i>◯</i><span class="ref">${esc(refName(issue.repo+"#"+issue.n))}${issue.type?` <span class="tag ${esc(issue.type)}">${esc(issue.type)}</span>`:""}</span>
      <span class="who" style="${who==="nessuno"?"color:var(--amber)":""}">${esc(who)}</span>
      <span class="title">${esc(issue.title)}</span></button>`);
  for(const p of t.prs){
    if(p.in_queue===false){
      out.push(`<div class="thrNode pr stub"><i>└</i><span class="ref">PR ${esc(refName(p.repo+"#"+p.n))}</span><span class="who">fuori dalla tua coda</span></div>`);
      continue;
    }
    out.push(`<button class="thrNode pr" data-goto="pr" data-k="${esc(p.repo+"#"+p.n)}">
      <i>└</i><span class="ref">PR ${esc(refName(p.repo+"#"+p.n))}</span>
      <span class="who">${esc(p.author||"")} · ${esc(p.merge||"…")}</span>
      <span class="title">${esc(p.title||"")}</span></button>`);
  }
  if(issue&&!t.prs.length)out.push(`<div class="thrNone">nessuna PR aperta la cita</div>`);
  const links=[];
  for(const ref of t.same_title||[])links.push(`<span class="warn">stesso titolo di ${esc(refName(ref))}</span>`);
  for(const ref of t.cited_by||[])links.push(`<span>citata da ${esc(refName(ref))}</span>`);
  for(const ref of t.cites||[]){
    const repo=ref.slice(0,ref.lastIndexOf("#"));
    if(!labels[repo])links.push(`<span>cita ${esc(ref)} · fuori scope</span>`);
  }
  if(issue&&!(issue.assignees||[]).length&&t.prs.length)links.push(`<span class="warn">issue senza assignee: si legge da fare per tutti</span>`);
  return `<div class="thr ${cls}">${out.join("")}
    ${links.length?`<div class="thrLinks">${links.join("")}</div>`:""}
    <div class="thrMove"><span class="mark"><span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font:700 10px var(--mono);background:var(${cls==="attention"?"--att-bg":cls==="untriaged"?"--warn-bg":"--wait-bg"})">${mark}</span></span><strong>${esc(t.move||"")}</strong></div></div>`;
}
function renderThreads(){
  const wrap=$("threadsWrap");
  if(!loaded){wrap.innerHTML=`<div class="empty"><b>Carico i filoni…</b></div>`;return;}
  const people=Object.entries(threads.people||{});
  const strip=people.length?`<div class="people">${people.map(([id,p])=>{
      const name=id==="me"?"Tu":id==="nobody"?"Nessuno":id==="untriaged"?"Senza verdetto":id;
      const bits=[p.prs.length?`${p.prs.length} PR`:"",p.issues.length?`${p.issues.length} issue senza PR`:""].filter(Boolean).join(", ");
      return `<button class="person${id==="me"?" me":""}${personFilter===id?" on":""}" data-person="${esc(id)}">
        <span><strong>${esc(name)}</strong><em>${p.threads}</em></span><small>${esc(bits||"—")}</small></button>`;}).join("")}</div>`:"";
  const groups=(threads.groups||[]).map(g=>({...g,list:g.threads.filter(threadShown)})).filter(g=>g.list.length);
  wrap.innerHTML=strip+(groups.length?groups.map(g=>{
    const msg=chase[g.id];
    return `<div class="thrGroup"><div class="thrHead"><strong>${esc(GROUP_LABEL(g))}</strong>
      <span class="mono" style="color:var(--muted)">${g.list.length}</span><span class="grow">${esc(GROUP_HINT(g))}</span>
      ${msg?`<button class="btn" data-copy="${esc(msg)}" title="Le tue PR ferme su ${esc(g.id)}: un messaggio, pronto da incollare">Copia sollecito</button>`:""}</div>
      ${g.list.map(threadCard).join("")}</div>`;}).join("")
    :`<div class="empty"><b>Nessun filone in questa vista</b><span>Azzera il filtro o mostra tutti i repo dello scope.</span></div>`);
  wrap.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>{
    personFilter=personFilter===b.dataset.person?null:b.dataset.person;render();});
  wrap.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>goTo(b.dataset.goto,b.dataset.k));
  wrap.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(b,b.dataset.copy));
}

/* ---------- detail panel ---------- */
const PR_TABS=r=>[["quadro","Quadro"],["analisi","Analisi"],
                  ["thread",`Thread${r.unresolved?" "+r.unresolved:""}`],["bozza","Draft"]];
const ISSUE_TABS=()=>[["quadro","Quadro"],["analisi","Analisi"]];
const hostName=()=>{const m=(scope.members||[])[0]||{};return m.provider==="forgejo"?"Forgejo":m.provider==="github"?"GitHub":"provider";};
function cloneOf(r){return ((scope.members||[]).find(m=>m.repo===r.repo)||{clone:true}).clone!==false;}

function renderDetail(){
  const box=$("detail"),split=$("splitter");
  if(view==="chase"||DESK==="threads"){
    // the unit here is a PERSON or a thread, not a PR. A PR's analysis under
    // a column of chase messages answers a question nobody asked on this tab.
    box.innerHTML="";box.style.display="none";split.hidden=true;$("queue").classList.add("full");return;
  }
  box.style.display="";split.hidden=false;$("queue").classList.remove("full");
  const r=selectedRow();
  if(!r){
    box.innerHTML=`<div class="empty">${loaded
      ?"<b>Nessuna riga selezionata</b><span>Clicca una riga, o usa <span class=\"kbd\">j</span> <span class=\"kbd\">k</span>.</span>"
      :"<b>Carico la coda…</b><span>Il desk legge il provider e dipinge; il triage è un bottone, non un'attesa.</span>"}</div>`;
    return;
  }
  const isPr=DESK!=="issue";
  const tabs=isPr?PR_TABS(r):ISSUE_TABS();
  if(!tabs.some(t=>t[0]===tab))tab="quadro";
  const where=multi?`${esc(r.repo)} · `:"";
  box.innerHTML=`
    <div class="detailHead">
      <div>
        <span class="largeMark ${isPr?r.state:(r.assignees.length?"waiting":"attention")}">${isPr?MARK[r.state]:(r.assignees.length?"○":"!")}</span>
        <span class="detailKicker">${isPr
          ?`${where}PR #${r.n} · ${esc(r.author)} · aperta ${esc(r.created)} (${ageDays(r.created)}g) · base ${esc(r.base)} · <span class="status ${r.state}">${esc(STATE_LABEL[r.state])}</span>`
          :`${where}issue #${r.n} · ${esc(r.author)} · aperta ${esc(r.created)} (${ageDays(r.created)}g) · <span class="tag ${esc(r.type)}">${esc(r.type)}</span>`}</span>
        <h1>${esc(r.title)}</h1>
      </div>
      <div class="detailActions" id="detailActions"></div>
    </div>
    ${cloneOf(r)?"":`<div class="actionText" style="margin:0 0 10px">${esc(r.repo)} non ha un clone locale: si legge e si analizza, ma lavora, pr-loop e merge restano spenti.</div>`}
    <nav class="detailTabs" id="detailTabs">${tabs.map(([id,label])=>
      `<button data-t="${id}" aria-selected="${tab===id}">${label}</button>`).join("")}</nav>
    <div class="detailGrid" id="detailGrid"></div>`;
  $("detailTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderDetail();});
  (isPr?renderPrActions:renderIssueActions)(r);
  (isPr?renderPrTab:renderIssueTab)(r);
}

const REQ_LABEL={analyze:"pr-analyze",explain:"spiegazione",order:"ordine",
                 "issue-analyze":"issue-analyze"};
function requests(r){return r.requests||{};}
const OUT_STATUS=["preparing","queued","taken","running"];
function pending(r,kind){const q=requests(r)[kind];return q&&OUT_STATUS.includes(q.status)?q:null;}
function closed(r,kind){const q=requests(r)[kind];return q&&!OUT_STATUS.includes(q.status)?q:null;}
const actKey=r=>(DESK==="issue"?"i":"p")+rk(r);

/* The button's own state, from the ledger the SERVER keeps: a lock held in
   the page is lost on reload and in a second tab, and the user presses again
   because nothing visibly happened. */
function actionButton(id,kind,label,tip,row,primary,needsClone){
  const q=pending(row,kind);
  if(q)return `<span class="btn locked" title="Richiesta precedente ancora registrata alle ${esc(q.at)}.">${q.via==="chat"?"in chat":"richiesta precedente"} · ${esc(q.at)}</span>`;
  const done=closed(row,kind);
  const enabled=agentReady&&!pendingClicks[actKey(row)]&&(!needsClone||cloneOf(row));
  return `<button class="btn ${primary?"primary":""}" id="${id}" ${enabled?"":"disabled"} title="${esc(tip)}">${done?"↻ ":""}${label}</button>`;
}
function actBadge(r){
  const out=[];
  if(onNow(r)){
    const w=workings.find(w=>(!w.repo||w.repo===r.repo)&&(w.ns||[w.n]).includes(r.n))||{};
    out.push(`<div class="actionText" style="color:var(--blue);background:#f3f6ff;border-color:#c9d5fa">
      <span class="nowChip"><i></i>ora</span> il job one-shot sta lavorando questa: ${esc(nowMsg(r))} (dalle ${esc(w.at||"")})</div>`);
  }
  for(const [kind,q] of Object.entries(requests(r))){
    const name=REQ_LABEL[kind]||kind;
    if(q.status==="preparing")
      out.push(`<div class="actionText">📨 <b>${esc(name)}</b> il desk legge il provider per la chat collegata (dalle ${esc(q.at)}).</div>`);
    else if(q.status==="queued")
      out.push(`<div class="actionText">📨 <b>${esc(name)}</b> ${q.via==="chat"?"in coda alla chat collegata":"richiesta"} alle ${esc(q.at)}.</div>`);
    else if(q.status==="taken")
      out.push(`<div class="actionText">💬 <b>${esc(name)}</b> in lavorazione nella chat collegata${q.taken_at?" dalle "+esc(q.taken_at):""} — l'esito arriva in conversazione.</div>`);
    else if(q.status==="needs-input")
      out.push(`<div class="actionText" style="color:var(--amber)">⚠ <b>${esc(name)}</b> serve una decisione${q.report?`: ${esc(q.report)}`:""}</div>`);
    else if(q.status==="failed")
      out.push(`<div class="actionText" style="color:var(--red)">✗ <b>${esc(name)}</b> non riuscita${q.closed_at?" alle "+esc(q.closed_at):""}${q.report?`: ${esc(q.report)}`:""}</div>`);
    else if(q.status==="stale")
      out.push(`<div class="actionText" style="color:var(--amber)">⚠ <b>${esc(name)}</b> senza esito — puoi ritentare.</div>`);
    else
      out.push(`<div class="actionText" style="color:var(--green);background:var(--ok-bg);border-color:var(--ok-bg)">✓ <b>${esc(name)}</b> chiusa${q.closed_at?" alle "+esc(q.closed_at):""}${q.report?`: ${esc(q.report)}`:""}</div>`);
  }
  const a=acting[actKey(r)];
  if(a&&a.status==="running")out.push(`<div class="actionText">Agente one-shot in corso${a.progress&&a.progress.detail?`: ${esc(a.progress.detail)}`:"…"}</div>`);
  if(a&&a.status==="error")out.push(`<div class="actionText" style="color:var(--red)">Errore: ${esc(a.error)}</div>`);
  return out.join("");
}
function renderPrActions(r){
  const exec=r.autorun==="A1"?{label:"▶ Merge",tip:"Avvia pr-loop una volta: riverifica i gate freschi e solo allora esegue squash e delete branch."}
           :r.autorun==="A3"?{label:"▶ Merge base",tip:"Avvia pr-loop una volta per riallineare il branch secondo le regole A3."}:null;
  $("detailActions").innerHTML=`
    ${exec?actionButton("aExec","order",exec.label,exec.tip,r,true,true):""}
    ${actionButton("aAnalyze","analyze","▶ Analizza",
       "Avvia pr-analyze come processo one-shot read-only: legge diff, claim e thread, scrive il risultato JSON e termina.",
       r,!exec)}
    ${r.summary?"":actionButton("aExplain","explain","▶ Spiega",
       "Questa PR non ha descrizione, quindi il desk non può dire da solo cosa risolve: chiede al modello una riga.",r,false)}
    <a class="btn" href="${r.url}" target="_blank" rel="noreferrer">${hostName()} ↗</a>`;
  const ex=$("aExec");if(ex)ex.onclick=()=>doOrder(r,ex);
  const an=$("aAnalyze");if(an)an.onclick=()=>doAnalyze(r,an);
  const ex2=$("aExplain");if(ex2)ex2.onclick=()=>doExplain(r,ex2);
}
function renderIssueActions(r){
  $("detailActions").innerHTML=`
    ${actionButton("aWork","issue-analyze","▶ Analizza",
      "Avvia issue-analyze come processo one-shot read-only, scrive il risultato JSON e termina.",
      r,true)}
    <a class="btn" href="${r.url}" target="_blank" rel="noreferrer">${hostName()} ↗</a>`;
  const w=$("aWork");if(w)w.onclick=()=>doIssueWork(r,w);
}

function renderPrTab(r){
  const g=$("detailGrid"),sk=r.skill||{};
  const legacyAnalysis=sk.analysis&&!sk.problem&&!sk.history;
  const currentProblem=!r.analysis_stale&&sk.problem?sk.problem:
    (!r.what_stale&&sk.what?sk.what:null);
  if(tab==="quadro"){
    const reviews=(r.reviews||[]).map(v=>`<div class="signal"><b>${esc(v.who)}</b><span>${esc(v.state)} · ${esc(v.on)}</span></div>`).join("")
      ||`<div class="signal"><span>ancora nessuna review</span></div>`;
    const closes=r.closes||[];
    g.innerHTML=`
      <article class="nextCard"><h2>Prossima mossa</h2><p>${esc(r.todo)}</p>
        ${currentProblem?`<p style="font-weight:400;font-size:13px">${esc(currentProblem)}</p>`:""}
        <small>autorun <b>${esc(r.autorun)}</b> — ${esc(AUTORUN_TIP)}</small>${
        closes.some(c=>Array.isArray(c.assignees)&&!c.assignees.length)
          ? `<div class="actionText">Issue collegata senza assignee (${closes.filter(c=>Array.isArray(c.assignees)&&!c.assignees.length).map(c=>"#"+c.issue).join(" ")}): nel workflow Softwell legge come da fare a tutti.</div>`:""}</article>
      <article><h2>Cosa risolve</h2>
        ${r.summary?`<p style="margin-bottom:10px">${esc(r.summary)}</p>`
          :sk.what&&!r.what_stale?`<p style="margin-bottom:10px">${esc(sk.what)}</p>`
          :`<p style="margin-bottom:10px;color:var(--muted)">Nessuna descrizione sulla PR${closes.length?"":" e nessuna issue collegata"} — <b>▶ Spiega</b> la fa riassumere al modello.</p>`}
        ${closes.length?`<div class="signal"><b>chiude</b><span>${closes.map(c=>`${c.repo&&c.repo!==r.repo?esc(repoLabel(c.repo))+" ":""}#${c.issue}${c.title?" "+esc(c.title):""}`).join(" · ")}</span></div>`:""}
        <h2 style="margin-top:12px">Quadro</h2>
        <dl>
          <div><dt>Review decision</dt><dd>${esc(r.decision||"—")}</dd></div>
          <div><dt>Review richiesta a</dt><dd>${esc(r.req.join(", ")||"nessuno")}</dd></div>
          <div><dt>Merge state</dt><dd>${esc(r.merge||"in arrivo…")}</dd></div>
          <div><dt>Base</dt><dd>${esc(r.base)}</dd></div>
          <div><dt>Thread</dt><dd>${r.unresolved}/${r.threads} unresolved</dd></div>
          <div><dt>Ultimo a parlare</dt><dd>${r.last?esc(`${r.last.who} · ${r.last.ch} · ${r.last.t.slice(0,10)}`):"—"}</dd></div>
          <div><dt>PR triage</dt><dd>${r.triage_status==="current"?"corrente":"mai eseguito"}</dd></div>
        </dl>
        ${(r.gate||[]).length?`<h2 style="margin-top:11px">Gate di ${esc(r.base)}</h2>
          <ul>${r.gate.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`:""}
        ${actBadge(r)}</article>
      <aside><h2>Review</h2>${reviews}</aside>`;
  }else if(tab==="analisi"){
    g.innerHTML=`
      <article class="wideArticle"><h2>Problema ${sk.analysis?`<span class="mono">${esc(session||"")}</span>`:""}</h2>
        ${r.analysis_stale?`<small class="triageChip" title="Head, review o gate sono cambiati dopo questa lettura">↻ analisi da aggiornare</small>`:""}
        ${sk.problem?`<p>${esc(sk.problem)}</p>`:legacyAnalysis?`<p>${esc(sk.analysis)}</p>`:`<div class="tabEmpty">Nessuna analisi ancora. <b>▶ Analizza</b> avvia pr-analyze una volta, salva il JSON e riempie questo tab.</div>`}
        ${sk.history?`<h2>Storia</h2><p>${esc(sk.history)}</p>`:""}
        ${sk.next?`<h2>Proposta</h2><p>${esc(sk.next)}</p>`:""}
        ${sk.plan&&sk.plan.length?`<h2>Piano di verifica</h2><ol>${sk.plan.map(step=>`<li>${esc(step)}</li>`).join("")}</ol>`:""}${actBadge(r)}</article>
      <aside><h2>Segnali</h2>
        <div class="signal"><b>merge</b><span>${esc(r.merge||"in arrivo…")}</span></div>
        <div class="signal"><b>review</b><span>${esc(r.decision||"nessuna")}</span></div>
        <div class="signal"><b>thread</b><span>${r.unresolved}/${r.threads}</span></div>
        <div class="signal"><b>autorun</b><span>${esc(r.autorun)}</span></div></aside>`;
  }else if(tab==="thread"){
    g.innerHTML=`
      <article class="wideArticle"><h2>Review threads</h2>
        ${r.threads?`<div class="thread"><span>${r.unresolved}</span><div><b>${r.unresolved?"non risolti":"tutti risolti"}</b>
            <p>${r.threads} thread in totale su questa PR${r.unresolved?`, ${r.unresolved} ancora aperti.`:"."}</p></div></div>
          ${(r.reviews||[]).map(v=>`<div class="thread"><span>${esc((v.who||"?")[0].toUpperCase())}</span><div><b>${esc(v.who)}</b><p>${esc(v.state)} il ${esc(v.on)}</p></div></div>`).join("")}`
          :`<div class="tabEmpty">Nessun thread di review su questa PR.</div>`}</article>
      <aside><h2>Regola del merge</h2><p>Tutti i thread devono essere risolti prima del merge, anche quando una risposta è già presente.</p>
        <p>Il conteggio viene dai campi del provider; il contenuto lo legge <b>▶ Analizza</b>.</p></aside>`;
  }else{
    const text=sk.draft||"";
    g.innerHTML=`
      <article class="wideArticle"><h2>Review draft</h2>
        ${text?`<div class="draft"><span>DA PR-ANALYZE</span><p>${esc(text)}</p></div>

/* ---------- actions: the button does the thing ---------- */
async function post(path,body){
  const resp=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json",
                              "X-Git-Workflow-Token":writeToken},
                              body:JSON.stringify(body||{})});
  const d=await resp.json().catch(()=>({}));
  if(d.error)throw new Error(d.error);
  return d;
}
async function waitJob(jobId,key,label){
  acting[key]={status:"running",job:jobId};render();
  for(;;){
    await new Promise(resolve=>setTimeout(resolve,1000));
    const job=await fetch(`/api/job/${jobId}`).then(resp=>resp.json());
    rememberJob(job);render();
    if(job.status==="running")continue;
    if(job.status==="error"||job.status==="failed")
      throw new Error(job.error||(job.result&&job.result.report)||`${label} fallito`);
    forgetJob(job,key);
    const report=job.result&&job.result.report;
    localFeed(`${label}: ${job.status==="needs-input"?"serve una decisione — ":""}${report||"completato"}`);
    await loadDesk(!!(job.result&&job.result.provider_changed));
    return job;
  }
}
async function handOver(r,btn,path,body,kind,note){
  const key=actKey(r);
  btn.disabled=true;btn.classList.add("working");
  startPending(key,`${note} · ${refOf(r)}`);
  try{
    const d=await post(path,Object.assign({repo:r.repo},body));
    endPending(key);
    if(d.order)r.order=d.order;
    if(d.via==="chat"){
      localFeed(`${note} su ${refOf(r)}: in coda alla chat collegata — l'esito arriva in conversazione`);
      btn.disabled=false;btn.classList.remove("working");
      await loadDesk(false);return;
    }
    if(!d.job)throw new Error("il server non ha creato il job");
    localFeed(`${note} su ${refOf(r)}: agente one-shot avviato`);
    await waitJob(d.job,key,note);
  }catch(e){endPending(key);acting[key]={status:"error",error:e.message};}
  render();
}
const doOrder=(r,btn,draft)=>handOver(r,btn,`/api/pr/${r.n}/order`,
  {propose:r.todo,draft:draft||(r.skill&&r.skill.draft)||null},"order","ordine");
async function doAnalyze(r,btn){
  return handOver(r,btn,`/api/pr/${r.n}/analyze`,{},"analyze","pr-analyze");
}
const doExplain=(r,btn)=>handOver(r,btn,`/api/pr/${r.n}/explain`,{},"explain","spiegazione");
const doIssueWork=(r,btn)=>handOver(r,btn,`/api/issue/${r.n}/analyze`,{},
  "issue-analyze","issue-analyze");
async function doFlow(path,flow,note,extra){
  const key="flow:"+flow;
  flows[flow]={status:"queued"};       // the button says so before the 202
  startPending(key,flow);
  try{
    const d=await post(path,Object.assign({flow},extra||{}));
    endPending(key);
    const parts=d.runs||[d];
    const queued=parts.filter(p=>p.via==="chat");
    if(queued.length===parts.length){
      flows[flow]={status:"queued",via:"chat"};
      localFeed(`${flow}: in coda alla chat collegata — l'esito arriva in conversazione`);
      render();return;
    }
    const ids=(d.jobs||parts.map(p=>p.job)).filter(Boolean);
    if(!ids.length)throw new Error("il server non ha creato il job");
    flows[flow]={status:"running",job:ids[0]};
    localFeed(note+(ids.length>1?` — ${ids.length} job, uno per repo`:""));
    render();
    await Promise.all(ids.map((id,i)=>waitJob(id,i?`${key}:${i}`:key,flow)));
    delete flows[flow];
  }catch(e){endPending(key);delete flows[flow];banner("errBox",esc(e.message),true);}
  render();
}
/* Chosen rows mean: exactly these, in this order, and then stop — one loop
   per repository, each in its own clone. */
function runPicked(flow,batch){
  const items=[...picked].map(rowByKey).filter(Boolean).map(r=>({repo:r.repo,n:r.n}));
  const repos=[...new Set(items.map(i=>i.repo))];
  doFlow("/api/run",flow,
    `${flow} avviato su ${pickedLabels().join(" ")}${batch>1?` — batch da ${batch}, in parallelo`:" — una alla volta"}`,
    repos.length>1?{items,batch}:{repo:repos[0],ns:items.map(i=>i.n),batch});
  picked.clear();
}
const doTriage=()=>doFlow("/api/triage",DESK==="issue"?"issue-triage":"pr-triage",
  "provider riletto e triage pubblicato — agente avviato solo per il giudizio ancora dovuto");
const doRun=()=>{
  const flow=DESK==="issue"?"issue-loop":"pr-loop";
  if(picked.size>1){askBatch=true;render();return;}
  if(picked.size===1)return runPicked(flow,1);
  doFlow("/api/run",flow,"run one-shot avviato",{repo:(scope.members[0]||{}).repo});
};

function renderPalette(){
  const q=$("palInput").value.trim().toLowerCase();
  palItems=commands().filter(c=>!q||[c.group,c.label,c.sub].join(" ").toLowerCase().includes(q));
  palIdx=Math.max(0,Math.min(palIdx,palItems.length-1));
  let last=null;
  $("palList").innerHTML=palItems.map((c,i)=>{
    const head=c.group!==last?`<div class="palGroup">${esc(c.group)}</div>`:"";last=c.group;
    return `${head}<button class="palOpt${i===palIdx?" on":""}" data-i="${i}"><i>${esc(c.icon)}</i>
      <span>${esc(c.label)}${c.sub?`<small>${esc(c.sub)}</small>`:""}</span><em>${esc(c.key)}</em></button>`;}).join("")
    ||`<div class="empty"><b>Nessun comando</b><span>Prova un'altra parola.</span></div>`;
  $("palList").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>runCommand(+b.dataset.i));
}
function openPalette(){
  $("palette").hidden=false;$("palInput").value="";palIdx=0;renderPalette();$("palInput").focus();
}
function closePalette(){$("palette").hidden=true;}
function runCommand(i){const c=palItems[i];closePalette();if(c)c.run();}
$("palInput").oninput=()=>{palIdx=0;renderPalette();};
$("palInput").addEventListener("keydown",e=>{
  if(e.key==="Escape"){e.preventDefault();closePalette();}
  else if(e.key==="ArrowDown"){e.preventDefault();palIdx++;renderPalette();}
  else if(e.key==="ArrowUp"){e.preventDefault();palIdx--;renderPalette();}
  else if(e.key==="Enter"){e.preventDefault();runCommand(palIdx);}
});

/* ---------- the split between list and detail, his to set ---------- */
(function wireSplitter(){
  const bar=$("splitter"),work=$("work");
  try{const saved=localStorage.getItem("gw-split");if(saved)work.style.setProperty("--split",saved);}catch(e){}
  bar.addEventListener("pointerdown",e=>{
    const top=work.getBoundingClientRect().top,height=work.getBoundingClientRect().height;
    const move=ev=>{
      const pct=Math.max(18,Math.min(82,(ev.clientY-top)/height*100));
      work.style.setProperty("--split",pct.toFixed(1)+"%");
    };
    const up=()=>{
      document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);
      try{localStorage.setItem("gw-split",work.style.getPropertyValue("--split"));}catch(e){}
    };
    document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);
    e.preventDefault&&e.preventDefault();
  });
})();

/* ---------- summary ---------- */
function renderSummary(){
  $("deskName").textContent=DESK==="issue"?"issue desk":"pr desk";
  document.title=`${scope.name||meta.repo||"Review"} · desk`;
  $("repoLabel").textContent=meta.repo?`${meta.repo} · ${meta.me}`:"…";
  $("leadEyebrow").textContent=DESK==="issue"?"issue aperte":"coda review";
  renderScope();
  if(!loaded){
    $("leadTitle").textContent="carico la coda…";
    $("leadSub").textContent="il desk legge il provider e dipinge subito; il triage è un bottone";
    return;
  }
  if(DESK==="issue"){
    const free=issues.filter(r=>!r.assignees.length).length;
    ["mAttention","mDecision","mWaiting","mReady"].forEach((id,i)=>{
      $(id).textContent=[free,issues.filter(r=>r.type==="DEFECT").length,
                         issues.length-free,shortlist?shortlist.rows.length:"—"][i];});
    document.querySelectorAll(".metric span").forEach((el,i)=>{
      el.textContent=["unassigned","defect","tue","in shortlist"][i];});
    $("cIssues").textContent=issues.length;$("cPrs").textContent="—";
    $("leadTitle").textContent=free?`${free} issue senza assignee`:"tutte le issue hanno un assignee";
    $("leadSub").textContent=`${issues.length} da prendere${issuesWithPr?` · ${issuesWithPr} con una PR aperta`:""}${issuesTaken?` · ${issuesTaken} in mano ad altri`:""}`;
  }else{
    const c={ready:0,attention:0,waiting:0,decision:0,reply:0};
    const current=prs.filter(r=>r.triage_status==="current");
    const pending=prs.length-current.length;
    current.forEach(r=>c[r.state]++);
    $("mAttention").textContent=c.attention;$("mDecision").textContent=c.decision;
    $("mWaiting").textContent=c.waiting;$("mReady").textContent=c.ready;
    document.querySelectorAll(".metric span").forEach((el,i)=>{
      el.textContent=["mosse tue","decisioni tue","in attesa","mergeable"][i];});
    const mine=c.attention+c.decision+c.ready;
    $("cPrs").textContent=prs.length;$("cIssues").textContent=issues.length;
    $("leadTitle").textContent=DESK==="threads"?`${threads.total||0} filoni`
      :pending?`${pending} pull request senza verdetto`:mine?`${mine} pull request aspettano una mossa tua`:"nessuna PR aspetta una mossa tua";
    $("leadSub").textContent=`${prs.length} PR · ${current.length} con triage corrente · ${issues.length} issue${multi?` · ${scope.members.length} repo`:""}`;
  }
  const notes=[];
  if(DESK==="issue"){
    notes.push("<b>Cross-check e shortlist calcolati dal desk</b> — nessun modello coinvolto.");
    const unranked=shortlist?shortlist.rows.filter(r=>!r.impact).length:0;
    notes.push(!ranked
      ? "<b>Shortlist non ancora ordinata</b> — per ora è in ordine di data: ↻ ordina shortlist fa leggere le issue e propone urgenza, dipendenze e ordine di risoluzione."
      : unranked
      ? `<b>Shortlist ordinata in parte</b> — ${unranked} entrate dopo l'ultimo ordinamento stanno in fondo, per data: ↻ ordina shortlist rilegge tutta la shortlist e rifà l'ordine.`
      : `<b>Shortlist nell'ordine di risoluzione proposto</b> — urgenza (U1–U4) e dipendenze (dopo #n) su ogni riga${session?` — ${esc(session)}`:""}.`);
    const stale=issues.filter(r=>r.analysis_stale).length;
    if(stale)notes.push(`<b>${stale} analisi da aggiornare:</b> l'issue si è mossa dopo che erano state scritte.`);
  }
  else{
    const missing=prs.filter(r=>r.triage_status==="missing").length;
    notes.push(`<b>Fetch provider completato</b> — ${prs.length} PR caricate senza eseguire pr-triage.`);
    if(missing)notes.push(`<b>${missing} senza verdetto:</b> PR mai viste da pr-triage.`);
    else notes.push(`<b>Triage corrente</b>${session?` — ${esc(session)}`:""}.`);
  }
  if(truncated)notes.push(`<b>Coda troncata:</b> il provider dichiara ${truncated} PR e la pagina ne porta ${prs.length}. Le mancanti non sono in tabella.`);
  if(issuesTruncated)notes.push(`<b>Issue troncate:</b> il repo ne ha ${issuesTruncated} aperte e il desk ne ha lette ${issues.length+issuesWithPr+issuesTaken}. Le più vecchie non sono in tabella.`);
  if(pendingMerge)notes.push("Lo stato di merge è la lettura più costosa del provider: arriva un attimo dopo, la tabella si riempie da sola.");
  banner("noteBox",notes.join(" · "),notes.length);
  renderSync();
}

$("btnPalette").onclick=openPalette;
$("scopeBtn").onclick=ev=>{ev.stopPropagation();toggleScope();};
document.querySelectorAll(".metric").forEach(m=>m.onclick=()=>{
  stateFilter=stateFilter===m.dataset.filter?null:m.dataset.filter;
  if(stateFilter){if(DESK==="threads")setMode("pr",true);view="all";}
  selectFirst();render();});
let lastKey=null,lastKeyAt=0;
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();$("palette").hidden?openPalette():closePalette();return;}
  if(!$("palette").hidden)return;
  if(e.target.tagName==="INPUT")     {if(e.key==="Escape")e.target.blur();return;}
  const chord=lastKey==="g"&&Date.now()-lastKeyAt<900;
  lastKey=e.key;lastKeyAt=Date.now();
  if(chord&&(e.key==="p"||e.key==="i"||e.key==="f")){e.preventDefault();setMode({p:"pr",i:"issue",f:"threads"}[e.key]);return;}
  if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault();moveSelection(1);}
  else if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();moveSelection(-1);}
  else if(e.key==="x"||e.key==="X"){
    e.preventDefault();
    if(selected!==null){togglePick(selected);lastPick=selected;}
  }
  else if(e.key==="Escape"){if(!$("scopePop").hidden)toggleScope(false);else if(picked.size)clearPicks();}
  else if(e.key==="s"&&picked.size){const t=chaseForPicked();if(t){e.preventDefault();copyText($("pChase"),t);}}
  else if(e.key==="l"&&picked.size){e.preventDefault();const b=$("pRun");if(b&&!b.disabled)b.click();}
  else if(e.key==="a"){const b=$("aAnalyze")||$("aWork");if(b&&!b.disabled){e.preventDefault();b.click();}}
  else if(e.key==="/"){e.preventDefault();$("q").focus();}
  else if(e.key==="Enter"){const b=$("aExec")||$("aAnalyze")||$("aWork");if(b&&!b.disabled)b.click();}
  else if(e.key>="1"&&e.key<="4"){const t=$("detailTabs");if(t&&t.children[+e.key-1])t.children[+e.key-1].click();}
});
document.addEventListener("click",e=>{
  const pop=$("scopePop");
  if(!pop.hidden&&e.target&&!pop.contains?.(e.target)&&e.target!==$("scopeBtn"))toggleScope(false);
});

$("btnTest").onclick=runTestMode;
async function runTestMode(){
  const box=$("testBox");box.classList.add("on");
  const line=(id,label)=>box.insertAdjacentHTML("beforeend",`<div id="${id}" data-label="${label}"><span class="pending">…</span> ${label}</div>`);
  const setLine=(id,ok,extra)=>{const el=$(id);el.innerHTML=`<span class="${ok?"ok":"ko"}">${ok?"✓":"✗"}</span> ${esc(el.dataset.label)}${extra?` <span class="${ok?"pending":"ko"}">— ${esc(extra)}</span>`:""}`;};
  box.innerHTML=`<div><b>Modalità test</b> — desk → JSON → agente solo su richiesta</div>`;
  ["server del desk raggiungibile","provider autenticato","cache su disco","file di stato scrivibile","agente on-demand disponibile","ping locale"]
    .forEach((l,i)=>line("t"+i,l));
  try{
    const st=await fetch("/api/selftest").then(r=>r.json());
    setLine("t0",true,`timings: ${Object.entries(timings).map(([k,v])=>`${k} ${v.source} ${v.ms}ms`).join(" · ")||"—"}`);
    setLine("t1",st.provider.ok,st.provider.ok?"login "+st.provider.login:st.provider.error);
    setLine("t2",st.cache.ok,st.cache.ok?`dato di ${st.cache.age}s fa`:"vuota");
    setLine("t3",st.state_file.ok,st.state_file.ok?"":st.state_file.error);
    setLine("t4",st.agent.ok,st.agent.ok?st.agent.selected:st.agent.error);
    const token="t"+Date.now();
    const pong=await post("/api/ping",{token});
    setLine("t5",pong.pong===token,"nessun modello avviato");
  }catch(e){setLine("t0",false,e.message);}
}
let stopArmed=null;
$("btnStop").onclick=async()=>{
  const b=$("btnStop");
  if(!stopArmed){
    b.textContent="confermi?";b.style.color="var(--red)";b.style.borderColor="var(--red)";b.style.width="auto";b.style.padding="0 8px";
    stopArmed=setTimeout(()=>{stopArmed=null;b.textContent="⏻";b.style.color="";b.style.borderColor="";b.style.width="";b.style.padding="";},4000);
    return;
  }
  clearTimeout(stopArmed);stopArmed=null;b.textContent="fermo…";b.disabled=true;
  try{await post("/api/shutdown",{});}catch(e){}
  document.body.innerHTML='<div style="padding:40px;font:14px system-ui"><b>Server fermato.</b><br>Per ripartire, avvia <code>git-desk</code>.</div>';
};

if(typeof location!=="undefined"&&location.protocol==="file:"){
  document.body.innerHTML='<div style="padding:40px;font:14px system-ui"><b>Apri il desk dal server locale.</b><br>Usa la riga <code>desk on http://127.0.0.1:…</code> che il server stampa quando parte.<br>Il file HTML diretto non avvia polling né animazioni.</div>';
}else{
  render();
  loadDesk(false);
  setInterval(()=>loadDesk(false),POLL);
  // a background tab's timers are throttled, so the poll alone can leave any
  // age of render on screen: reconcile the moment it is looked at again
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="hidden")loadDesk(false);
  });
  setInterval(renderSync,5000);
}
</script>
