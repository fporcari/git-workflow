<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review desk</title>
<style>
:root{--bg:#fbfbfa;--panel:#ffffff;--ink:#1c1b19;--muted:#67655f;--line:#e7e5e0;--soft:#f3f2ee;--sel:#edebe5;
  --rust:#c2410c;--red:#a63a0a;--amber:#8a5a00;--green:#13652f;--blue:#1e3a9a;--accent:#2b50c8;
  --att-bg:#ffe6d5;--dec-bg:#e6ecff;--ok-bg:#e2f2e7;--wait-bg:#eeede9;--warn-bg:#fff7e0;--warn-line:#ead9a0;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--split:44%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.shell{height:100vh;display:flex;flex-direction:column;min-height:0}

.topbar{height:44px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;background:var(--panel);gap:8px}
.brand,.topStats{display:flex;align-items:center;gap:8px;min-width:0}
.topStats{margin-left:auto}
.brandMark{font:600 10px/24px var(--mono);width:24px;height:24px;border-radius:6px;text-align:center;background:var(--ink);color:var(--panel);flex:none}
.brand strong{display:none}
.repo{display:none}
.scopeBtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);cursor:pointer;min-width:0;max-width:52vw}
.scopeBtn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scopeBtn span{color:var(--muted);white-space:nowrap}
.scopeBtn[aria-expanded=true]{border-color:var(--ink);background:var(--soft)}
.topStats>span:not(.chatState){display:none}
.btn{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:5px 9px;color:var(--ink);font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.primary:hover:not(:disabled){background:#3a3935}
.btn.copied,.btn.done{border-color:var(--green);color:var(--green);background:var(--ok-bg)}
.btn.working{border-color:var(--amber);color:var(--amber)}
.btn.locked{border-style:dashed;color:var(--amber);border-color:var(--amber);cursor:default;background:var(--warn-bg)}
.btn.icon{width:30px;height:30px;padding:0;justify-content:center}
.sync{display:flex;align-items:center;gap:6px}
.btn.sync.stale{border-color:var(--amber);color:var(--amber);background:var(--warn-bg)}
.sync i{width:6px;height:6px;border-radius:50%;background:#16a34a;flex:none}
.sync.loading i{background:var(--amber);animation:pulse 1s infinite}
.sync.ko i{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.chatState{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#14532d;padding:0 4px;white-space:nowrap}
.chatState::before{content:"";width:7px;height:7px;border-radius:50%;background:#16a34a}
.chatState[hidden]{display:none}

.modeTabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));flex:none;height:42px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--panel)}
.modeTabs button{border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px}
.modeTabs button[aria-selected=true]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.modeTabs b{font:500 11px var(--mono);color:var(--muted)}
.modeTabs b.hot{min-width:18px;padding:0 5px;border-radius:9px;background:var(--rust);color:#fff;text-align:center}

.scopePop{position:absolute;top:50px;left:10px;right:10px;max-width:560px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 56px rgba(28,27,25,.22);overflow:hidden}
.scopePop[hidden]{display:none}
.scopePop h2{margin:0;padding:12px 14px 4px}
.scopeRow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 14px;cursor:pointer}
.scopeRow:hover{background:var(--soft)}
.scopeRow b{font:500 12.5px var(--mono)}
.scopeRow small{grid-column:2;color:var(--muted);font-size:12px}
.scopeRow small.bare{color:var(--amber)}
.scopeRow em{font:normal 11px var(--mono);color:var(--muted)}
.scopeFoot{padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:12px;line-height:1.45}

.summary{display:flex;align-items:center;gap:6px;flex:none;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;white-space:nowrap}
.summaryLead{display:flex;align-items:baseline;gap:8px;min-width:0;margin-right:auto;padding-right:8px}
.summaryLead strong{font-size:13px;font-weight:600}
.summaryLead small{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.eyebrow,h2{font:600 10.5px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.summaryLead .eyebrow{display:none}
.metric{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid #e2e0da;border-radius:14px;background:var(--panel);cursor:pointer;color:var(--ink);font-size:12px}
.metric:hover{background:var(--soft)}
.metric.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.metric b{font:600 11px var(--mono);order:2}
.metric span{order:1}
.metric.hot b{color:var(--red)}.metric.amber b{color:var(--blue)}.metric.green b{color:var(--green)}
.metric.on b{color:var(--panel)}

.banner{display:none;flex:none;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px}
.banner.on{display:block}
.banner.err{background:#fdeee8;color:var(--red)}
.banner.warn{background:var(--warn-bg);color:var(--amber)}
.banner.info{background:var(--panel);color:var(--muted)}
.jobPanel{display:none;flex:none;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);gap:8px;flex-direction:column;max-height:30vh;overflow:auto}
.jobPanel.on{display:flex}
.jobCard{border:1px solid #ecdcb9;border-radius:8px;padding:8px 10px;background:#fffaf0}
.jobHead{display:flex;align-items:center;gap:8px;font-size:12px}.jobHead b{font:600 11.5px var(--mono)}
.jobHead .spin{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;flex:none}
.jobHead .elapsed{margin-left:auto;color:var(--muted);font:11px var(--mono)}
.reportCard{border-color:var(--line);background:var(--panel)}
.reportCard .runReport{white-space:pre-wrap;margin:7px 0 0;max-height:320px;overflow:auto;font:11.5px/1.55 var(--mono);color:var(--ink)}
.jobRail{height:2px;background:var(--soft);overflow:hidden;margin:7px 0}.jobRail i{display:block;width:28%;height:100%;background:var(--accent);animation:travel 1.8s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(-100%)}100%{transform:translateX(460%)}}
.jobCurrent{font-size:12px;color:var(--ink)}
.jobEvents{margin-top:6px;padding-top:5px;border-top:1px solid var(--line);font:11px/1.55 var(--mono);color:var(--muted);max-height:104px;overflow:auto}
.jobEvents div{display:flex;gap:8px}.jobEvents time{color:var(--accent);flex:none}.jobEvents span{overflow-wrap:anywhere}
.feed{display:none;flex:none;padding:5px 12px;border-bottom:1px solid var(--line);background:var(--panel);max-height:72px;overflow:auto;font:11px var(--mono);color:var(--muted)}
.feed.on{display:block}
.feed div{padding:1px 0}.feed b{color:var(--ink);margin-right:7px}
.testBox{display:none;flex:none;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);font:12px var(--mono)}
.testBox.on{display:block}
.testBox .ok{color:var(--green)}.testBox .ko{color:var(--red)}.testBox .pending{color:var(--muted)}

.work{flex:1;min-height:0;display:flex;flex-direction:column}
.queue{background:var(--panel);display:flex;flex-direction:column;min-height:0;flex:0 0 var(--split)}
.queue.full{flex:1 1 auto}
.queueTools{min-height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;align-self:stretch;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:12px;padding:0 8px;cursor:pointer;white-space:nowrap}
.tabs button.active{color:var(--ink);border-color:var(--ink);font-weight:600}
.tabs b{font:500 10.5px var(--mono);padding:0 5px;border-radius:8px;background:var(--soft);margin-left:3px}
.tools{display:flex;gap:6px;align-items:center;padding:4px 0}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:4px 8px;color:var(--muted)}
.search input{width:130px;border:0;outline:0;background:transparent;font-size:12px;color:var(--ink)}

.tableWrap{overflow:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;border-bottom:1px solid #efede8;padding:7px 8px;vertical-align:middle}
th{position:sticky;top:0;z-index:2;background:var(--panel);font:600 10px system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;white-space:nowrap}
th .dir{color:var(--ink)}
tbody tr{cursor:pointer;outline:none}
tbody tr:hover td{background:#f6f5f2}
tbody tr.selected td{background:var(--sel)}
tbody tr.picked td{background:#eef1fc}
tbody tr.picked td:first-child{box-shadow:inset 3px 0 var(--accent)}
tbody tr.untriaged td{background:#fffdf6}
tbody tr.untriaged.selected td{background:#f6efdc}
tbody tr.selected td:first-child{box-shadow:inset 3px 0 var(--ink)}
tbody tr.working td{background:#f3f6ff}
tbody tr.working.selected td{background:#e8eefc}
tbody tr.working td:first-child{box-shadow:inset 3px 0 var(--accent);animation:needle 1.4s ease-in-out infinite}
@keyframes needle{50%{box-shadow:inset 3px 0 #c9d5fa}}
.nowChip{display:inline-flex;align-items:center;gap:5px;font:10.5px var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:9px;padding:0 6px;white-space:nowrap}
.nowChip i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;flex:none}
.workingBar{display:none;flex:none;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;background:#f3f6ff;color:var(--blue);align-items:center;gap:8px}
.workingBar.on{display:flex}
.workingBar b{font:600 11.5px var(--mono)}
.workingBar .spin{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;flex:none}
.pickCol{width:34px;text-align:center;padding-left:10px;padding-right:2px}
/* Gmail's shape, for Gmail's reason: ticking a box must not be the same
   gesture as opening the row. The action stays one click further on, so a
   slip picks instead of acting. */
.pick{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid #c9c6be;border-radius:3px;background:var(--panel);cursor:pointer;vertical-align:middle;position:relative;flex:none;margin:0}
.pick:hover{border-color:var(--muted)}
.pick:checked{background:var(--ink);border-color:var(--ink)}
.pick:checked::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid var(--panel);border-width:0 1.5px 1.5px 0;transform:rotate(40deg)}
.pick:indeterminate{background:var(--muted);border-color:var(--muted)}
.pick:indeterminate::after{content:"";position:absolute;left:2.5px;top:5.5px;width:7px;height:0;border-top:1.5px solid var(--panel)}
.markCol{width:30px;padding-left:2px;padding-right:2px}
.mark{text-align:center}
.mark span{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font:700 11px var(--mono);background:var(--wait-bg);color:#57554f}
tr.attention .mark span{background:var(--att-bg);color:var(--red)}
tr.decision .mark span{background:var(--dec-bg);color:var(--blue)}
tr.ready .mark span{background:var(--ok-bg);color:var(--green)}
tr.untriaged .mark span{background:var(--warn-bg);color:var(--amber)}
.prTitle{min-width:0;overflow:hidden}
.l1{display:flex;align-items:center;gap:7px;min-width:0;font:12px var(--mono);color:var(--muted);white-space:nowrap}
.l1 b{color:var(--ink);font-weight:500}
.l1 .repoChip{color:var(--muted)}
.l1 .grow{margin-left:auto}
.l2{display:flex;align-items:center;gap:8px;min-width:0;margin-top:2px}
.l2>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
tr.selected .l2>span{font-weight:600}
.prTitle b.num{font:600 12px var(--mono);color:var(--ink)}
.triageChip{border:1px solid #e6d29d;border-radius:9px;padding:0 6px;color:var(--amber);font:10.5px var(--mono);white-space:nowrap}
.movePill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;border:1px solid #e2e0da;font-size:12px;font-weight:500;white-space:nowrap;color:#57554f;max-width:220px;overflow:hidden;text-overflow:ellipsis}
tr.attention .movePill{background:var(--att-bg);border-color:var(--att-bg);color:#8a2f07}
tr.decision .movePill{background:var(--dec-bg);border-color:var(--dec-bg);color:var(--blue)}
tr.ready .movePill{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--green)}
tr.untriaged .movePill{background:var(--warn-bg);border-color:var(--warn-line);color:var(--amber)}
.moveCol{text-align:right;width:168px}
@media(max-width:520px){.moveCol{width:118px}}
.avatar{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e4e2dc;color:#3f3d38;font:600 8px var(--mono);margin-right:5px;vertical-align:middle}
.status{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--muted)}
.status.attention{color:var(--red);border-color:var(--att-bg);background:var(--att-bg)}
.status.decision{color:var(--blue);border-color:var(--dec-bg);background:var(--dec-bg)}
.status.ready{color:var(--green);border-color:var(--ok-bg);background:var(--ok-bg)}
.status.untriaged{color:var(--amber);border-color:var(--warn-line);background:var(--warn-bg)}
.check{font-size:8px}
.check.CLEAN{color:var(--green)}.check.DIRTY,.check.BLOCKED{color:var(--red)}
.check.UNSTABLE{color:var(--amber)}.check.pending{color:#c9c6be}
.num{text-align:right}.mono{font:11.5px var(--mono)}
.next{max-width:250px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font:10.5px var(--mono);color:var(--muted);background:var(--soft)}
.tag.DEFECT{color:var(--red);border-color:var(--att-bg);background:var(--att-bg)}
.tag.REQUEST{color:var(--green);border-color:var(--ok-bg);background:var(--ok-bg)}
.tag.QUESTION{color:var(--blue);border-color:var(--dec-bg);background:var(--dec-bg)}
.dot{color:var(--accent);font-size:10px}
.empty{padding:26px;display:flex;flex-direction:column;align-items:center;color:var(--muted);gap:3px;text-align:center}
.empty b{color:var(--ink)}
.skel{padding:0}
.skel div{height:46px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--panel),var(--soft),var(--panel));background-size:200% 100%;animation:shimmer 1.1s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

.chaseWrap{display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:12px;overflow:auto;flex:1;min-height:0;align-content:start}
.chaseWrap.on{display:grid}
.chaseCard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
/* a login is case-sensitive: the shared h2 uppercase would show `genro` as
   `@GENRO`, which is wrong the moment somebody reads it as the handle */
.chaseCard h2{text-transform:none;letter-spacing:0;font:600 13px system-ui,sans-serif;color:var(--ink)}
.chaseCount{font:11px var(--mono);color:var(--muted);font-weight:400}
.chaseCard pre{margin:6px 0 8px;white-space:pre-wrap;font:11.5px var(--mono);color:#57554f}
.chaseNote{grid-column:1/-1;color:var(--muted);font-size:12px}

.threadsWrap{display:none;flex-direction:column;overflow:auto;flex:1;min-height:0}
.threadsWrap.on{display:flex}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.person{display:flex;flex-direction:column;gap:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);text-align:left;color:var(--ink);cursor:pointer}
.person:hover{border-color:#c9c6be}
.person.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.person.me{background:#fff6ef;border-color:#f3cdb4}
.person span{display:flex;align-items:center;gap:7px}
.person strong{flex:1;font-weight:600}
.person em{font:600 13px var(--mono);font-style:normal}
.person small{color:#57554f;font-size:12px}
.thrHead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--bg);border-bottom:1px solid #efede8;font-size:12px}
.thrHead strong{font-weight:600}
.thrHead .grow{margin-left:auto;color:var(--muted)}
.thr{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid #efede8}
.thrNode{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;color:var(--ink);cursor:pointer;width:100%}
.thrNode:hover{background:#f6f5f2}
.thrNode.pr{margin-left:14px;width:calc(100% - 14px);border-color:var(--line)}
.thrNode.stub{cursor:default;color:var(--muted)}
.thrNode i{font-style:normal;color:var(--muted)}
.thrNode .ref{font:12px var(--mono)}
.thrNode .who{font-size:12px;color:var(--muted);white-space:nowrap}
.thrNode .title{grid-column:2/4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thrNone{margin-left:14px;padding:6px 8px;border:1px dashed #d3d0c9;border-radius:8px;color:var(--muted);font-size:12px}
.thrLinks{display:flex;flex-wrap:wrap;gap:4px 12px;padding-left:6px;font-size:12px;color:#57554f}
.thrLinks .warn{color:var(--amber)}
.thrMove{display:flex;align-items:center;gap:8px;padding-left:6px}
.thrMove strong{font-weight:600}
.thrMove small{color:var(--muted)}

.splitter{flex:none;height:10px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:row-resize;touch-action:none}
.splitter::before{content:"";width:36px;height:4px;border-radius:2px;background:#c9c6be}
.splitter[hidden]{display:none}

.detail{padding:12px 12px 18px;flex:1;min-height:0;overflow:auto;background:var(--panel)}
.detailHead{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.detailHead>div:first-child{display:grid;grid-template-columns:26px 1fr;column-gap:8px;min-width:0}
.largeMark{grid-row:1/3;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--wait-bg);color:#57554f;font:700 11px var(--mono)}
.largeMark.attention{background:var(--att-bg);color:var(--red)}
.largeMark.decision{background:var(--dec-bg);color:var(--blue)}
.largeMark.ready{background:var(--ok-bg);color:var(--green)}
.largeMark.untriaged{background:var(--warn-bg);color:var(--amber)}
.detailKicker{font:11.5px var(--mono);color:var(--muted)}
h1{font-size:17px;line-height:1.3;margin:3px 0 0;letter-spacing:-.01em;font-weight:600}
.detailActions{display:flex;gap:7px;flex-wrap:wrap}
.detailActions .btn{height:34px;padding:0 12px;font-size:12.5px}
.detailTabs{display:flex;gap:2px;margin-bottom:-1px;position:relative;z-index:1}
.detailTabs button{border:1px solid transparent;border-radius:7px 7px 0 0;background:none;padding:6px 11px;color:var(--muted);font-size:12px;cursor:pointer}
.detailTabs button[aria-selected=true]{background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);color:var(--ink);font-weight:600}
.detailGrid{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:0 10px 10px 10px;background:var(--panel);overflow:hidden;min-height:140px}
.detailGrid>*{padding:12px 14px;min-width:0}
.detailGrid>*+*{border-top:1px solid var(--line)}
.wideArticle{grid-column:auto}
h2{margin:0 0 7px}
.detailGrid p{margin:0 0 10px;line-height:1.5}
.detailGrid dl{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px}
.detailGrid dl div{display:flex;flex-direction:column;gap:1px;font-size:12px}
.detailGrid dt{color:var(--muted)}
.detailGrid dd{margin:0;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.nextCard{background:#fff6ef;order:-1}
.nextCard p{font-weight:600;font-size:15px}
.nextCard small{color:var(--muted)}
.signal{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #efede8;padding:6px 0;font-size:12px}
.signal span{color:var(--muted);text-align:right}
.evidence{display:flex;flex-direction:column;padding:5px 0;border-bottom:1px solid #efede8}
.evidence code{font:11.5px var(--mono);white-space:normal}
.evidence span{font-size:11.5px;color:var(--muted)}
.thread{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #efede8}
.thread>span{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--soft);font:10px var(--mono)}
.thread p{margin:2px 0;color:var(--muted);font-size:12px}
.draft{padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.draft span{font:600 10px var(--mono);color:var(--red)}
.draft p{margin:4px 0 0;white-space:pre-wrap}
.draftActions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.detailGrid ul{margin:0;padding-left:17px;color:var(--muted);font-size:12px}
.detailGrid li{margin:4px 0}
.tabEmpty{padding:14px;color:var(--muted);border:1px dashed #dad8d2;border-radius:8px}
.actionText{border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:8px;padding:8px 10px;margin-top:9px;color:#4f3d00;font-size:12px}
.kbd{font:10.5px var(--mono);border:1px solid #dad8d2;border-bottom-width:2px;border-radius:4px;padding:0 4px;color:#4a4843;background:var(--panel)}
.timings{font:10px var(--mono);color:var(--muted)}

.pickBar{display:none;flex:none;padding:8px 10px;font-size:12px;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--panel)}
.pickBar.on{display:flex}
.pickBar b{font:600 12px var(--mono)}
.pickBar>span{color:#c9c7c1}
.pickBar .grow{margin-left:auto;display:flex;gap:6px}
.pickBar .btn{background:#2a2926;border-color:#55534d;color:var(--panel)}
.pickBar .btn.primary{background:var(--panel);border-color:var(--panel);color:var(--ink)}
.pickBar .kbd{background:#2a2926;color:var(--panel);border-color:#55534d}

.palette{position:fixed;inset:0;z-index:40;background:rgba(28,27,25,.30);display:flex;align-items:flex-start;justify-content:center;padding:52px 10px}
.palette[hidden]{display:none}
.palBox{width:100%;max-width:640px;background:var(--panel);border-radius:12px;box-shadow:0 24px 64px rgba(28,27,25,.28);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.palBox label{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid #efede8}
.palBox input{flex:1;min-width:0;border:0;outline:0;font-size:15px;background:none;color:var(--ink)}
.palList{overflow:auto;padding:4px 0 8px}
.palGroup{padding:10px 14px 4px;font:600 10.5px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.palOpt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:42px;width:calc(100% - 12px);margin:0 6px;padding:5px 10px;border:0;border-radius:7px;background:none;text-align:left;color:var(--ink);cursor:pointer}
.palOpt.on,.palOpt:hover{background:#eceffc}
.palOpt i{font:normal 13px var(--mono);color:#57554f;text-align:center}
.palOpt small{display:block;color:var(--muted);font-size:12px}
.palOpt em{font:normal 11px var(--mono);color:var(--muted)}
.palFoot{display:flex;gap:14px;height:32px;align-items:center;padding:0 14px;border-top:1px solid #efede8;font-size:12px;color:var(--muted);background:var(--bg)}

@media(min-width:1180px){
  .work{flex-direction:row}
  .queue{flex:1 1 auto;border-right:1px solid var(--line)}
  .splitter{display:none}
  .detail{flex:0 0 min(46%,600px)}
  .scopePop{right:auto;width:520px}
}
</style>
</head>
<body>
<main class="shell" id="shell">
  <header class="topbar">
    <div class="brand"><span class="brandMark">GW</span><strong id="deskName">desk</strong>
      <button class="scopeBtn" id="scopeBtn" aria-expanded="false" title="Cosa guarda il desk: i repo dello scope, e quali hanno un clone locale"><b id="scopeName">…</b><span id="scopeCount"></span></button>
      <span class="repo" id="repoLabel">…</span></div>
    <div class="topStats">
      <span><b id="cPrs">—</b> PR</span><span><b id="cIssues">—</b> issue</span>
      <span id="chatState" class="chatState" hidden title="Una chat è collegata al desk: i bottoni non-triage vengono eseguiti nella conversazione, e lì presentano l'esito. Il triage resta su un agente indipendente.">chat collegata</span>
      <button class="btn sync" id="btnFetch" title="Rilegge il provider ignorando la cache"><i></i><span id="syncLabel">avvio…</span></button>
      <button class="btn icon" id="btnPalette" title="Comandi (⌘K)" aria-label="Comandi">⌘K</button>
      <button class="btn icon" id="btnTest" title="Verifica desk, file JSON e agente on-demand" aria-label="Modalità test">✓?</button>
      <button class="btn icon" id="btnStop" title="Ferma il server del desk" aria-label="Ferma il desk">⏻</button>
    </div>
  </header>
  <nav class="modeTabs" id="modeTabs" aria-label="Viste"></nav>
  <div class="scopePop" id="scopePop" hidden></div>

  <section class="summary">
    <div class="summaryLead"><span class="eyebrow" id="leadEyebrow">coda review</span><strong id="leadTitle">carico…</strong><small id="leadSub">&nbsp;</small></div>
    <button class="metric hot" data-filter="attention" title="La prossima mossa è tua: review da fare, risposte, riallineamenti"><b id="mAttention">—</b><span>mosse tue</span></button>
    <button class="metric amber" data-filter="decision" title="Scelte che può fare solo tu: draft da chiudere, decisioni di design"><b id="mDecision">—</b><span>decisioni tue</span></button>
    <button class="metric" data-filter="waiting" title="Ferme in attesa di qualcun altro"><b id="mWaiting">—</b><span>in attesa</span></button>
    <button class="metric green" data-filter="ready" title="Approvate, CLEAN, zero richieste pendenti: pronte al merge"><b id="mReady">—</b><span>mergeable</span></button>
  </section>

  <div class="workingBar" id="workingBar"></div>
  <div class="banner err" id="errBox"></div>
  <div class="banner warn" id="agentBox"></div>
  <div class="jobPanel" id="jobPanel"></div>
  <div class="banner info" id="noteBox"></div>
  <div class="testBox" id="testBox"></div>
  <div class="feed" id="feedBox"></div>

  <div class="work" id="work">
    <section class="queue" id="queue">
      <div class="queueTools">
        <div class="tabs" id="tabs"></div>
        <div class="tools">
          <button class="btn" id="btnTriage"></button>
          <button class="btn primary" id="btnRun"></button>
          <label class="search"><span>⌕</span><input id="q" placeholder="Filtra…" aria-label="Filtra numero, titolo, autore, repo"></label>
        </div>
      </div>
      <div class="tableWrap" id="tableWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
        <div class="empty" id="empty" style="display:none"></div></div>
      <div class="chaseWrap" id="chaseWrap"></div>
      <div class="threadsWrap" id="threadsWrap"></div>
    </section>
    <div class="splitter" id="splitter" aria-hidden="true" title="Trascina per dare più spazio alla lista o al dettaglio"></div>
    <section class="detail" id="detail"></section>
  </div>
  <div class="pickBar" id="pickBar"></div>
  <div class="palette" id="palette" hidden>
    <div class="palBox" role="dialog" aria-label="Comandi">
      <label><span aria-hidden="true">⌕</span><input id="palInput" placeholder="Cerca un comando, una vista, una persona…" aria-label="Comando"></label>
      <div class="palList" id="palList"></div>
      <div class="palFoot"><span>↑↓ scegli</span><span>↵ esegui</span><span style="margin-left:auto">esc chiudi</span></div>
    </div>
  </div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* states that are not in "Da fare": somebody else's move, or only a comment due */
const AWAY=["waiting","reply"];
const MARK={ready:"✓",attention:"!",waiting:"○",decision:"◆",reply:"✎",untriaged:"?"};
const STATE_LABEL={ready:"mergeable",attention:"mossa tua",waiting:"in attesa",decision:"decisione tua",reply:"da rispondere",untriaged:"senza verdetto"};
const AUTORUN_TIP="Cosa può fare pr-loop da solo: A1 merge (tua PR approvata e CLEAN) · A2 edit banale chiesto dal reviewer · A3 riallineo del branch · asks richiede una decisione · yours decisione solo tua · - tocca ad altri";

let meta={},writeToken="",DESK="pr",deskKind=null,prs=[],issues=[],issueOthers=[],chase={},replies={},grid=null,shortlist=null,session=null;
let threads={groups:[],people:{},total:0},scope={name:"",members:[]},labels={},multi=false;
let hiddenRepos=new Set(),personFilter=null;
let loaded=false,view="todo",query="",stateFilter=null,agentReady=true;
let issuesTruncated=null,issuesWithPr=0,issuesTaken=0,triageComplete=false,ranked=false,gates={};
let selected=null,tab="quadro",sort={key:"created",dir:-1},acting={},truncated=null,pendingMerge=false;
const POLL=30000,STALE_PAINT=70;   // a paint older than two polls is behind
let deskEtag=null,fetching=false,lastGenerated=null,lastPaintAt=null,timings={};
let staleRetry=null;
let triageStamp=null;   // when the published triage changes, repaint the rows
let providerRefresh=null; // a completed provider mutation forces one fresh read
let flows={};
let jobRecords={},runs={},runOpen=true,runHidden=null;
let pendingClicks={},pendingTick=null;
let agentPoll=null;
let workingOn=null,workings=[];
let picked=new Set();   // the rows chosen by hand for the next loop, by key
let lastPick=null;      // anchor for a shift-click range, as in a mail client
let askBatch=false;     // ▶ pressed on a multi-row pick: one at a time, or in parallel?
const MAX_BATCH=4;      // one decision group holds four readable proposals
/* A row is a repository's PR or issue: `owner/repo#n` is its name, a bare
   number is not one once a desk covers several repositories. */
const rk=r=>r?`${r.repo||""}#${r.n}`:null;
const refOf=r=>r.label||`#${r.n}`;
const onNow=r=>workings.some(w=>(!w.repo||w.repo===r.repo)&&(w.ns||[w.n]).includes(r.n));

/* ---------- helpers ---------- */
function ageDays(d){return Math.max(0,Math.round((Date.now()-new Date(d))/864e5));}
async function copyText(btn,text){
  try{await navigator.clipboard.writeText(text);}
  catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}
  flash(btn,"copiato ✓","copied");
}
function flash(btn,label,cls){
  if(!btn)return;const old=btn.textContent;btn.textContent=label;btn.classList.add(cls);
  setTimeout(()=>{btn.textContent=old;btn.classList.remove(cls);},1500);
}
function banner(id,html,on){const b=$(id);b.innerHTML=html||"";b.classList.toggle("on",!!on&&!!html);}
function localFeed(msg){
  const box=$("feedBox");box.classList.add("on");
  box.insertAdjacentHTML("afterbegin",`<div><b>${new Date().toTimeString().slice(0,8)}</b>${esc(msg)}</div>`);
}
const repoLabel=repo=>labels[repo]||String(repo||"").split("/").pop();
const STAGE_LABEL={queued:"in coda",starting:"avvio",working:"al lavoro",
  inspecting:"lettura",testing:"verifica",waiting:"in attesa",
  finalizing:"chiusura",done:"completato","needs-input":"serve una decisione",error:"errore"};
function jobUiKey(job){
  const req=job.request||{},flow=req.flow;
  if(flow&&flow!=="order")return "flow:"+flow;
  if(req.n!==undefined)return (job.kind==="issue-analyze"?"i":"p")+`${req.repo||""}#${req.n}`;
  return "job:"+job.id;
}
function rememberJob(job){
  if(!job||!job.id)return;
  jobRecords[job.id]=job;
  const key=jobUiKey(job);
  if(key.startsWith("flow:"))flows[key.slice(5)]=job;
  else acting[key]=job;
}
function forgetJob(job,key){
  if(job&&job.id)delete jobRecords[job.id];
  if(key&&key.startsWith("flow:"))delete flows[key.slice(5)];
  else if(key)delete acting[key];
}
/* Between the press and the server's 202 there are seconds of provider work
   (a triage rereads the whole queue). With nothing drawn here the desk looks
   like it ignored the click, and the user presses again. */
function startPending(key,title){
  pendingClicks[key]={title,at:Date.now()};
  if(!pendingTick)pendingTick=setInterval(renderJobs,1000);
  render();
}
function endPending(key){
  delete pendingClicks[key];
  if(!Object.keys(pendingClicks).length&&pendingTick){
    clearInterval(pendingTick);pendingTick=null;
  }
  renderJobs();
}
const clock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function pendingCard(entry){
  return `<div class="jobCard"><div class="jobHead"><span class="spin"></span>
    <b>${esc(entry.title)}</b><span>${esc(STAGE_LABEL.queued)}</span>
    <span class="elapsed">${esc(clock(Math.floor((Date.now()-entry.at)/1000)))}</span></div>
    <div class="jobRail"><i></i></div>
    <div class="jobCurrent">richiesta inviata al desk — legge il provider e avvia il processo</div></div>`;
}
function jobTitle(job){
  const req=job.request||{},where=multi&&req.repo?repoLabel(req.repo)+" ":"";
  if(req.flow)return req.flow+(req.ns&&req.ns.length?" · "+where+req.ns.map(n=>"#"+n).join(" "):req.n?" · "+where+"#"+req.n:"");
  return (job.kind||"job")+(req.n?" · "+where+"#"+req.n:"");
}
function lastRun(){
  const rows=Object.entries(runs||{}).filter(([,r])=>r&&r.report);
  if(!rows.length)return null;
  rows.sort((a,b)=>String(a[1].at||"").localeCompare(String(b[1].at||"")));
  const [key,run]=rows[rows.length-1],stamp=key+"@"+(run.at||"");
  return stamp===runHidden?null:{key,run,stamp};
}
const runTime=run=>String(run.at||"").slice(-8);
function runCard(last){
  const {key,run}=last;
  return `<div class="jobCard reportCard"><div class="jobHead">
    <b>${esc(key)}</b><span>${esc(STAGE_LABEL[run.status]||run.status||"")}</span>
    <span class="elapsed">${esc(runTime(run))}</span>
    <button class="btn" data-run-toggle>${runOpen?"nascondi":"leggi"}</button>
    <button class="btn" data-run-close>✕</button></div>
    ${runOpen?`<pre class="runReport">${esc(run.report||"")}</pre>`:""}</div>`;
}
function renderJobs(){
  const box=$("jobPanel"),jobs=Object.values(jobRecords).filter(j=>j.status==="running");
  const waiting=Object.values(pendingClicks);
  const last=lastRun();
  const busy=jobs.length>0||waiting.length>0;
  box.classList.toggle("on",busy||!!last);
  if(!busy&&!last){box.innerHTML="";return;}
  // what is happening NOW first: a persistent report card on top pushed the
  // live progress under the fold, and a buried card reads as no card at all
  box.innerHTML=waiting.map(pendingCard).join("")+jobs.map(job=>{
    const p=job.progress||{},events=(job.events||[]).slice(-7);
    return `<div class="jobCard"><div class="jobHead"><span class="spin"></span>
      <b>${esc(jobTitle(job))}</b><span>${esc(STAGE_LABEL[p.stage]||p.stage||"al lavoro")}</span>
      <span class="elapsed">${esc(clock(p.elapsed||0))} · ${esc(job.agent||"")}</span></div>
      <div class="jobRail"><i></i></div><div class="jobCurrent">${esc(p.detail||"processo avviato")}</div>
      ${events.length?`<div class="jobEvents">${events.map(e=>`<div><time>${esc(e.at||"")}</time><span>${esc(e.detail||e.stage||"")}</span></div>`).join("")}</div>`:""}</div>`;
  }).join("")+(last?runCard(last):"");
  const toggle=box.querySelector("[data-run-toggle]");
  if(toggle)toggle.onclick=()=>{runOpen=!runOpen;renderJobs();};
  const close=box.querySelector("[data-run-close]");
  if(close)close.onclick=()=>{runHidden=(last||{}).stamp;runOpen=true;renderJobs();};
}

/* ---------- data ---------- */
async function loadDesk(refetch){
  fetching=true;renderSync();
  try{
    const resp=refetch
      ? await fetch("/api/fetch",{method:"POST",headers:{"X-Git-Workflow-Token":writeToken}})
      : await fetch("/api/desk",{headers:deskEtag?{"If-None-Match":deskEtag}:{}});
    // a 304 is the server confirming THIS paint is still the truth, which is
    // what the age measures: on a quiet desk every poll is a 304, and leaving
    // the stamp alone would mark a perfectly current page as behind
    if(resp.status===304){lastPaintAt=Date.now();fetching=false;renderSync();return;}
    if(!refetch)deskEtag=resp.headers.get("ETag");
    const d=await resp.json();
    if(d.error)throw new Error(d.error);
    applyDesk(d);
    banner("errBox","",false);
  }catch(e){
    banner("errBox",`<b>Provider:</b> ${esc(e.message)}`,true);
  }
  fetching=false;render();
  const stale=Object.values(timings).some(t=>t&&t.source==="stale");
  if(stale&&!staleRetry){
    staleRetry=setTimeout(()=>{staleRetry=null;loadDesk(false);},7000);
  }else if(!stale&&staleRetry){
    clearTimeout(staleRetry);staleRetry=null;
  }
}
function applyDesk(d){
  meta=d.meta||meta;writeToken=meta.write_token||writeToken;timings=d.timings||{};
  // the server's kind opens the page on its view; after that the view is his
  if(meta.desk!==deskKind){deskKind=meta.desk;DESK=meta.desk||"pr";}
  scope=meta.scope||{name:meta.repo,members:[{repo:meta.repo,clone:true}]};
  multi=(scope.members||[]).length>1;
  labels=Object.fromEntries((scope.members||[]).map(m=>[m.repo,m.label||String(m.repo).split("/").pop()]));
  agentReady=meta.detached!==false;
  prs=d.queue.rows;issues=d.issues.rows;issueOthers=d.issues.others||[];
  chase=d.queue.chase||{};replies=d.queue.replies||{};
  threads=d.threads||threads;
  session=d.queue.session;lastGenerated=d.generated;lastPaintAt=Date.now();
  truncated=d.queue.truncated?d.queue.total:null;
  issuesTruncated=d.issues.truncated?d.issues.total:null;issuesWithPr=d.issues.excluded_with_pr||0;issuesTaken=d.issues.excluded_taken||0;
  triageComplete=!!d.queue.triage_complete;
  ranked=!!d.issues.ranked;
  gates=d.queue.gates||{};
  grid=d.queue.grid||null;
  shortlist=d.issues.shortlist||null;
  flows=d.state&&d.state.flows||flows;
  pendingMerge=!!d.queue.mergestate_pending;
  // these rows are already reconciled against this stamp: record it before
  // applyState, or the poll would ask for the paint it just did
  triageStamp=(d.state&&d.state.triage&&d.state.triage.generated)||null;
  providerRefresh=(d.state&&d.state.provider_refresh&&d.state.provider_refresh.token)||null;
  applyState(d.state);
  loaded=true;
  if(DESK==="pr"&&view==="todo"&&prs.some(r=>r.triage_status!=="current"))view="untriaged";
  if(DESK==="pr"&&view==="untriaged"&&triageComplete)view="todo";
  // a merged PR, a filter, a desk switch: the old selection may be gone
  if(!selectedRow())selectFirst();
}
function applyState(st){
  if(!st)return;
  // the state poll carries the STAMP of the published triage, not the grid:
  // matching fingerprints is the server's job and it does it once, in
  // /api/queue. A new stamp means the desk has rows to repaint.
  const stamp=(st.triage&&st.triage.generated)||null;
  if(stamp!==triageStamp){
    triageStamp=stamp;
    if(loaded)loadDesk(false);
  }
  const refresh=(st.provider_refresh&&st.provider_refresh.token)||null;
  if(refresh!==providerRefresh){
    providerRefresh=refresh;
    if(loaded&&refresh)loadDesk(true);
  }
  session=st.session||session;
  if(DESK==="issue"&&Object.keys(st.chase||{}).length)chase=st.chase;
  const chat=st.chat||{};
  const chip=$("chatState");
  if(chip)chip.hidden=!chat.attached;
  const agent=st.agent||{};
  banner("agentBox",agent.busy?"<b>Agente one-shot in esecuzione.</b> Il server continua a servire i JSON del desk.":"",!!agent.busy);
  const liveJobs=agent.jobs||[],liveIds=new Set(liveJobs.map(job=>job.id));
  liveJobs.forEach(rememberJob);
  for(const job of Object.values(jobRecords))
    if(job.status==="running"&&!liveIds.has(job.id))forgetJob(job,jobUiKey(job));
  if(agent.busy&&!agentPoll)agentPoll=setInterval(pollState,1000);
  if(!agent.busy&&agentPoll){clearInterval(agentPoll);agentPoll=null;}
  const wasOn=workings.map(w=>(w.repo||"")+(w.ns||[w.n]).join(",")).join("|");
  workingOn=st.working||null;
  workings=st.workings||(workingOn?[workingOn]:[]);
  const isOn=workings.map(w=>(w.repo||"")+(w.ns||[w.n]).join(",")).join("|");
  if(isOn&&isOn!==wasOn)followWorking=true;
  runs=st.runs||runs;
  const feed=st.feed||[];
  const box=$("feedBox");
  box.classList.toggle("on",feed.length>0);
  if(feed.length)box.innerHTML=feed.slice(-8).reverse().map(f=>`<div><b>${esc(f.at)}</b>${f.pr?`<b>${multi&&f.repo?esc(repoLabel(f.repo))+" ":""}#${f.pr}</b> `:""}${esc(f.msg)}</div>`).join("");
}
let stateEtag=null;
async function pollState(){
  try{
    const resp=await fetch("/api/state",{headers:stateEtag?{"If-None-Match":stateEtag}:{}});
    if(resp.status===304)return;
    stateEtag=resp.headers.get("ETag");
    applyState(await resp.json());
    render();
  }catch(e){}
}

/* ---------- selection ---------- */
function rows(){return DESK==="issue"?visibleIssues():DESK==="threads"?[]:visiblePrs();}
function allRows(){return DESK==="issue"?issues.concat(issueOthers):prs;}
function rowByKey(k){return allRows().find(r=>rk(r)===k)||null;}
function keyFor(x){return x&&typeof x==="object"?rk(x):x;}
function selectFirst(){const r=rows();selected=r.length?rk(r[0]):null;tab="quadro";}
function select(x){const k=keyFor(x);if(selected!==k){selected=k;tab="quadro";}render();}
function nowMsg(r){
  const w=workings.find(w=>(!w.repo||w.repo===r.repo)&&(w.ns||[w.n]).includes(r.n));
  return (w&&(w.items||{})[String(r.n)])||(w&&w.msg)||"in corso";
}
/* A plain click moves the cursor and NEVER drops the picks: reading a row's
   detail must not cost the four he chose. cmd/ctrl toggles one, shift takes
   the stretch from the cursor. */
function rowClick(k,ev){
  // the checkbox owns picking; a click on the row only ever opens it
  if(ev&&ev.target&&ev.target.classList&&ev.target.classList.contains("pick"))return;
  select(k);
}
function pickCell(r){
  const k=rk(r);
  return `<td class="pickCol"><input type="checkbox" class="pick" data-pick="${esc(k)}"
    ${picked.has(k)?"checked":""} aria-label="scegli ${esc(refOf(r))}"
    title="Scegli questa per il prossimo loop. Selezionare non lancia niente: l'azione è nella striscia in basso."></td>`;
}
function pickHead(list){
  // the third state (some but not all) is set on the node in wirePicks:
  // `indeterminate` is a property, not an attribute, so markup cannot carry it
  const all=list.length&&list.every(r=>picked.has(rk(r)));
  return `<th class="pickCol"><input type="checkbox" class="pick" id="pickAll" ${all?"checked":""}
    aria-label="scegli tutte le righe di questa vista"
    title="${all?"Togli la scelta da tutte le righe di questa vista"
                :"Scegli tutte le righe di questa vista"} (${list.length})"></th>`;
}
function wirePicks(list){
  const all=$("pickAll");
  if(all){
    const every=list.length&&list.every(r=>picked.has(rk(r)));
    all.indeterminate=!every&&list.some(r=>picked.has(rk(r)));
    all.onclick=ev=>{
      ev.stopPropagation();
      if(every)list.forEach(r=>picked.delete(rk(r)));
      else list.forEach(r=>picked.add(rk(r)));
      askBatch=false;render();
    };
  }
  document.querySelectorAll("[data-pick]").forEach(box=>{
    box.onclick=ev=>{
      ev.stopPropagation();           // ticking must not open the row
      const k=box.dataset.pick;
      // shift extends from the last box touched, the way a mail client does
      if(ev.shiftKey&&lastPick!==null&&lastPick!==k)pickRange(lastPick,k,box.checked);
      else box.checked?picked.add(k):picked.delete(k);
      lastPick=k;askBatch=false;render();
    };
  });
}
function togglePick(x){
  const k=keyFor(x);
  picked.has(k)?picked.delete(k):picked.add(k);
  askBatch=false;render();
}
function pickRange(from,to,on){
  const list=rows(),a=list.findIndex(r=>rk(r)===from),b=list.findIndex(r=>rk(r)===to);
  if(a<0||b<0)return togglePick(to);
  for(let i=Math.min(a,b);i<=Math.max(a,b);i++)
    on?picked.add(rk(list[i])):picked.delete(rk(list[i]));
}
function clearPicks(){picked.clear();askBatch=false;render();}
function selectedRow(){return selected===null?null:rowByKey(selected);}
function moveSelection(delta){
  const r=rows();if(!r.length)return;
  const i=r.findIndex(x=>rk(x)===selected);
  const next=r[Math.max(0,Math.min(r.length-1,(i<0?0:i+delta)))];
  selected=rk(next);tab="quadro";render();
  const tr=document.querySelector("tr.selected");if(tr)tr.scrollIntoView({block:"nearest"});
}
function setMode(mode,keep){
  if(DESK===mode&&!keep)return;
  DESK=mode;stateFilter=null;personFilter=null;picked.clear();askBatch=false;
  view=mode==="issue"?"all":mode==="threads"?"threads":(triageComplete?"todo":"untriaged");
  if(!keep)selectFirst();
  render();
}

/* ---------- filtering ---------- */
function matches(r,fields){
  const q=query.trim().toLowerCase();
  return !q||fields.filter(Boolean).join(" ").toLowerCase().includes(q);
}
const shown=r=>!hiddenRepos.has(r.repo);
function visiblePrs(){
  let list=prs.filter(r=>shown(r)&&matches(r,[r.n,r.label,r.title,r.author,r.todo,r.base]));
  if(stateFilter)list=list.filter(r=>r.state===stateFilter);
  else if(view==="untriaged")list=list.filter(r=>r.triage_status!=="current");
  else if(view==="todo")list=list.filter(r=>r.triage_status==="current"&&!AWAY.includes(r.state));
  else if(view==="waiting")list=list.filter(r=>r.triage_status==="current"&&r.state==="waiting");
  return sortRows(list);
}
function visibleIssues(){
  const source=view==="withpr"?issueOthers.filter(r=>r.excluded==="with_pr")
    :view==="taken"?issueOthers.filter(r=>r.excluded==="taken"):issues;
  let list=source.filter(r=>shown(r)&&matches(r,[r.n,r.label,r.title,r.author,(r.labels||[]).join(" "),r.type]));
  if(view==="free")list=list.filter(r=>!r.assignees.length);
  if(view==="shortlist")list=list.filter(r=>r.in_shortlist);
  return sortRows(list);
}
const SORTERS={
  n:r=>r.n,created:r=>r.created,author:r=>r.author||"",title:r=>(r.title||"").toLowerCase(),
  state:r=>["untriaged","attention","decision","ready","reply","waiting"].indexOf(r.state),
  merge:r=>r.merge||"",unresolved:r=>r.unresolved||0,decision:r=>r.decision||"",
  todo:r=>r.todo||"",autorun:r=>r.autorun||"",type:r=>r.type||"",
  comments:r=>r.comments||0,assignees:r=>(r.assignees||[]).join(","),repo:r=>r.repo||"",
};
function sortRows(list){
  const get=SORTERS[sort.key]||SORTERS.created;
  return list.slice().sort((a,b)=>{const x=get(a),y=get(b);return (x>y?1:x<y?-1:0)*sort.dir;});
}
function setSort(key){
  if(sort.key===key)sort.dir=-sort.dir;else sort={key,dir:key==="created"||key==="n"?-1:1};
  render();
}

/* ---------- header / tabs ---------- */
const VIEWS=()=>DESK==="threads"?[]:DESK==="issue"?[
  {id:"all",label:"Da prendere",count:loaded?issues.length:"—",tip:"Le issue ancora da prendere: libere o tue, e nessuna PR aperta le cita"},
  {id:"shortlist",label:"Shortlist",count:shortlist?shortlist.rows.length:"—",tip:"Le 10 issue più recenti che nessuno ha preso e su cui non hai ancora scritto, senza PR aperte: la calcola il desk. ↻ ordina shortlist le mette in ordine di risoluzione"},
  {id:"free",label:"Unassigned",count:issues.filter(r=>!r.assignees.length).length,tip:"Le candidate per issue-loop: nessuno le ha ancora prese"},
  {id:"withpr",label:"Con PR",count:issueOthers.filter(r=>r.excluded==="with_pr").length,tip:"Issue che una PR aperta chiude o cita: il lavoro è già partito, si segue dai Filoni"},
  {id:"taken",label:"Di altri",count:issueOthers.filter(r=>r.excluded==="taken").length,tip:"Issue assegnate a qualcun altro: nel workflow Softwell non si lavora su una issue di altri"},
]:[
  {id:"untriaged",label:"Senza verdetto",count:prs.filter(r=>r.triage_status!=="current").length,tip:"PR aperte che non sono mai passate da pr-triage né da un analyze"},
  {id:"todo",label:"Da fare",count:prs.filter(r=>r.triage_status==="current"&&!AWAY.includes(r.state)).length,tip:"Le PR triagiate dove la prossima mossa è tua, e non è solo un commento"},
  {id:"waiting",label:"In attesa",count:prs.filter(r=>r.triage_status==="current"&&r.state==="waiting").length,tip:"PR triagiate ferme in attesa di altri"},
  {id:"all",label:"Tutte",count:loaded?prs.length:"—",tip:"Tutte le PR aperte in cui sei coinvolto"},
  {id:"blocks",label:"Blocks",count:grid?grid.blocks.filter(b=>b.rows.length).length:"—",tip:"I cinque blocchi pubblicati dall'ultimo pr-triage esplicito"},
  {id:"chase",label:"Chase",count:Object.keys(chase).length+Object.keys(replies).length,tip:"Un messaggio pronto per ogni persona da sollecitare, e le risposte che devi"},
];
function renderModeTabs(){
  const mine=prs.filter(r=>r.triage_status==="current"&&!AWAY.includes(r.state)).length;
  const items=[["pr","Pull request",loaded?prs.length:"—",mine],
               ["issue","Issue",loaded?issues.length:"—",0],
               ["threads","Filoni",loaded?threads.total||0:"—",0]];
  const html=items.map(([id,label,count,hot])=>
    `<button data-mode="${id}" aria-selected="${DESK===id}">${label} ${hot?`<b class="hot" title="aspettano una mossa tua">${hot}</b>`:`<b>${count}</b>`}</button>`).join("");
  if(paint($("modeTabs"),html))
    $("modeTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
}
/* Rebuilt only when it changed: a poll that replaces the button between
   mousedown and mouseup swallows the click. */
function paint(el,html){
  if(el.dataset.painted===html)return false;
  el.innerHTML=html;el.dataset.painted=html;return true;
}
function renderTabs(){
  renderModeTabs();
  if(paint($("tabs"),VIEWS().map(v=>`<button class="${view===v.id?"active":""}" data-v="${v.id}" title="${esc(v.tip)}">${v.label} <b>${v.count}</b></button>`).join("")))
    $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;stateFilter=null;selectFirst();render();});
  const onIssue=DESK==="issue";
  const tri=$("btnTriage");
  const triFlow=onIssue?"issue-triage":"pr-triage";
  const flowOut=rec=>!!(rec&&OUT_STATUS.includes(rec.status));
  const triOut=flowOut(flows[triFlow]);
  const untriaged=onIssue?0:prs.filter(r=>r.triage_status!=="current").length;
  const unranked=onIssue&&shortlist?shortlist.rows.filter(r=>!r.impact).length:0;
  tri.textContent=onIssue
    ?(triOut?"in corso · ordino la shortlist":`↻ ordina shortlist · ${unranked?unranked+" da ordinare":"✓"}`)
    :(triOut?"in corso · ":"↻ ")+triFlow+` · ${untriaged||"✓"}`;
  tri.title=(onIssue
    ?"La shortlist la calcola il desk da solo a ogni lettura. Questo bottone fa leggere a un agente one-shot (issue-triage) le issue in shortlist ancora senza ordine: urgenza U1–U4, da quali dipendono, e l'ordine in cui risolverle."
    :"Rilegge il provider, pubblica i verdetti freschi e avvia un agente one-shot solo per gli artefatti mancanti.")
    +(multi?` Lo fa su ognuno dei ${scope.members.length} repo dello scope.`:"");
  tri.disabled=!agentReady||triOut||!loaded;
  tri.classList.toggle("locked",!!triOut);
  const run=$("btnRun");
  const runFlow=onIssue?"issue-loop":"pr-loop";
  const runOut=flowOut(flows[runFlow]);
  const nPicked=picked.size;
  run.hidden=DESK==="threads";
  run.textContent=(runOut?(flows[runFlow]&&flows[runFlow].via==="chat"?"in chat · ":"in corso · "):"▶ ")+runFlow+(nPicked?` · ${nPicked} scelte`:"");
  run.title=nPicked
    ?`Lancia ${runFlow} SOLO su ${pickedLabels().join(" ")}, in quest'ordine, e poi si ferma. Il resto della coda non lo tocca.`
    :onIssue
    ?"Avvia issue-loop come processo one-shot sulle righe scelte; quando serve una nuova decisione si ferma e la riporta."
    :"Avvia pr-loop come processo one-shot: esegue le mosse già autorizzate e si ferma quando serve una nuova decisione.";
  run.disabled=!agentReady||runOut||(!nPicked&&multi);
  if(!nPicked&&multi)run.title="Su uno scope di più repo il loop parte sulle righe scelte: spunta quelle da lavorare.";
  run.classList.toggle("locked",!!runOut);
  renderPick(runFlow,runOut);
  document.querySelectorAll(".metric").forEach(m=>m.classList.toggle("on",stateFilter===m.dataset.filter));
}
function pickedLabels(){
  return [...picked].map(k=>{const r=rowByKey(k);return r?refOf(r):k;});
}
/* The picks, and the one question the desk asks: several rows chosen and ▶
   pressed can mean two different runs — one at a time, or all of them in
   parallel worktrees. Guessing it would be guessing how much he has already
   decided, so the strip asks instead. */
function renderPick(runFlow,runOut){
  const bar=$("pickBar"),n=picked.size;
  bar.classList.toggle("on",n>0);
  if(!n)return;
  const label=pickedLabels().join(" ");
  if(askBatch&&n>1){
    const size=Math.min(n,MAX_BATCH);
    bar.innerHTML=`<b>${n} scelte</b><span>${esc(label)} — una alla volta, o tutte insieme?</span>
      <span class="grow">
        <button class="btn" id="pOne" title="Le propone una per volta, nell'ordine in cui le hai scelte: leggi, rispondi, passa alla prossima.">Una alla volta</button>
        <button class="btn primary" id="pBatch" title="Ti propone ${size} in un colpo e le esegue in parallelo, ogni fix nel suo worktree.${n>MAX_BATCH?` Le altre ${n-size} dopo, nello stesso giro.`:""}">Batch da ${size}</button>
        <button class="btn" id="pCancel">annulla</button></span>`;
    $("pOne").onclick=()=>{askBatch=false;runPicked(runFlow,1);};
    $("pBatch").onclick=()=>{askBatch=false;runPicked(runFlow,size);};
    $("pCancel").onclick=()=>{askBatch=false;render();};
    return;
  }
  const sollecito=chaseForPicked();
  bar.innerHTML=`<b>${n} scelt${n===1?"a":"e"}</b><span>${esc(label)}</span>
    <span class="grow">
      ${sollecito?`<button class="btn primary" id="pChase" title="Un messaggio per chi deve muoversi su queste, pronto da incollare">Copia sollecito <span class="kbd">s</span></button>`:""}
      <button class="btn${sollecito?"":" primary"}" id="pRun" ${agentReady&&!runOut?"":"disabled"}
        title="Lancia ${esc(runFlow)} solo su queste, e poi si ferma.">▶ ${esc(runFlow)} su queste <span class="kbd">l</span></button>
      <button class="btn" id="pClear">svuota <span class="kbd">esc</span></button></span>`;
  $("pClear").onclick=clearPicks;
  const go=$("pRun");
  if(go)go.onclick=()=>{if(picked.size>1){askBatch=true;render();}else runPicked(runFlow,1);};
  const ch=$("pChase");
  if(ch)ch.onclick=()=>copyText(ch,sollecito);
}
/* The chase of the picked rows: his own PRs waiting on somebody, one
   message per person, the same rule as the Chase tab. */
function chaseForPicked(){
  if(DESK!=="pr")return "";
  const per={};
  for(const k of picked){
    const r=rowByKey(k);
    if(!r||r.state!=="waiting"||r.author!==meta.me||!r.waiting_on)continue;
    (per[r.waiting_on]=per[r.waiting_on]||[]).push(r);
  }
  return Object.entries(per).map(([who,list])=>`@${who} — ${list.length} PR ferm${list.length===1?"a":"e"} su di te:\n`+
    list.map(r=>`${refOf(r)} (${r.created}) ${r.title}`).join("\n")).join("\n\n");
}
let followWorking=false;
function renderWorking(){
  const bar=$("workingBar");
  bar.classList.toggle("on",workings.length>0);
  if(!workings.length)return;
  const w=workings[0],ns=w.ns||[w.n],where=multi&&w.repo?repoLabel(w.repo)+" ":"";
  const list=w.repo?prs.concat(issues,issueOthers).filter(r=>r.repo===w.repo):(DESK==="issue"?issues:prs);
  const row=list.find(r=>r.n===ns[0]);
  const many=ns.length>1||workings.length>1;
  bar.innerHTML=`<span class="spin"></span><b>${esc(where)}${ns.map(n=>"#"+n).join(" ")}${workings.length>1?` +${workings.length-1} repo`:""}</b>
    <span>${esc(many?`${ns.length} in parallelo — ${w.msg||"in lavorazione"}`
                    :row?nowMsg(row):(w.msg||"in corso"))}</span>
    <span style="color:var(--muted)">dalle ${esc(w.at||"")}</span>
    ${row?`<button class="btn" id="goWorking" style="margin-left:auto">${many?"Vai alla prima":"Vai alla riga"}</button>`:""}`;
  const go=$("goWorking");
  if(go)go.onclick=()=>{
    const mode=issues.concat(issueOthers).includes(row)?"issue":"pr";
    if(DESK!==mode)setMode(mode,true);
    stateFilter=null;query="";$("q").value="";view="all";select(row);scrollToWorking();};
}
function scrollToWorking(){
  const tr=document.querySelector("tr.working")||document.querySelector("tr.selected");
  if(tr)tr.scrollIntoView({block:"nearest"});
}
function paintAge(){return lastPaintAt?Math.round((Date.now()-lastPaintAt)/1000):0;}
function ageLabel(s){
  if(s<60)return `${s}s`;
  if(s<3600)return `${Math.floor(s/60)}m`;
  return `${Math.floor(s/3600)}h`;
}
function renderSync(){
  const el=$("btnFetch"),lab=$("syncLabel");
  el.classList.toggle("loading",fetching);
  el.classList.toggle("ko",!fetching&&!loaded);
  const t=timings.queue;
  const stale=loaded&&paintAge()>STALE_PAINT;
  lab.textContent=fetching?"leggo…":(loaded?`⟳ ${ageLabel(paintAge())}`:"⟳ ricarica");
  el.classList.toggle("stale",!!stale);
  const painted=lastGenerated?`dipinto alle ${lastGenerated}`:"";
  el.title=stale?`${painted}: più di ${STALE_PAINT}s, la pagina è rimasta indietro — clic per rileggere il provider`
          :t?`ultimo giro: ${t.source} (${t.ms} ms, dato di ${t.age}s fa), ${painted} — clic per rileggere il provider`
             :"clic per rileggere il provider";

/* ---------- table ---------- */
function th(key,label,extra){
  const arrow=sort.key===key?`<span class="dir">${sort.dir>0?"▲":"▼"}</span>`:"";

}
const repoChip=r=>multi?`<span class="repoChip">${esc(repoLabel(r.repo))}</span>`:"";
function closesLine(r){

  return `<span title="issue che questa PR chiude">→ ${c.map(x=>`${x.repo&&x.repo!==r.repo?esc(repoLabel(x.repo))+" ":""}#${x.issue}`).join(" ")}</span>`;

function renderTable(){

        <td class="prTitle"><div class="l1">${repoChip(r)}<b class="num">#${r.n}</b><span class="tag ${esc(r.type)}">${esc(r.type)}</span>${(r.labels||[]).slice(0,2).map(l=>`<span class="tag">${esc(l)}</span>`).join("")}${onNow(r)?'<span class="nowChip"><i></i>ora</span>':""}<span class="grow">${r.comments?`${r.comments} comm. · `:""}${ageDays(r.created)}g</span></div>
          <div class="l2"><span>${esc(r.title)}</span>${issueMark(r)}</div></td>
        <td class="moveCol"><span class="movePill">${esc(r.assignees.join(", ")||(r.excluded==="with_pr"?"PR aperta":"nessuno"))}</span></td></tr>`;}).join("");
  }else{
    head.innerHTML=`<tr>${pickHead(list)}<th class="markCol"></th>${th("title","pull request")}${th("todo","prossima mossa",'class="moveCol"')}</tr>`;
    tb.innerHTML=list.map(r=>{
      const k=rk(r);
      return `<tr data-n="${r.n}" data-k="${esc(k)}" class="${r.state}${selected===k?" selected":""}${picked.has(k)?" picked":""}${onNow(r)?" working":""}">

      <td class="prTitle"><div class="l1">${repoChip(r)}<b class="num">#${r.n}</b>${closesLine(r)}<span class="check ${r.merge||"pending"}" title="merge ${esc(r.merge||"in arrivo")}">●</span>${r.skill?'<small class="dot" title="analisi disponibile">●</small>':""}${onNow(r)?'<span class="nowChip"><i></i>ora</span>':""}<span class="grow">${esc(r.author)} · ${ageDays(r.created)}g</span></div>
        <div class="l2"><span>${esc(r.title)}</span></div></td>

function renderBlocks(){
