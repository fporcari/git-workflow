<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git desk</title>
<style>
:root{color-scheme:light;
  --bg:#faf9f5;--head:#f0eee6;--bar:#e8e5db;--raised:#ffffff;--hover:#efece4;--sel:#e9e5da;--zebra:#f5f3ed;
  --line:#e2dfd5;--line2:#cfcbbf;--ink:#1f1e1d;--muted:#5f5d56;--faint:#7a776f;
  --accent:#b5573a;--onAccent:#ffffff;
  --green:#2d7a4c;--ok-bg:rgba(45,122,76,.11);--red:#b4432b;--att-bg:rgba(180,67,43,.10);
  --amber:#8a6410;--warn-bg:rgba(176,128,20,.12);--warn-line:rgba(176,128,20,.35);
  --blue:#3b5bb8;--dec-bg:rgba(59,91,184,.10);--wait-bg:rgba(95,93,86,.10);
  --shadow:0 12px 32px rgba(60,50,30,.18);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#262624;--head:#1d1c1b;--bar:#30302d;--raised:#2b2a28;--hover:#34332f;--sel:#3a3935;--zebra:#292927;
  --line:#3a3936;--line2:#4d4c47;--ink:#f3f1ea;--muted:#b4b1a7;--faint:#94918a;
  --accent:#d97757;--onAccent:#1d1c1b;
  --green:#7cc497;--ok-bg:rgba(124,196,151,.14);--red:#ec8a72;--att-bg:rgba(236,138,114,.14);
  --amber:#e9c46a;--warn-bg:rgba(233,196,106,.13);--warn-line:rgba(233,196,106,.35);
  --blue:#93a9ea;--dec-bg:rgba(147,169,234,.14);--wait-bg:rgba(180,177,167,.12);
  --shadow:0 12px 32px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#262624;--head:#1d1c1b;--bar:#30302d;--raised:#2b2a28;--hover:#34332f;--sel:#3a3935;--zebra:#292927;
  --line:#3a3936;--line2:#4d4c47;--ink:#f3f1ea;--muted:#b4b1a7;--faint:#94918a;
  --accent:#d97757;--onAccent:#1d1c1b;
  --green:#7cc497;--ok-bg:rgba(124,196,151,.14);--red:#ec8a72;--att-bg:rgba(236,138,114,.14);
  --amber:#e9c46a;--warn-bg:rgba(233,196,106,.13);--warn-line:rgba(233,196,106,.35);
  --blue:#93a9ea;--dec-bg:rgba(147,169,234,.14);--wait-bg:rgba(180,177,167,.12);
  --shadow:0 12px 32px rgba(0,0,0,.45)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.shell{height:100vh;display:flex;flex-direction:column;min-height:0}

/* the header: one row, the darkest band — where you are and what the desk is */
.topbar{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--head);border-bottom:1px solid var(--line)}
.brandMark{font:600 10px/24px var(--mono);width:24px;height:24px;border-radius:6px;text-align:center;background:var(--ink);color:var(--head);flex:none}
.scopeBtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:0;border-radius:6px;background:none;cursor:pointer;min-width:0;max-width:30vw;flex:0 3 auto}
.scopeBtn:hover{background:var(--hover)}
.scopeBtn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.scopeBtn span{color:var(--muted);white-space:nowrap;font-size:12px}
.scopeBtn::after{content:"▾";color:var(--faint);font-size:10px}
.scopeBtn[aria-expanded=true]{background:var(--hover)}
.grow{flex:1}

/* sections: a segmented control, so a tab never reads as a button */
.modeTabs{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--bar);flex:none}
.modeTabs button{border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;height:26px;padding:0 11px;font-size:12.5px;white-space:nowrap}
.modeTabs button:hover{color:var(--ink)}
.modeTabs button[aria-selected=true]{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.modeTabs b{font:500 11px var(--mono);color:var(--faint)}
.modeTabs b.hot{min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--onAccent);text-align:center}

.prepChip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--accent);white-space:nowrap;flex:none}
.prepChip i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;flex:none}
.chatState{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);white-space:nowrap}
.chatState::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}

/* buttons: raised, bordered, always look pressable */
.btn{border:1px solid var(--line2);border-radius:6px;background:var(--raised);padding:0 10px;height:28px;color:var(--ink);font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--accent)}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.ok:hover:not(:disabled){background:var(--ok-bg)}
.btn.no{border-color:var(--red);color:var(--red)}
.btn.no:hover:not(:disabled){background:var(--att-bg)}
.btn.copied,.btn.done{border-color:var(--green);color:var(--green);background:var(--ok-bg)}
.btn.working{border-color:var(--amber);color:var(--amber)}
.btn.locked{border-style:dashed;color:var(--amber);border-color:var(--amber);cursor:default;background:var(--warn-bg)}
.btn.icon{width:28px;padding:0;justify-content:center}
.btn.stop{border-color:var(--red);color:var(--red);font-weight:600}
.btn.stop:hover:not(:disabled){background:var(--att-bg)}
.btn.stop.armed{background:var(--red);border-color:var(--red);color:var(--onAccent)}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.sync.loading i{background:var(--amber);animation:pulse 1s infinite}
.sync.ko i{background:var(--red)}
.btn.sync.stale{border-color:var(--amber);color:var(--amber);background:var(--warn-bg)}
@keyframes pulse{50%{opacity:.25}}

.scopePop{position:absolute;top:46px;left:10px;right:10px;max-width:560px;z-index:30;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.scopePop h2{margin:0;padding:12px 14px 4px}
.scopeRow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 14px;cursor:pointer}
.scopeRow:hover{background:var(--hover)}
.scopeRow b{font:500 12.5px var(--mono)}
.scopeRow small{grid-column:2;color:var(--muted);font-size:12px}
.scopeRow small.bare{color:var(--amber)}
.scopeRow em{font:normal 11px var(--mono);color:var(--muted)}
.scopeFoot{padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:12px;line-height:1.45}

/* the toolbar: a band of its own colour — what you filter, what you launch */
.queueTools{min-height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--bar);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tabs{display:flex;gap:0;align-self:stretch;overflow-x:auto;min-width:0;flex:1}
.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:12.5px;padding:0 10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button.zero{opacity:.55}
.tabs b{font:500 11px var(--mono);color:var(--faint)}
.tabs .t-ok b{color:var(--green)}.tabs .t-no b{color:var(--red)}.tabs .t-q b{color:var(--amber)}
.tabs .sep{width:1px;background:var(--line2);margin:9px 4px;flex:none}
.tools{display:flex;gap:6px;align-items:center;padding:4px 0}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:6px;background:var(--raised);height:28px;padding:0 8px;color:var(--muted)}
.search input{width:120px;border:0;outline:0;background:transparent;font-size:12px}
.lead{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.lead b{color:var(--ink)}

.banner{display:none;flex:none;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px;align-items:center;gap:10px}
.banner.on{display:flex}
.banner.err{background:var(--att-bg);color:var(--red)}
.banner.warn{background:var(--warn-bg);color:var(--amber)}
.banner .btn{margin-left:auto}

/* the grid: rows separated by a rule and a stripe, so the eye keeps the line */
.tableWrap{overflow:auto;flex:1;min-height:0;background:var(--bg)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:middle}
th{position:sticky;top:0;z-index:2;background:var(--head);font:600 10px system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--line2)}
th .dir{color:var(--ink)}
tbody tr.row{cursor:pointer;outline:none}
tbody tr.row.alt td{background:var(--zebra)}
tbody tr.row:hover td{background:var(--hover)}
tbody tr.row.selected td{background:var(--sel)}
tbody tr.row.selected td:first-child{box-shadow:inset 3px 0 var(--accent)}
tbody tr.row.picked td{background:var(--dec-bg)}
tbody tr.row.working td:first-child{box-shadow:inset 3px 0 var(--blue);animation:needle 1.4s ease-in-out infinite}
@keyframes needle{50%{box-shadow:inset 3px 0 transparent}}
tbody tr.row.open td{border-bottom-color:transparent}
.nowChip{display:inline-flex;align-items:center;gap:5px;font:10.5px var(--mono);color:var(--blue);border:1px solid var(--blue);border-radius:9px;padding:0 6px;white-space:nowrap}
.nowChip i{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite;flex:none}
.pickCol{width:34px;text-align:center;padding-left:10px;padding-right:2px}
.pick{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid var(--line2);border-radius:3px;background:var(--raised);cursor:pointer;vertical-align:middle;position:relative;flex:none;margin:0}
.pick:hover{border-color:var(--muted)}
.pick:checked{background:var(--ink);border-color:var(--ink)}
.pick:checked::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid var(--raised);border-width:0 1.5px 1.5px 0;transform:rotate(40deg)}
.pick:indeterminate{background:var(--muted);border-color:var(--muted)}
.pick:indeterminate::after{content:"";position:absolute;left:2.5px;top:5.5px;width:7px;height:0;border-top:1.5px solid var(--raised)}
.markCol{width:30px;padding-left:2px;padding-right:2px}
.mark{text-align:center}
.mark span{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font:700 11px var(--mono);background:var(--wait-bg);color:var(--muted)}
tr.attention .mark span,tr.s-changes .mark span{background:var(--att-bg);color:var(--red)}
tr.decision .mark span{background:var(--dec-bg);color:var(--blue)}
tr.ready .mark span,tr.s-approve .mark span,tr.s-close .mark span,tr.s-claude .mark span{background:var(--ok-bg);color:var(--green)}
tr.untriaged .mark span,tr.s-doubt .mark span,tr.s-review .mark span{background:var(--warn-bg);color:var(--amber)}
.prTitle{min-width:0;overflow:hidden}
.l1{display:flex;align-items:center;gap:7px;min-width:0;font:12px var(--mono);color:var(--muted);white-space:nowrap}
.l1 .repoChip{color:var(--muted)}
.l1 .when{margin-left:auto}
.l2{display:flex;align-items:center;gap:8px;min-width:0;margin-top:2px}
.l2>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
tr.selected .l2>span{font-weight:600}
.prTitle b.num{font:600 12px var(--mono);color:var(--ink)}
.triageChip{border:1px solid var(--warn-line);border-radius:9px;padding:0 6px;color:var(--amber);font:10.5px var(--mono);white-space:nowrap}
.moveCol{text-align:right;width:290px}
.linkCol{width:44px;text-align:right;padding-right:10px}
.moveCell{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.movePill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;border:1px solid var(--line);font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis}
tr.attention .movePill,tr.s-changes .movePill{background:var(--att-bg);border-color:transparent;color:var(--red)}
tr.decision .movePill{background:var(--dec-bg);border-color:transparent;color:var(--blue)}
tr.ready .movePill,tr.s-approve .movePill,tr.s-close .movePill,tr.s-claude .movePill{background:var(--ok-bg);border-color:transparent;color:var(--green)}
tr.untriaged .movePill,tr.s-doubt .movePill,tr.s-review .movePill{background:var(--warn-bg);border-color:var(--warn-line);color:var(--amber)}
.ghBtn{width:26px;height:24px;padding:0;justify-content:center;font-size:12px}
@media(max-width:760px){.moveCol{width:150px}.moveCell .movePill{display:none}
  .l2>span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
.check{font-size:8px}
.check.CLEAN{color:var(--green)}.check.DIRTY,.check.BLOCKED{color:var(--red)}
.check.UNSTABLE{color:var(--amber)}.check.pending{color:var(--line2)}
.mono{font:11.5px var(--mono)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font:10.5px var(--mono);color:var(--muted);background:var(--hover)}
.tag.DEFECT{color:var(--red);border-color:transparent;background:var(--att-bg)}
.tag.REQUEST{color:var(--green);border-color:transparent;background:var(--ok-bg)}
.tag.QUESTION{color:var(--blue);border-color:transparent;background:var(--dec-bg)}
.dot{color:var(--accent);font-size:10px}
.empty{padding:26px;display:flex;flex-direction:column;align-items:center;color:var(--muted);gap:3px;text-align:center}
.empty b{color:var(--ink)}
.skel{padding:0}
.skel div{height:46px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--bg),var(--hover),var(--bg));background-size:200% 100%;animation:shimmer 1.1s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* a row opened in place: what it is, what Claude read, the keys that act */
tr.expand td{background:var(--raised);padding:4px 14px 14px 72px;border-bottom:1px solid var(--line2);cursor:default}
.xp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:6px 22px}
@media(max-width:900px){.xp{grid-template-columns:1fr}tr.expand td{padding-left:14px}}
.xp h2{margin:8px 0 3px}
.xp p{margin:0 0 6px;line-height:1.5}
.xp .say{border-left:3px solid var(--line2);padding:2px 0 2px 10px;margin:6px 0}
.xp .say.q{border-color:var(--amber)}.xp .say.no{border-color:var(--red)}.xp .say.ok{border-color:var(--green)}
.xp textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:7px 9px;font:12.5px/1.5 var(--mono)}
.xp .facts{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.xp .facts b{color:var(--ink);font-weight:500}
.xp ul{margin:2px 0 0;padding-left:17px;color:var(--muted);font-size:12px}
.xpActs{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:6px}
.xpActs .note{color:var(--muted);font-size:12px;margin-left:4px}
.actionText{border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:6px;padding:6px 9px;margin-top:6px;color:var(--amber);font-size:12px}
.actionText.go{color:var(--blue);background:var(--dec-bg);border-color:transparent}
.actionText.bad{color:var(--red);background:var(--att-bg);border-color:transparent}
.actionText.good{color:var(--green);background:var(--ok-bg);border-color:transparent}
.eyebrow,h2{font:600 10.5px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.chaseWrap{display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:12px;overflow:auto;flex:1;min-height:0;align-content:start}
.chaseWrap.on{display:grid}
.chaseCard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--raised)}
.chaseCard h2{text-transform:none;letter-spacing:0;font:600 13px system-ui,sans-serif;color:var(--ink);margin:0}
.chaseCount{font:11px var(--mono);color:var(--muted);font-weight:400}
.chaseCard pre{margin:6px 0 8px;white-space:pre-wrap;font:11.5px var(--mono);color:var(--muted)}
.chaseNote{grid-column:1/-1;color:var(--muted);font-size:12px}
.signal{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:12px}
.signal span{color:var(--muted);text-align:right}

.threadsWrap{display:none;flex-direction:column;overflow:auto;flex:1;min-height:0}
.threadsWrap.on{display:flex}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;border-bottom:1px solid var(--line);background:var(--bar)}
.person{display:flex;flex-direction:column;gap:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--raised);text-align:left;cursor:pointer}
.person:hover{border-color:var(--line2)}
.person.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.person.me{border-color:var(--accent)}
.person span{display:flex;align-items:center;gap:7px}
.person strong{flex:1;font-weight:600}
.person em{font:600 13px var(--mono);font-style:normal}
.person small{color:var(--muted);font-size:12px}
.thrHead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:var(--head);border-bottom:1px solid var(--line);font-size:12px}
.thrHead strong{font-weight:600}
.thrHead .hint{margin-left:auto;color:var(--muted)}
.thr{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.thrNode{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;cursor:pointer;width:100%}
.thrNode:hover{background:var(--hover)}
.thrNode.pr{margin-left:14px;width:calc(100% - 14px);border-color:var(--line)}
.thrNode.stub{cursor:default;color:var(--muted)}
.thrNode i{font-style:normal;color:var(--muted)}
.thrNode .ref{font:12px var(--mono)}
.thrNode .who{font-size:12px;color:var(--muted);white-space:nowrap}
.thrNode .title{grid-column:2/4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thrNone{margin-left:14px;padding:6px 8px;border:1px dashed var(--line2);border-radius:8px;color:var(--muted);font-size:12px}
.thrLinks{display:flex;flex-wrap:wrap;gap:4px 12px;padding-left:6px;font-size:12px;color:var(--muted)}
.thrLinks .warn{color:var(--amber)}
.thrMove{display:flex;align-items:center;gap:8px;padding-left:6px}
.thrMove strong{font-weight:600}

.pickBar{display:none;flex:none;padding:7px 10px;font-size:12px;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--bg)}
.pickBar.on{display:flex}
.pickBar b{font:600 12px var(--mono)}
.pickBar>span{opacity:.75}
.pickBar .right{margin-left:auto;display:flex;gap:6px}
.pickBar .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);box-shadow:none}
.pickBar .btn.primary{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.pickBar .kbd{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}

/* the log lives at the bottom: one line, opened on demand */
.statusBar{flex:none;height:28px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--head);border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-width:0}
.statusBar .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statusBar .msg b{color:var(--ink);font-weight:500}
.statusBar .spin{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite;flex:none}
.statusBar button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 4px;white-space:nowrap}
.statusBar button:hover{color:var(--ink)}
.drawer{flex:none;max-height:42vh;overflow:auto;background:var(--raised);border-top:1px solid var(--line2);display:flex;flex-direction:column}
.drawer>*{padding:8px 12px;border-bottom:1px solid var(--line)}
.drawer>*:empty{display:none}
.jobCard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);margin:0 0 6px}
.jobHead{display:flex;align-items:center;gap:8px;font-size:12px}.jobHead b{font:600 11.5px var(--mono)}
.jobHead .spin{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite;flex:none}
.jobHead .elapsed{margin-left:auto;color:var(--muted);font:11px var(--mono)}
.runReport{white-space:pre-wrap;margin:7px 0 0;max-height:320px;overflow:auto;font:11.5px/1.55 var(--mono)}
.jobRail{height:2px;background:var(--hover);overflow:hidden;margin:7px 0}.jobRail i{display:block;width:28%;height:100%;background:var(--blue);animation:travel 1.8s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(-100%)}100%{transform:translateX(460%)}}
.jobCurrent{font-size:12px}
.jobEvents{margin-top:6px;padding-top:5px;border-top:1px solid var(--line);font:11px/1.55 var(--mono);color:var(--muted);max-height:104px;overflow:auto}
.jobEvents div{display:flex;gap:8px}.jobEvents time{color:var(--blue);flex:none}.jobEvents span{overflow-wrap:anywhere}
.feed{font:11px var(--mono);color:var(--muted)}
.feed div{padding:1px 0}.feed b{color:var(--ink);margin-right:7px}
.notes{font-size:12px;color:var(--muted);line-height:1.5}
.testBox{font:12px var(--mono)}
.testBox .ok{color:var(--green)}.testBox .ko{color:var(--red)}.testBox .pending{color:var(--muted)}
.kbd{font:10.5px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--raised)}

.palette{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:52px 10px}
.palBox{width:100%;max-width:640px;background:var(--raised);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.palBox label{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--line)}
.palBox input{flex:1;min-width:0;border:0;outline:0;font-size:15px;background:none}
.palList{overflow:auto;padding:4px 0 8px}
.palGroup{padding:10px 14px 4px;font:600 10.5px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.palOpt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:42px;width:calc(100% - 12px);margin:0 6px;padding:5px 10px;border:0;border-radius:7px;background:none;text-align:left;cursor:pointer}
.palOpt.on,.palOpt:hover{background:var(--hover)}
.palOpt i{font:normal 13px var(--mono);color:var(--muted);text-align:center}
.palOpt small{display:block;color:var(--muted);font-size:12px}
.palOpt em{font:normal 11px var(--mono);color:var(--muted)}
.palFoot{display:flex;gap:14px;height:32px;align-items:center;padding:0 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--bg)}
@media(max-width:1000px){.tabs{flex:1 1 100%;min-height:36px;flex-wrap:wrap;overflow-x:visible}
  .tabs button{min-height:32px}.tabs .sep{display:none}.tools{margin-left:auto}}
@media(max-width:720px){.modeTabs button{padding:0 7px}.scopeBtn span{display:none}#btnTest{display:none}
  .chatState{font-size:0;gap:0}#syncLabel{display:none}.btn.sync{width:28px;padding:0;justify-content:center}
  .btn.stop:not(.armed) .lbl{display:none}.btn.stop{padding:0 9px}
  .topbar:has(.btn.stop.armed) #btnPalette,.topbar:has(.btn.stop.armed) #btnTheme{display:none}}
@media(max-width:600px){.modeTabs b:not(.hot){display:none}#btnTheme{display:none}}
</style>
</head>
<body>
<main class="shell" id="shell">
  <header class="topbar">
    <span class="brandMark">GW</span>
    <button class="scopeBtn" id="scopeBtn" aria-expanded="false" title="Cosa guarda il desk: i repo dello scope, e quali hanno un clone locale"><b id="scopeName">…</b><span id="scopeCount"></span></button>
    <nav class="modeTabs" id="modeTabs" role="tablist" aria-label="Sezioni"></nav>
    <span class="grow"></span>
    <span id="chatState" class="chatState" hidden title="Una chat è collegata al desk: i bottoni vengono eseguiti nella conversazione, e lì presentano l'esito.">chat collegata</span>
    <button class="btn sync" id="btnFetch" title="Rilegge il provider ignorando la cache"><i></i><span id="syncLabel">avvio…</span></button>
    <button class="btn icon" id="btnPalette" title="Comandi (⌘K)" aria-label="Comandi">⌘K</button>
    <button class="btn icon" id="btnTheme" title="Tema chiaro o scuro" aria-label="Tema">◐</button>
    <button class="btn icon" id="btnTest" title="Verifica desk, file JSON e agente on-demand" aria-label="Modalità test">✓?</button>
    <button class="btn stop" id="btnStop" title="Ferma il server di questo desk: la pagina si spegne, i dati restano" aria-label="Chiudi il desk">⏻<span class="lbl"> Chiudi il desk</span></button>
  </header>
  <div class="scopePop" id="scopePop" hidden></div>

  <section class="queueTools">
    <div class="tabs" id="tabs" role="tablist" aria-label="Filtri"></div>
    <div class="tools">
      <button class="btn" id="btnTriage"></button>
      <button class="btn primary" id="btnRun"></button>
      <label class="search"><span>⌕</span><input id="q" placeholder="Filtra…" aria-label="Filtra numero, titolo, autore, repo"></label>
    </div>
  </section>
  <div class="lead" id="lead"></div>
  <div class="banner err" id="errBox"></div>
  <div class="banner warn" id="prepBox"></div>

  <div class="tableWrap" id="tableWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    <div class="empty" id="empty" style="display:none"></div></div>
  <div class="chaseWrap" id="chaseWrap"></div>
  <div class="threadsWrap" id="threadsWrap"></div>

  <div class="pickBar" id="pickBar"></div>
  <div class="drawer" id="drawer" hidden>
    <div id="jobPanel"></div>
    <div class="notes" id="noteBox"></div>
    <div class="testBox" id="testBox"></div>
    <div class="feed" id="feedBox"></div>
  </div>
  <footer class="statusBar" id="statusBar">
    <span class="prepChip" id="prepChip" hidden></span>
    <span class="msg" id="statusMsg"></span>
    <button id="btnLog" aria-expanded="false" title="Log, lavori in corso e note del desk">log ▴</button>
  </footer>
  <div class="palette" id="palette" hidden>
    <div class="palBox" role="dialog" aria-label="Comandi">
      <label><span aria-hidden="true">⌕</span><input id="palInput" placeholder="Cerca un comando, una vista, una persona…" aria-label="Comando"></label>
      <div class="palList" id="palList"></div>
      <div class="palFoot"><span>↑↓ scegli</span><span>↵ esegui</span><span style="margin-left:auto">esc chiudi</span></div>
    </div>
  </div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* states that are not in "Da fare": somebody else's move, or only a comment due */
const MARK={ready:"✓",attention:"!",waiting:"○",decision:"◆",reply:"✎",untriaged:"?"};
const STATE_LABEL={ready:"mergeable",attention:"mossa tua",waiting:"in attesa",decision:"decisione tua",reply:"da rispondere",untriaged:"senza verdetto"};
const STANCE={approve:{mark:"✓",pill:"approvabile"},changes:{mark:"✕",pill:"da respingere"},
  doubt:{mark:"?",pill:"dubbia"},review:{mark:"○",pill:"da rivedere"},
  close:{mark:"✓",pill:"da chiudere"},claude:{mark:"✓",pill:"per Claude"}};
const BACKGROUND="X-Git-Workflow-Background";

let meta={},writeToken="",DESK="pr",deskKind=null,prs=[],issues=[],issueOthers=[],chase={},replies={},shortlist=null,session=null;
let threads={groups:[],people:{},total:0},scope={name:"",members:[]},labels={},multi=false;
let hiddenRepos=new Set(),personFilter=null;
let loaded=false,view=null,query="",agentReady=true;
let issuesTruncated=null,issuesWithPr=0,issuesTaken=0,triageComplete=false,ranked=false;
let selected=null,openRow=null,sort={key:"created",dir:-1},acting={},truncated=null,pendingMerge=false;
/* where every row stands, from the server's stances: key → the card it sent */
let stances={},waitingAuthor=0,prepare={},skippedPrs=new Set();
let drafts={};
const POLL=30000,STALE_PAINT=70;   // a paint older than two polls is behind
let deskEtag=null,fetching=false,lastGenerated=null,lastPaintAt=null,timings={};
let staleRetry=null;
let triageStamp=null;   // when the published triage changes, repaint the rows
let providerRefresh=null; // a completed provider mutation forces one fresh read
let flows={};
let jobRecords={},runs={},runOpen=true,runHidden=null,feed=[];
let pendingClicks={},pendingTick=null;
let agentPoll=null,agentBusy=false;
let workingOn=null,workings=[];
let picked=new Set();   // the rows chosen by hand, by key
let lastPick=null;      // anchor for a shift-click range, as in a mail client
/* A row is a repository's PR or issue: `owner/repo#n` is its name, a bare
   number is not one once a desk covers several repositories. */
const rk=r=>r?`${r.repo||""}#${r.n}`:null;
const refOf=r=>r.label||`#${r.n}`;
const onNow=r=>workings.some(w=>(!w.repo||w.repo===r.repo)&&(w.ns||[w.n]).includes(r.n));
const stanceOf=r=>stances[(DESK==="issue"?"i":"p")+rk(r)]||null;

/* ---------- helpers ---------- */
function ageDays(d){return Math.max(0,Math.round((Date.now()-new Date(d))/864e5));}
async function copyText(btn,text){
  try{await navigator.clipboard.writeText(text);}
  catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}
  flash(btn,"copiato ✓","copied");
}
function flash(btn,label,cls){
  if(!btn)return;const old=btn.textContent;btn.textContent=label;btn.classList.add(cls);
  setTimeout(()=>{btn.textContent=old;btn.classList.remove(cls);},1500);
}
function banner(id,html,on){const b=$(id);b.innerHTML=html||"";b.classList.toggle("on",!!on&&!!html);}
function localFeed(msg){
  feed.push({at:new Date().toTimeString().slice(0,8),msg});
  renderStatus();
}
/* a poll the user is not looking at is not a use: the desk may close when idle */
function pollHeaders(etag){
  const h={};
  if(etag)h["If-None-Match"]=etag;
  if(typeof document!=="undefined"&&document.hidden)h[BACKGROUND]="1";
  return h;
}
const repoLabel=repo=>labels[repo]||String(repo||"").split("/").pop();
const STAGE_LABEL={queued:"in coda",starting:"avvio",working:"al lavoro",
  inspecting:"lettura",testing:"verifica",waiting:"in attesa",
  finalizing:"chiusura",done:"completato","needs-input":"serve una decisione",error:"errore"};
function jobUiKey(job){
  const req=job.request||{},flow=req.flow;
  if(flow&&flow!=="order")return "flow:"+flow;
  if(req.n!==undefined)return (job.kind==="issue-analyze"?"i":"p")+`${req.repo||""}#${req.n}`;
  return "job:"+job.id;
}
function rememberJob(job){
  if(!job||!job.id)return;
  jobRecords[job.id]=job;
  const key=jobUiKey(job);
  if(key.startsWith("flow:"))flows[key.slice(5)]=job;
  else acting[key]=job;
}
function forgetJob(job,key){
  if(job&&job.id)delete jobRecords[job.id];
  if(key&&key.startsWith("flow:"))delete flows[key.slice(5)];
  else if(key)delete acting[key];
}
/* Between the press and the server's 202 there are seconds of provider work.
   With nothing drawn the desk looks like it ignored the click, and the user
   presses again. */
function startPending(key,title){
  pendingClicks[key]={title,at:Date.now()};
  if(!pendingTick)pendingTick=setInterval(renderJobs,1000);
  render();
}
function endPending(key){
  delete pendingClicks[key];
  if(!Object.keys(pendingClicks).length&&pendingTick){
    clearInterval(pendingTick);pendingTick=null;
  }
  renderJobs();
}
const clock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function pendingCard(entry){
  return `<div class="jobCard"><div class="jobHead"><span class="spin"></span>
    <b>${esc(entry.title)}</b><span>${esc(STAGE_LABEL.queued)}</span>
    <span class="elapsed">${esc(clock(Math.floor((Date.now()-entry.at)/1000)))}</span></div>
    <div class="jobRail"><i></i></div>
    <div class="jobCurrent">richiesta inviata al desk — legge il provider e avvia il processo</div></div>`;
}
function jobTitle(job){
  const req=job.request||{},where=multi&&req.repo?repoLabel(req.repo)+" ":"";
  if(req.flow)return req.flow+(req.ns&&req.ns.length?" · "+where+req.ns.map(n=>"#"+n).join(" "):req.n?" · "+where+"#"+req.n:"");
  return (job.kind||"job")+(req.n?" · "+where+"#"+req.n:"");
}
function lastRun(){
  const rows=Object.entries(runs||{}).filter(([,r])=>r&&r.report);
  if(!rows.length)return null;
  rows.sort((a,b)=>String(a[1].at||"").localeCompare(String(b[1].at||"")));
  const [key,run]=rows[rows.length-1],stamp=key+"@"+(run.at||"");
  return stamp===runHidden?null:{key,run,stamp};
}
const runTime=run=>String(run.at||"").slice(-8);
function runCard(last){
  const {key,run}=last;
  return `<div class="jobCard reportCard"><div class="jobHead">
    <b>${esc(key)}</b><span>${esc(STAGE_LABEL[run.status]||run.status||"")}</span>
    <span class="elapsed">${esc(runTime(run))}</span>
    <button class="btn sm" data-run-toggle>${runOpen?"nascondi":"leggi"}</button>
    <button class="btn sm" data-run-close>✕</button></div>
    ${runOpen?`<pre class="runReport">${esc(run.report||"")}</pre>`:""}</div>`;
}
function liveJobs(){return Object.values(jobRecords).filter(j=>j.status==="running");}
function renderJobs(){
  const box=$("jobPanel"),jobs=liveJobs();
  const waiting=Object.values(pendingClicks);
  const last=lastRun();
  // what is happening NOW first: a report card on top would push the live
  // progress under the fold
  box.innerHTML=waiting.map(pendingCard).join("")+jobs.map(job=>{
    const p=job.progress||{},events=(job.events||[]).slice(-7);
    return `<div class="jobCard"><div class="jobHead"><span class="spin"></span>
      <b>${esc(jobTitle(job))}</b><span>${esc(STAGE_LABEL[p.stage]||p.stage||"al lavoro")}</span>
      <span class="elapsed">${esc(clock(p.elapsed||0))} · ${esc(job.agent||"")}</span></div>
      <div class="jobRail"><i></i></div><div class="jobCurrent">${esc(p.detail||"processo avviato")}</div>
      ${events.length?`<div class="jobEvents">${events.map(e=>`<div><time>${esc(e.at||"")}</time><span>${esc(e.detail||e.stage||"")}</span></div>`).join("")}</div>`:""}</div>`;
  }).join("")+(last?runCard(last):"");
  const toggle=box.querySelector("[data-run-toggle]");
  if(toggle)toggle.onclick=()=>{runOpen=!runOpen;renderJobs();};
  const close=box.querySelector("[data-run-close]");
  if(close)close.onclick=()=>{runHidden=(last||{}).stamp;runOpen=true;renderJobs();};
  renderStatus();
}
/* The bottom line says what moves now, or the last thing that happened. */
function renderStatus(){
  const jobs=liveJobs(),waiting=Object.values(pendingClicks);
  let html;
  if(waiting.length)html=`<span class="spin"></span> <b>${esc(waiting[0].title)}</b> · richiesta inviata`;
  else if(jobs.length){const p=jobs[0].progress||{};
    html=`<b>${esc(jobTitle(jobs[0]))}</b> · ${esc(STAGE_LABEL[p.stage]||"al lavoro")} ${esc(clock(p.elapsed||0))}${jobs.length>1?` · +${jobs.length-1}`:""}`;}
  else if(workings.length){const w=workings[0],ns=w.ns||[w.n];
    html=`<b>${esc(multi&&w.repo?repoLabel(w.repo)+" ":"")}${ns.map(n=>"#"+n).join(" ")}</b> · ${esc(w.msg||"in lavorazione")}${w.at?" · dalle "+esc(w.at):""}`;}
  else if(agentBusy)html="<b>agente one-shot in esecuzione</b> · il desk continua a servire i dati";
  else if(feed.length){const f=feed[feed.length-1];
    html=`<b>${esc(f.at)}</b> ${f.pr?`${esc(multi&&f.repo?repoLabel(f.repo)+" ":"")}#${f.pr} `:""}${esc(f.msg)}`;}
  else html="nessuna attività";
  const busy=jobs.length||waiting.length||workings.length||agentBusy;
  $("statusMsg").innerHTML=(busy&&!waiting.length?'<span class="spin" style="display:inline-block;margin-right:6px"></span>':"")+html;
  $("feedBox").innerHTML=feed.slice(-12).reverse().map(f=>`<div><b>${esc(f.at)}</b>${f.pr?`<b>${multi&&f.repo?esc(repoLabel(f.repo))+" ":""}#${f.pr}</b> `:""}${esc(f.msg)}</div>`).join("");
}
function toggleDrawer(open){
  const d=$("drawer");d.hidden=open===undefined?!d.hidden:!open;
  $("btnLog").setAttribute("aria-expanded",String(!d.hidden));
  $("btnLog").textContent=d.hidden?"log ▴":"log ▾";
}

/* ---------- data ---------- */
async function loadDesk(refetch){
  fetching=true;renderSync();
  try{
    const resp=refetch
      ? await fetch("/api/fetch",{method:"POST",headers:{"X-Git-Workflow-Token":writeToken}})
      : await fetch("/api/desk",{headers:pollHeaders(deskEtag)});
    // a 304 is the server confirming THIS paint is still the truth, which is
    // what the age measures
    if(resp.status===304){lastPaintAt=Date.now();fetching=false;renderSync();return;}
    if(!refetch)deskEtag=resp.headers.get("ETag");
    const d=await resp.json();
    if(d.error)throw new Error(d.error);
    applyDesk(d);
    banner("errBox","",false);
  }catch(e){
    banner("errBox",`<b>Provider:</b> ${esc(e.message)}`,true);
  }
  fetching=false;render();
  const stale=Object.values(timings).some(t=>t&&t.source==="stale");
  if(stale&&!staleRetry){
    staleRetry=setTimeout(()=>{staleRetry=null;loadDesk(false);},7000);
  }else if(!stale&&staleRetry){
    clearTimeout(staleRetry);staleRetry=null;
  }
}
function applyStances(st){
  stances={};waitingAuthor=0;skippedPrs=new Set();
  if(!st)return;
  const review=st.review||{},issue=st.issue||{};
  for(const step of review.steps||[])
    for(const c of step.rows||[])if(step.id!=="done")stances["p"+rk(c)]=Object.assign({step:step.id},c);
  for(const step of issue.steps||[])
    for(const c of step.rows||[])if(step.id==="close"||step.id==="claude")stances["i"+rk(c)]=Object.assign({step:step.id},c);
  waitingAuthor=review.waiting_author||0;
  for(const c of review.skipped||[])skippedPrs.add(rk(c));
  if(st.prepare)prepare=st.prepare;
}
function applyDesk(d){
  meta=d.meta||meta;writeToken=meta.write_token||writeToken;timings=d.timings||{};
  // the server's kind opens the page on its section; after that the choice is his
  if(meta.desk!==deskKind){deskKind=meta.desk;DESK=meta.desk||"pr";}
  scope=meta.scope||{name:meta.repo,members:[{repo:meta.repo,clone:true}]};
  multi=(scope.members||[]).length>1;
  labels=Object.fromEntries((scope.members||[]).map(m=>[m.repo,m.label||String(m.repo).split("/").pop()]));
  agentReady=meta.detached!==false;
  prs=d.queue.rows;issues=d.issues.rows;issueOthers=d.issues.others||[];
  chase=d.queue.chase||{};replies=d.queue.replies||{};
  threads=d.threads||threads;
  session=d.queue.session;lastGenerated=d.generated;lastPaintAt=Date.now();
  truncated=d.queue.truncated?d.queue.total:null;
  issuesTruncated=d.issues.truncated?d.issues.total:null;issuesWithPr=d.issues.excluded_with_pr||0;issuesTaken=d.issues.excluded_taken||0;
  triageComplete=!!d.queue.triage_complete;
  ranked=!!d.issues.ranked;
  shortlist=d.issues.shortlist||null;
  flows=d.state&&d.state.flows||flows;
  pendingMerge=!!d.queue.mergestate_pending;
  applyStances(d.stances);
  // these rows are already reconciled against this stamp: record it before
  // applyState, or the poll would ask for the paint it just did
  triageStamp=(d.state&&d.state.triage&&d.state.triage.generated)||null;
  providerRefresh=(d.state&&d.state.provider_refresh&&d.state.provider_refresh.token)||null;
  applyState(d.state);
  loaded=true;
  if(!view||!VIEWS().some(v=>v.id===view))view=firstView();
  if(!selectedRow())selectFirst();
}
function applyState(st){
  if(!st)return;
  const stamp=(st.triage&&st.triage.generated)||null;
  if(stamp!==triageStamp){
    triageStamp=stamp;
    if(loaded)loadDesk(false);
  }
  const refresh=(st.provider_refresh&&st.provider_refresh.token)||null;
  if(refresh!==providerRefresh){
    providerRefresh=refresh;
    if(loaded&&refresh)loadDesk(true);
  }
  // a preparation that moves lands rows: repaint them
  const was=JSON.stringify(((prepare||{}).pr||{}).landed||[])+((prepare||{}).pr||{}).status;
  if(st.prepare)prepare=st.prepare;
  const now=JSON.stringify(((prepare||{}).pr||{}).landed||[])+((prepare||{}).pr||{}).status;
  if(loaded&&was!==now)loadDesk(false);
  session=st.session||session;
  if(DESK==="issue"&&Object.keys(st.chase||{}).length)chase=st.chase;
  const chat=st.chat||{};
  const chip=$("chatState");
  if(chip)chip.hidden=!chat.attached;
  const agent=st.agent||{};
  agentBusy=!!agent.busy;

      +(open?`<tr class="expand" data-xk="${esc(k)}"><td colspan="4">${isIssue?issueOpen(r):prOpen(r)}</td></tr>`:"");

  head.querySelectorAll("[data-sort]").forEach(el=>el.onclick=()=>setSort(el.dataset.sort));
  tb.querySelectorAll("tr.row[data-k]").forEach(tr=>tr.onclick=ev=>rowClick(tr.dataset.k,ev));
  tb.querySelectorAll("[data-quick]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();const r=rowByKey(b.dataset.k);if(!r)return;

  wireOpen();

function requests(r){return r.requests||{};}

function actBadge(r){

      out.push(`<div class="actionText">📨 <b>${esc(name)}</b>: il desk legge il provider per la chat collegata (dalle ${esc(q.at)}).</div>`);
    else if(q.status==="queued")

    else if(q.status==="needs-input")
      out.push(`<div class="actionText">⚠ <b>${esc(name)}</b>: serve una decisione${q.report?`: ${esc(q.report)}`:""}</div>`);
    else if(q.status==="failed")
      out.push(`<div class="actionText bad">✗ <b>${esc(name)}</b> non riuscita${q.closed_at?" alle "+esc(q.closed_at):""}${q.report?`: ${esc(q.report)}`:""}</div>`);
    else if(q.status==="stale")

const draftOf=(r,fallback)=>{const k=rk(r);return k in drafts?drafts[k]:(fallback||"");};

function prKeys(r,s){

function wireOpen(){

}

    personFilter=personFilter===b.dataset.person?null:b.dataset.person;render();});
  wrap.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>goTo(b.dataset.goto,b.dataset.k));
  wrap.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(b,b.dataset.copy));
}

/* ---------- actions: the button does the thing ---------- */
async function post(path,body){
  const resp=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json",
                              "X-Git-Workflow-Token":writeToken},
                              body:JSON.stringify(body||{})});
  const d=await resp.json().catch(()=>({}));
  if(d.error)throw new Error(d.error);
  return d;
}
async function waitJob(jobId,key,label){
  acting[key]={status:"running",job:jobId};render();
  for(;;){
    await new Promise(resolve=>setTimeout(resolve,1000));
    const job=await fetch(`/api/job/${jobId}`).then(resp=>resp.json());
    rememberJob(job);render();
    if(job.status==="running")continue;
    if(job.status==="error"||job.status==="failed")
      throw new Error(job.error||(job.result&&job.result.report)||`${label} fallito`);
    forgetJob(job,key);
    const report=job.result&&job.result.report;
    localFeed(`${label}: ${job.status==="needs-input"?"serve una decisione — ":""}${report||"completato"}`);
    await loadDesk(!!(job.result&&job.result.provider_changed));
    return job;
  }
}
async function handOver(r,btn,path,body,kind,note){
  const key=actKey(r);
  btn.disabled=true;btn.classList.add("working");
  startPending(key,`${note} · ${refOf(r)}`);
  try{
    const d=await post(path,Object.assign({repo:r.repo},body));
    endPending(key);
    if(d.order)r.order=d.order;
    if(d.via==="chat"){
      localFeed(`${note} su ${refOf(r)}: in coda alla chat collegata — l'esito arriva in conversazione`);
      btn.disabled=false;btn.classList.remove("working");
      await loadDesk(false);return;
    }
    if(!d.job)throw new Error("il server non ha creato il job");
    localFeed(`${note} su ${refOf(r)}: agente one-shot avviato`);
    await waitJob(d.job,key,note);
  }catch(e){endPending(key);acting[key]={status:"error",error:e.message};}
  render();
}
const doOrder=(r,btn,draft)=>handOver(r,btn,`/api/pr/${r.n}/order`,
  {propose:r.todo,draft:draft||(r.skill&&r.skill.draft)||null},"order","ordine");
const doExplain=(r,btn)=>handOver(r,btn,`/api/pr/${r.n}/explain`,{},"explain","spiegazione");
/* A review and a closing are public: the server sends them to the attached
   chat, which runs them with the command in view, and refuses without one. */
const REVIEW_WORD={approve:"approva",changes:"chiedi modifiche",skip:"salta a domani"};
async function sendReview(event,list,btn){
  const items=list.map(r=>{const s=stanceOf(r)||{};
    return {repo:r.repo,n:r.n,head:s.head||r.head,body:event==="skip"?"":draftOf(r,s.draft||(r.advice||{}).draft)};});
  if(btn){btn.disabled=true;btn.classList.add("working");}
  try{
    await post("/api/review",{event,items});
    localFeed(`${REVIEW_WORD[event]} ${list.map(refOf).join(" ")}${event==="skip"?"":": in coda alla chat collegata"}`);
    list.forEach(r=>{picked.delete(rk(r));});
    if(event==="skip")openRow=null;
    await loadDesk(false);
  }catch(e){
    banner("errBox",`<b>${esc(REVIEW_WORD[event])}:</b> ${esc(e.message)}`,true);
    if(btn){btn.disabled=false;btn.classList.remove("working");}
  }
}
async function sendClose(list,btn){
  const items=list.map(r=>{const s=stanceOf(r)||{};return {repo:r.repo,n:r.n,body:draftOf(r,s.body)};});
  if(btn){btn.disabled=true;btn.classList.add("working");}
  try{
    await post("/api/close",{items});
    localFeed(`chiudi ${list.map(refOf).join(" ")}: in coda alla chat collegata`);
    list.forEach(r=>picked.delete(rk(r)));
    await loadDesk(false);
  }catch(e){
    banner("errBox",`<b>chiusura:</b> ${esc(e.message)}`,true);
    if(btn){btn.disabled=false;btn.classList.remove("working");}
  }
}
async function doFlow(path,flow,note,extra){
  const key="flow:"+flow;
  flows[flow]={status:"queued"};       // the button says so before the 202
  startPending(key,flow);
  try{
    const d=await post(path,Object.assign({flow},extra||{}));
    endPending(key);
    const parts=d.runs||[d];
    const queued=parts.filter(p=>p.via==="chat");
    if(queued.length===parts.length){
      flows[flow]={status:"queued",via:"chat"};
      localFeed(`${flow}: in coda alla chat collegata — l'esito arriva in conversazione`);
      render();return;
    }
    const ids=(d.jobs||parts.map(p=>p.job)).filter(Boolean);
    if(!ids.length)throw new Error("il server non ha creato il job");
    flows[flow]={status:"running",job:ids[0]};
    localFeed(note+(ids.length>1?` — ${ids.length} job, uno per repo`:""));
    render();
    await Promise.all(ids.map((id,i)=>waitJob(id,i?`${key}:${i}`:key,flow)));
    delete flows[flow];
  }catch(e){endPending(key);delete flows[flow];banner("errBox",esc(e.message),true);}
  render();
}
/* Chosen rows mean: exactly these, in this order, and then stop — one loop
   per repository, each in its own clone. */
function runPicked(flow,batch){
  const items=[...picked].map(rowByKey).filter(Boolean).map(r=>({repo:r.repo,n:r.n}));
  const repos=[...new Set(items.map(i=>i.repo))];
  doFlow("/api/run",flow,
    `${flow} avviato su ${pickedLabels().join(" ")}${batch>1?" — in background, poi un digest delle proposte":""}`,
    repos.length>1?{items,batch}:{repo:repos[0],ns:items.map(i=>i.n),batch});
  picked.clear();
}
const doTriage=()=>doFlow("/api/triage",DESK==="issue"?"issue-triage":"pr-triage",
  "provider riletto e triage pubblicato — agente avviato solo per il giudizio ancora dovuto");
const doRun=()=>{
  const flow=DESK==="issue"?"issue-loop":"pr-loop";
  if(picked.size)return runPicked(flow,picked.size);
  doFlow("/api/run",flow,"run one-shot avviato",{repo:(scope.members[0]||{}).repo});
};

/* ---------- scope ---------- */
function renderScope(){
  const members=scope.members||[];
  $("scopeName").textContent=scope.name||meta.repo||"…";
  const hidden=members.filter(m=>hiddenRepos.has(m.repo)).length;
  $("scopeCount").textContent=multi?`${members.length} repo${hidden?` · ${hidden} nascosti`:""}`:(meta.me?"@"+meta.me:"");
  const pop=$("scopePop");
  if(pop.hidden)return;
  pop.innerHTML=`<h2>Cosa guarda il desk</h2>
    ${members.map(m=>`<label class="scopeRow">
      <input type="checkbox" class="pick" data-scope="${esc(m.repo)}" ${hiddenRepos.has(m.repo)?"":"checked"} ${multi?"":"disabled"}>
      <b>${esc(m.repo)}</b><em>${esc(m.provider||"")}</em>
      <small class="${m.clone?"":"bare"}">${m.clone?"clone in "+esc(m.cwd||"cartella di lancio"):"nessun clone locale · solo lettura"}</small></label>`).join("")}
    <div class="scopeFoot">${multi
      ?"Togliere la spunta nasconde un repo da questa pagina, senza cambiare lo scope. Senza clone il repo si legge; pr-loop e merge restano spenti."
      :"Un repo solo. Per una org intera rilancia il desk con <code>--org &lt;owner&gt;</code>, o dalla cartella che contiene i clone."}</div>`;
  pop.querySelectorAll("[data-scope]").forEach(box=>box.onclick=ev=>{
    ev.stopPropagation();
    box.checked?hiddenRepos.delete(box.dataset.scope):hiddenRepos.add(box.dataset.scope);
    if(!selectedRow()||!shown(selectedRow()))selectFirst();
    render();});
}
function toggleScope(open){
  const pop=$("scopePop"),btn=$("scopeBtn");
  pop.hidden=open===undefined?!pop.hidden:!open;
  btn.setAttribute("aria-expanded",String(!pop.hidden));
  renderScope();
}

/* ---------- ⌘K: every action of the page, one keystroke away ---------- */
let palIdx=0,palItems=[];
function commands(){
  const out=[],r=DESK==="threads"?null:selectedRow();
  const add=(group,icon,label,sub,run,key)=>out.push({group,icon,label,sub:sub||"",run,key:key||""});
  if(picked.size){
    const flow=DESK==="issue"?"issue-loop":"pr-loop",chaseText=chaseForPicked(),bulk=bulkAction();
    if(bulk)add(`Sulle ${picked.size} scelte`,"✓",bulk.label,bulk.tip,()=>bulk.run(null),"⏎");
    if(chaseText)add(`Sulle ${picked.size} scelte`,"@","Copia un sollecito unico","un messaggio per persona, le tue PR ferme su di loro",()=>copyText(null,chaseText),"s");
    add(`Sulle ${picked.size} scelte`,"▶",flow,picked.size>1?"in background, poi un digest delle proposte":"si ferma alla prima decisione che serve",()=>runPicked(flow,picked.size),"l");
    add(`Sulle ${picked.size} scelte`,"✕","Svuota la scelta","",clearPicks,"esc");
  }
  if(r){
    const where=refOf(r),s=stanceOf(r);
    add(`Riga ${where}`,"↕",openRow===rk(r)?"Chiudi la riga":"Apri la riga","",()=>toggleOpen(r),"⏎");
    if(s&&DESK==="pr"&&["approve","changes","doubt"].includes(s.step)&&!s.sent&&!s.sending){
      add(`Riga ${where}`,"✓","Approva","dalla chat collegata",()=>sendReview("approve",[r],null),"a");
      add(`Riga ${where}`,"✕","Chiedi modifiche","con la motivazione della riga",()=>sendReview("changes",[r],null),"r");
      add(`Riga ${where}`,"→","Salta a domani","",()=>sendReview("skip",[r],null));
    }
    if(s&&DESK==="issue"&&s.step==="close"&&!s.sent&&!s.sending)add(`Riga ${where}`,"✓","Chiudi la issue","dalla chat collegata",()=>sendClose([r],null));
    add(`Riga ${where}`,picked.has(rk(r))?"☐":"☑",picked.has(rk(r))?"Togli dalla scelta":"Aggiungi alla scelta","",()=>togglePick(r),"x");
    if(r.url)add(`Riga ${where}`,"↗",`Apri su ${hostName()}`,r.url,()=>window.open&&window.open(r.url,"_blank"),"o");
  }
  for(const [id,label] of [["pr","Pull request"],["issue","Issue"],["threads","A chi tocca"]])
    add("Vai a",id==="threads"?"⌁":id==="pr"?"⇄":"◯",label,id==="threads"?"issue ↔ PR, per persona":"",()=>setMode(id),{pr:"g p",issue:"g i",threads:"g t"}[id]);
  for(const v of VIEWS())if(!v.sep)add("Vai a","·",`${DESK==="issue"?"Issue":"PR"} › ${v.label}`,`${viewCount(v.id)}`,()=>setView(v.id));
  for(const [who,text] of Object.entries(chase))
    add("Chase","@",`Copia il sollecito per @${who}`,text.split("\n")[0],()=>copyText(null,text));
  add("Desk","↻",DESK==="issue"?"Ordina la shortlist":"pr-triage","",doTriage);
  add("Desk","⟳","Rileggi il provider","",()=>loadDesk(true));
  add("Desk","◐","Cambia tema","",toggleTheme);
  add("Desk","≡","Mostra il log","",()=>toggleDrawer(true));
  if(multi)for(const m of scope.members)
    add("Scope",hiddenRepos.has(m.repo)?"☐":"☑",`${hiddenRepos.has(m.repo)?"Mostra":"Nascondi"} ${m.repo}`,m.clone?"":"nessun clone locale",
        ()=>{hiddenRepos.has(m.repo)?hiddenRepos.delete(m.repo):hiddenRepos.add(m.repo);render();});
  add("Scope","⌂","Cosa guarda il desk","i repo dello scope e i loro clone",()=>toggleScope(true));
  return out;
}
function renderPalette(){
  const q=$("palInput").value.trim().toLowerCase();
  palItems=commands().filter(c=>!q||[c.group,c.label,c.sub].join(" ").toLowerCase().includes(q));
  palIdx=Math.max(0,Math.min(palIdx,palItems.length-1));
  let last=null;
  $("palList").innerHTML=palItems.map((c,i)=>{
    const head=c.group!==last?`<div class="palGroup">${esc(c.group)}</div>`:"";last=c.group;
    return `${head}<button class="palOpt${i===palIdx?" on":""}" data-i="${i}"><i>${esc(c.icon)}</i>
      <span>${esc(c.label)}${c.sub?`<small>${esc(c.sub)}</small>`:""}</span><em>${esc(c.key)}</em></button>`;}).join("")
    ||`<div class="empty"><b>Nessun comando</b><span>Prova un'altra parola.</span></div>`;
  $("palList").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>runCommand(+b.dataset.i));
}
function openPalette(){
  $("palette").hidden=false;$("palInput").value="";palIdx=0;renderPalette();$("palInput").focus();
}
function closePalette(){$("palette").hidden=true;}
function runCommand(i){const c=palItems[i];closePalette();if(c)c.run();}
$("palInput").oninput=()=>{palIdx=0;renderPalette();};
$("palInput").addEventListener("keydown",e=>{
  if(e.key==="Escape"){e.preventDefault();closePalette();}
  else if(e.key==="ArrowDown"){e.preventDefault();palIdx++;renderPalette();}
  else if(e.key==="ArrowUp"){e.preventDefault();palIdx--;renderPalette();}
  else if(e.key==="Enter"){e.preventDefault();runCommand(palIdx);}
});
$("palette").onclick=e=>{if(e.target===$("palette"))closePalette();};

/* ---------- the line under the filters: what this filter is for ---------- */
const LEADS={
  see:"<b>Tocca a te guardarle.</b> Spunta quelle che vuoi e ▶ pr-loop: le legge e ti propone cosa fare. Apri una riga per vedere cosa sa già il desk.",
  close:"<b>Già risolte da una PR mergiata.</b> Si chiudono con il commento che la nomina.",
  claude:"<b>Facili, in una fase sola, di nessuno.</b> issue-loop le porta a una PR ciascuna.",
};
function renderLead(){
  const el=$("lead");
  let html=DESK==="threads"?"":LEADS[view]||"";
  if(DESK==="pr"&&view==="see"&&waitingAuthor)html+=` <span>${waitingAuthor} PR aspettano l'autore dopo una tua richiesta: non tocca a te.</span>`;
  el.innerHTML=html;el.hidden=!html||!loaded;
}
function renderNotes(){
  const notes=[];
  if(DESK==="issue"){
    const unranked=shortlist?shortlist.rows.filter(r=>!r.impact).length:0;
    notes.push(!ranked?"Shortlist non ancora ordinata: per ora è in ordine di data."
      :unranked?`Shortlist ordinata in parte: ${unranked} entrate dopo l'ultimo ordinamento stanno in fondo.`
      :`Shortlist nell'ordine di risoluzione proposto${session?` · ${esc(session)}`:""}.`);
    const stale=issues.filter(r=>r.analysis_stale).length;
    if(stale)notes.push(`${stale} analisi da aggiornare: l'issue si è mossa dopo.`);
  }else{
    const missing=prs.filter(r=>r.triage_status==="missing").length;
    notes.push(`${prs.length} PR caricate${missing?` · ${missing} mai viste da pr-triage`:" · triage corrente"}${session?` · ${esc(session)}`:""}.`);
  }
  const p=(prepare||{})[DESK==="issue"?"issue":"pr"];
  if(p&&p.phrase)notes.push(`Preparazione: ${esc(p.phrase)}.`);
  if(truncated)notes.push(`<b>Coda troncata:</b> il provider dichiara ${truncated} PR e la pagina ne porta ${prs.length}.`);
  if(issuesTruncated)notes.push(`<b>Issue troncate:</b> il repo ne ha ${issuesTruncated} aperte e il desk ne ha lette ${issues.length+issuesWithPr+issuesTaken}.`);
  if(pendingMerge)notes.push("Lo stato di merge arriva un attimo dopo: la tabella si riempie da sola.");
  $("noteBox").innerHTML=notes.join(" · ");
}
function renderHeader(){
  document.title=`${scope.name||meta.repo||"Git"} · desk`;
  renderScope();renderSync();renderPrepare();renderLead();renderNotes();
}

function render(){
  renderHeader();renderTabs();renderTable();renderJobs();
  if(!$("palette").hidden)renderPalette();
}

/* ---------- theme ---------- */
function applyTheme(t){const root=document.documentElement;if(root&&root.dataset){if(t)root.dataset.theme=t;else delete root.dataset.theme;}}
function toggleTheme(){
  const root=document.documentElement;if(!root)return;
  const now=root.dataset.theme||(typeof matchMedia==="function"&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=now==="dark"?"light":"dark";applyTheme(next);
  try{localStorage.setItem("git-desk-theme",next);}catch(e){}
}
try{applyTheme(localStorage.getItem("git-desk-theme"));}catch(e){}

/* ---------- wiring ---------- */
$("q").oninput=e=>{query=e.target.value;selectFirst();render();};
$("btnFetch").onclick=()=>loadDesk(true);
$("btnTriage").onclick=doTriage;
$("btnRun").onclick=doRun;
$("btnPalette").onclick=openPalette;
$("btnTheme").onclick=toggleTheme;
$("btnLog").onclick=()=>toggleDrawer();
$("statusMsg").onclick=()=>toggleDrawer(true);
$("scopeBtn").onclick=ev=>{ev.stopPropagation();toggleScope();};
let lastKey=null,lastKeyAt=0;
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();$("palette").hidden?openPalette():closePalette();return;}
  if(!$("palette").hidden)return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){if(e.key==="Escape")e.target.blur();return;}
  const chord=lastKey==="g"&&Date.now()-lastKeyAt<900;
  lastKey=e.key;lastKeyAt=Date.now();
  if(chord&&(e.key==="p"||e.key==="i"||e.key==="t")){e.preventDefault();setMode({p:"pr",i:"issue",t:"threads"}[e.key]);return;}
  const r=selectedRow(),s=r&&stanceOf(r),live=s&&!s.sent&&!s.sending;
  if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault();moveSelection(1);}
  else if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();moveSelection(-1);}
  else if(e.key==="x"||e.key==="X"){
    e.preventDefault();
    if(selected!==null){togglePick(selected);lastPick=selected;}
  }
  else if(e.key==="Escape"){if(!$("scopePop").hidden)toggleScope(false);else if(openRow)toggleOpen(openRow);else if(picked.size)clearPicks();}
  else if(e.key==="Enter"&&picked.size){const b=$("pBulk");if(b){e.preventDefault();b.click();}}
  else if(e.key==="Enter"||e.key===" "){if(r){e.preventDefault();toggleOpen(r);}}
  else if(e.key==="s"&&picked.size){const t=chaseForPicked();if(t){e.preventDefault();copyText($("pChase"),t);}}
  else if(e.key==="l"&&picked.size){e.preventDefault();const b=$("pRun");if(b&&!b.disabled)b.click();}
  else if(e.key==="o"&&r&&r.url){e.preventDefault();window.open(r.url,"_blank");}
  else if(e.key==="a"&&live&&DESK==="pr"&&["approve","changes","doubt"].includes(s.step)){e.preventDefault();sendReview("approve",[r],null);}
  else if(e.key==="r"&&live&&DESK==="pr"&&["approve","changes","doubt"].includes(s.step)){e.preventDefault();sendReview("changes",[r],null);}
  else if(e.key==="/"){e.preventDefault();$("q").focus();}
});
document.addEventListener("click",e=>{
  const pop=$("scopePop");
  if(!pop.hidden&&e.target&&!pop.contains?.(e.target)&&e.target!==$("scopeBtn"))toggleScope(false);
});

$("btnTest").onclick=runTestMode;
async function runTestMode(){
  const box=$("testBox");toggleDrawer(true);
  const line=(id,label)=>box.insertAdjacentHTML("beforeend",`<div id="${id}" data-label="${label}"><span class="pending">…</span> ${label}</div>`);
  const setLine=(id,ok,extra)=>{const el=$(id);el.innerHTML=`<span class="${ok?"ok":"ko"}">${ok?"✓":"✗"}</span> ${esc(el.dataset.label)}${extra?` <span class="${ok?"pending":"ko"}">— ${esc(extra)}</span>`:""}`;};
  box.innerHTML=`<div><b>Modalità test</b> — desk → JSON → agente solo su richiesta</div>`;
  ["server del desk raggiungibile","provider autenticato","cache su disco","file di stato scrivibile","agente on-demand disponibile","ping locale"]
    .forEach((l,i)=>line("t"+i,l));
  try{
    const st=await fetch("/api/selftest").then(r=>r.json());
    setLine("t0",true,`timings: ${Object.entries(timings).map(([k,v])=>`${k} ${v.source} ${v.ms}ms`).join(" · ")||"—"}`);
    setLine("t1",st.provider.ok,st.provider.ok?"login "+st.provider.login:st.provider.error);
    setLine("t2",st.cache.ok,st.cache.ok?`dato di ${st.cache.age}s fa`:"vuota");
    setLine("t3",st.state_file.ok,st.state_file.ok?"":st.state_file.error);
    setLine("t4",st.agent.ok,st.agent.ok?st.agent.selected:st.agent.error);
    const token="t"+Date.now();
    const pong=await post("/api/ping",{token});
    setLine("t5",pong.pong===token,"nessun modello avviato");
  }catch(e){setLine("t0",false,e.message);}
}
let stopArmed=null;
$("btnStop").onclick=async()=>{
  const b=$("btnStop");
  if(!stopArmed){
    b.innerHTML='⏻<span class="lbl"> Confermi? clic di nuovo</span>';b.classList.add("armed");
    stopArmed=setTimeout(()=>{stopArmed=null;b.innerHTML='⏻<span class="lbl"> Chiudi il desk</span>';b.classList.remove("armed");},4000);
    return;
  }
  clearTimeout(stopArmed);stopArmed=null;b.textContent="fermo…";b.disabled=true;
  try{await post("/api/shutdown",{});}catch(e){}
  document.body.innerHTML='<div style="padding:40px;font:14px system-ui"><b>Server fermato.</b><br>Per ripartire, avvia <code>git-desk</code>.</div>';
};

if(typeof location!=="undefined"&&location.protocol==="file:"){
  document.body.innerHTML='<div style="padding:40px;font:14px system-ui"><b>Apri il desk dal server locale.</b><br>Usa la riga <code>desk on http://127.0.0.1:…</code> che il server stampa quando parte.</div>';
}else{
  render();
  loadDesk(false);
  setInterval(()=>loadDesk(false),POLL);
  setInterval(pollState,5000);
  // a background tab's timers are throttled, so the poll alone can leave any
  // age of render on screen: reconcile the moment it is looked at again
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="hidden")loadDesk(false);
  });
  setInterval(renderSync,5000);
}
