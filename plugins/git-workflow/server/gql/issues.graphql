query($o:String!,$r:String!,$after:String){
  repository(owner:$o,name:$r){
    issues(states:OPEN,first:100,after:$after,orderBy:{field:CREATED_AT,direction:DESC}){
      totalCount
      pageInfo{hasNextPage endCursor}
      nodes{
        number title createdAt updatedAt url author{login}
        labels(first:10){nodes{name}}
        assignees(first:5){nodes{login}}
        comments{totalCount}
        closedByPullRequestsReferences(first:5){nodes{number}}
        timelineItems(last:50,itemTypes:[CROSS_REFERENCED_EVENT]){
          nodes{... on CrossReferencedEvent{
            source{... on PullRequest{number state repository{nameWithOwner}}}}}
        }
      }
    }
  }
}
