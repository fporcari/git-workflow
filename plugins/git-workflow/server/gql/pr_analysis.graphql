query($owner:String!,$name:String!,$number:Int!){
  repository(owner:$owner,name:$name){
    pullRequest(number:$number){
      number title bodyText createdAt updatedAt url
      isDraft baseRefName headRefName headRefOid mergeStateStatus reviewDecision
      author{login}
      assignees(first:20){pageInfo{hasNextPage} nodes{login}}
      reviewRequests(first:100){
        pageInfo{hasNextPage}
        nodes{
          requestedReviewer{
            ...on User{login}
            ...on Team{slug}
          }
        }
      }
      reviews(first:100){
        totalCount pageInfo{hasNextPage}
        nodes{author{login} state bodyText submittedAt commit{oid}}
      }
      comments(first:100){
        totalCount pageInfo{hasNextPage}
        nodes{author{login} bodyText createdAt url}
      }
      reviewThreads(first:100){
        totalCount pageInfo{hasNextPage}
        nodes{
          isResolved
          comments(first:100){
            totalCount pageInfo{hasNextPage}
            nodes{author{login} bodyText createdAt path line url}
          }
        }
      }
      closingIssuesReferences(first:20){
        totalCount pageInfo{hasNextPage}
        nodes{
          number title bodyText url author{login}
          assignees(first:20){pageInfo{hasNextPage} nodes{login}}
        }
      }
      commits(last:1){
        nodes{
          commit{
            oid
            statusCheckRollup{
              state
              contexts(first:100){
                pageInfo{hasNextPage}
                nodes{
                  __typename
                  ...on CheckRun{name status conclusion detailsUrl}
                  ...on StatusContext{context state description targetUrl}
                }
              }
            }
          }
        }
      }
    }
  }
}
