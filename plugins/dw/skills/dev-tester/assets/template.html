<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --ground:#f7f8f7;
  --paper:#ffffff;
  --ink:#1c2328;
  --ink-soft:#4a565e;
  --rule:#d9dfdf;
  --rule-soft:#e9eded;
  --accent:#0e5c66;
  --accent-ink:#ffffff;
  --accent-soft:#e3f0f1;
  --watch:#8a5a00;
  --watch-bg:#fdf4df;
  --watch-rule:#ecd49a;
  --ok:#1f6b3a;
  --ok-bg:#e2f3e8;
  --ko:#a3261d;
  --ko-bg:#fbe5e2;
  --code-bg:#eef2f2;
  --field:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#12171a;
    --paper:#1a2125;
    --ink:#e4e9ea;
    --ink-soft:#a3b0b5;
    --rule:#33404a;
    --rule-soft:#27323a;
    --accent:#6cc3cc;
    --accent-ink:#0d1b1e;
    --accent-soft:#1d3438;
    --watch:#f0c46a;
    --watch-bg:#2e2616;
    --watch-rule:#5a4a26;
    --ok:#7fd19b;
    --ok-bg:#1b3325;
    --ko:#f19a90;
    --ko-bg:#3a1f1c;
    --code-bg:#242d33;
    --field:#141a1d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:32px 16px 64px;
}
.sheet{
  max-width:1040px;
  margin:0 auto;
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:6px;
  padding:40px clamp(18px,4vw,48px) 48px;
}
header.top{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;text-wrap:balance;letter-spacing:-.01em}
.meta{color:var(--ink-soft);font-size:13.5px;margin:0}
h2{
  font-size:20px;line-height:1.3;margin:44px 0 6px;text-wrap:balance;
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;
}
h2 .inst{font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:3px;letter-spacing:.02em}
h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin:22px 0 8px}
p{margin:0 0 12px;max-width:72ch}
.lead{font-size:16.5px;max-width:70ch}
a{color:var(--accent)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:3px}
table{font-variant-numeric:tabular-nums}

.fill{
  position:sticky;top:0;z-index:5;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;
  padding:12px 14px;margin:0 0 26px;
}
.fill label.who{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft)}
.fill input[type=text]{
  font:inherit;font-size:14px;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:3px;padding:6px 9px;width:14em;max-width:100%;
}
.progress{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}
.progress b{color:var(--ink)}
.progress .k-ok b{color:var(--ok)}
.progress .k-ko b{color:var(--ko)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
button{
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  border-radius:3px;padding:7px 13px;border:1px solid var(--accent);
}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.secondary{background:transparent;color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{font-size:13px;color:var(--ok);min-height:1.2em;flex-basis:100%;margin:0}
.toast.err{color:var(--ko)}

.tablewrap{overflow-x:auto;margin:10px 0 6px;border:1px solid var(--rule);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule-soft)}
thead th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:var(--ground);border-bottom:1px solid var(--rule);font-weight:600}
tbody tr:last-child td{border-bottom:none}
td.n{width:2.2em;color:var(--ink-soft);font-weight:600}
td.step{width:36%}
td.esito{width:13.5em}
tr[data-result="OK"] td.n{color:var(--ok)}
tr[data-result="KO"] td{background:var(--ko-bg)}
tr[data-result="KO"] td.n{color:var(--ko)}
.chip{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--watch);border:1px solid var(--watch-rule);background:var(--watch-bg);border-radius:3px;padding:1px 6px}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin:0 0 6px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.seg label + label span{border-left:1px solid var(--rule)}
.seg input:checked + span.v-ok{background:var(--ok-bg);color:var(--ok)}
.seg input:checked + span.v-ko{background:var(--ko);color:var(--paper)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
textarea{
  display:block;width:100%;min-height:2.4em;resize:vertical;
  font:inherit;font-size:13px;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:3px;padding:5px 7px;
}
textarea::placeholder,input::placeholder{color:var(--ink-soft);opacity:.75}

.watch{
  background:var(--watch-bg);border:1px solid var(--watch-rule);border-radius:4px;
  padding:14px 18px 6px;margin:18px 0 0;
}
.watch h3{color:var(--watch);margin:0 0 8px}
.watch ul{margin:0;padding-left:20px}
.watch li{margin:0 0 8px;max-width:78ch}
.answer{border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:12px 0 4px}
.answer > :last-child{margin-bottom:0}
.answer ul{margin:0 0 12px;padding-left:20px}
.answer li{margin:0 0 6px;max-width:72ch}
.open{border:1px dashed var(--rule);border-radius:4px;padding:10px 14px;margin:14px 0 0;color:var(--ink-soft);font-size:14px}
.open strong{color:var(--ink)}
.state{font-size:12.5px;font-weight:600;white-space:nowrap}
.state.done{color:var(--ok)}
.state.wait{color:var(--watch)}
.state.ko{color:var(--ko)}
#general-notes{min-height:5em;font-size:14px;max-width:72ch}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--rule);color:var(--ink-soft);font-size:12.5px}
@media (max-width:640px){
  body{padding:12px 16px 40px}
  .sheet{padding:24px 16px 32px;border-radius:0;border-left:none;border-right:none}
  h1{font-size:23px}
  td.step{width:auto}
  .actions{margin-left:0}
  .fill{position:static}
}
@media (prefers-reduced-motion: no-preference){
  tr td{transition:background-color .15s}
}
@media print{
  :root{--ground:#fff;--paper:#fff;--ink:#000;--ink-soft:#333;--rule:#999;--rule-soft:#ccc;--accent:#0e5c66;--accent-soft:#eef5f5;--watch:#6b4500;--watch-bg:#fff;--watch-rule:#999;--field:#fff;color-scheme:light}
  body{padding:0;font-size:11pt}
  .sheet{border:none;padding:0;max-width:none}
  .fill{position:static;border:none;padding:0}
  .actions,.toast{display:none}
  h2{break-after:avoid;margin-top:28px}
  tr,.watch{break-inside:avoid}
  a{color:inherit;text-decoration:none}
  .tablewrap{overflow:visible}
}
</style>
</head>
<body>
<main class="sheet" id="doc" data-doc-id="__DOC_ID__" data-doc-version="__DOC_VERSION__">
__BODY__
</main>
<script type="application/json" id="ui-labels">__UI__</script>
<script>
(function () {
  var L = JSON.parse(document.getElementById('ui-labels').textContent);
  var doc = document.getElementById('doc');
  var DOC_ID = doc.dataset.docId;
  var STORE_KEY = 'collaudo:' + DOC_ID + ':v' + doc.dataset.docVersion;
  var rows = Array.prototype.slice.call(doc.querySelectorAll('tr[data-step]'));
  var who = document.getElementById('filled-by');
  var general = document.getElementById('general-notes');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  function clean(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function fmt(s, v) { return s.replace(/\{(\w+)\}/g, function (m, k) { return v[k] !== undefined ? v[k] : m; }); }
  function stepText(tr) {
    var c = tr.querySelector('td.step').cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll('.chip'), function (x) { x.remove(); });
    return clean(c);
  }

  rows.forEach(function (tr) {
    var id = tr.dataset.step;
    var n = clean(tr.querySelector('td.n'));
    tr.querySelector('td.esito').innerHTML =
      '<div class="seg" role="radiogroup" aria-label="' + L.result + ' ' + n + '">' +
        '<label><input type="radio" name="' + id + '" id="' + id + '-ok" value="OK"><span class="v-ok">OK</span></label>' +
        '<label><input type="radio" name="' + id + '" id="' + id + '-ko" value="KO"><span class="v-ko">KO</span></label>' +
      '</div>' +
      '<textarea id="' + id + '-note" rows="1" placeholder="' + L.note + '" aria-label="' + L.note + ' ' + n + '"></textarea>';
  });

  function resultOf(tr) {
    var c = tr.querySelector('input[type=radio]:checked');
    return c ? c.value : null;
  }

  function state() {
    return {
      filled_by: who.value,
      general_notes: general.value,
      steps: rows.reduce(function (acc, tr) {
        var id = tr.dataset.step;
        acc[id] = { result: resultOf(tr), note: document.getElementById(id + '-note').value };
        return acc;
      }, {})
    };
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state())); } catch (e) {}
  }

  function restore() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { s = null; }
    if (!s) return;
    who.value = s.filled_by || '';
    general.value = s.general_notes || '';
    rows.forEach(function (tr) {
      var p = (s.steps || {})[tr.dataset.step];
      if (!p) return;
      if (p.result) {
        var r = document.getElementById(tr.dataset.step + '-' + p.result.toLowerCase());
        if (r) r.checked = true;
      }
      document.getElementById(tr.dataset.step + '-note').value = p.note || '';
    });
  }

  function refresh() {
    var ok = 0, ko = 0;
    rows.forEach(function (tr) {
      var r = resultOf(tr);
      if (r) tr.dataset.result = r; else delete tr.dataset.result;
      if (r === 'OK') ok++;
      if (r === 'KO') ko++;
    });
    document.getElementById('p-tot').textContent = rows.length;
    document.getElementById('p-done').textContent = ok + ko;
    document.getElementById('p-ok').textContent = ok;
    document.getElementById('p-ko').textContent = ko;
  }

  function buildJson() {
    var ok = 0, ko = 0;
    var cases = Array.prototype.slice.call(doc.querySelectorAll('section[data-case]')).map(function (sec) {
      var h2 = sec.querySelector('h2').cloneNode(true);
      var inst = h2.querySelector('.inst');
      if (inst) inst.remove();
      return {
        id: sec.dataset.case,
        title: clean(h2),
        instance: sec.dataset.instance || null,
        references: (sec.dataset.refs || '').split(',').filter(Boolean),
        steps: Array.prototype.slice.call(sec.querySelectorAll('tr[data-step]')).map(function (tr) {
          var r = resultOf(tr);
          if (r === 'OK') ok++;
          if (r === 'KO') ko++;
          return {
            id: tr.dataset.step,
            n: parseInt(clean(tr.querySelector('td.n')), 10),
            step: stepText(tr),
            expected: clean(tr.querySelector('td.exp')),
            modifies_data: tr.dataset.modifies === 'true',
            result: r,
            note: document.getElementById(tr.dataset.step + '-note').value.trim()
          };
        })
      };
    });
    return {
      schema: 'collaudo/1',
      document: clean(doc.querySelector('h1')),
      id: DOC_ID,
      version: parseInt(doc.dataset.docVersion, 10),
      lang: document.documentElement.lang,
      filled_by: who.value.trim(),
      exported_at: new Date().toISOString(),
      summary: { steps: rows.length, ok: ok, ko: ko, todo: rows.length - ok - ko },
      cases: cases,
      general_notes: general.value.trim()
    };
  }

  function say(msg, isErr) {
    toast.textContent = msg;
    toast.classList.toggle('err', !!isErr);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.textContent = ''; }, 6000);
  }

  function fileName(j) {
    var name = (j.filled_by || 'anon').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'anon';
    return DOC_ID + '_' + name + '_' + j.exported_at.slice(0, 16).replace(/[:T]/g, '-') + '.json';
  }

  document.getElementById('btn-export').addEventListener('click', function () {
    var j = buildJson();
    var text = JSON.stringify(j, null, 2);
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = fileName(j);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      var msg = fmt(L.exported, { file: a.download, done: j.summary.ok + j.summary.ko, total: j.summary.steps });
      if (!j.filled_by) msg += ' ' + L.missing_name;
      say(msg);
    } catch (e) {
      say(L.download_failed, true);
    }
  });

  document.getElementById('btn-copy').addEventListener('click', function () {
    var text = JSON.stringify(buildJson(), null, 2);
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) { done = false; }
      ta.remove();
      say(done ? L.copied : L.copy_failed, !done);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say(L.copied); }, fallback);
    } else {
      fallback();
    }
  });

  document.getElementById('fill').addEventListener('submit', function (e) { e.preventDefault(); });
  doc.addEventListener('input', function () { refresh(); save(); });
  doc.addEventListener('change', function () { refresh(); save(); });

  restore();
  refresh();
})();
</script>
</body>
</html>
